từ và dùng \"must\" cho quá khứ.'\n      },\n      errors:[\n        { q:0, cat:'grammar', quote:'you must go', fix:'you had to go', note:'Quá khứ của \"must\" là \"had to\".' },\n        { q:0, cat:'lexical', quote:'more easy', fix:'more easily', note:'Bổ nghĩa cho động từ cần trạng từ.' },\n        { q:1, cat:'grammar', quote:'practical thing', fix:'practical things', note:'Danh từ số nhiều.' },\n        { q:2, cat:'lexical', quote:'quite confident', fix:'quite confidently', note:'\"talk ... confidently\" — trạng từ.' }\n      ],\n      improved:[\n        'Definitely — it’s very different now. In the past you had to go to a class or find a teacher, but now you can learn almost anything online. My father learned to repair his motorbike just by watching videos. The downside is that people give up more easily now, because nobody is checking on them.',\n        'I think schools should teach more practical things, like managing money or speaking in public. When I left school I knew nothing about tax or saving, and I had to learn it all myself, which was quite stressful.',\n        'No, I don’t think so. My mother started learning English when she was fifty, and now she can talk to foreign customers quite confidently. It may take longer when you’re older, but it’s never impossible.',\n        'Yes, I think it benefits both sides. If the company pays for training, staff become more loyal and more skilled, so the company benefits too. On the other hand, some employers worry that people will leave once they finish the course.',\n        'It depends on the skill. For languages, I think a teacher is better because they correct your mistakes immediately, but for computer skills you can learn on your own with videos and plenty of practice.'\n      ]\n    }\n  ]\n};\n\nvar TEACHER = {\n  key:'teacher', name:'Ms. Hạnh', role:'IELTS Speaking examiner · IEC', graded:'6 October 2026',\n  parts:[\n    {\n      bands:{ fluency:6.0, pron:6.0, lexical:6.0, grammar:5.5 },\n      overview:'Bạn trả lời ngay, không ngập ngừng lâu, và luôn có lý do — đây là điểm mạnh. '\n             + 'Vấn đề lặp lại là danh từ số nhiều sau số đếm và từ chỉ lượng. Hãy kéo dài những câu quá ngắn thêm một ví dụ.',\n      notes:{\n        fluency:'Phản xạ nhanh, nối ý tốt. Một vài câu dừng hơi sớm.',\n        pron:'Phát âm rõ, dễ nghe. Chú ý âm cuối /s/ và /t/.',\n        lexical:'Từ vựng đủ dùng cho Part 1. Thử thay \"very reasonable\" bằng \"very affordable\".',\n        grammar:'Lỗi số nhiều lặp lại nhiều lần — đây là việc cần sửa trước tiên.'\n      },\n      errors:[\n        { q:0, cat:'grammar', quote:'two hour', fix:'two hours',\n          note:'Sau số đếm phải dùng số nhiều. Luyện: two hours, three days, four seasons.' },\n        { q:0, cat:'grammar', quote:'not so crowded like', fix:'not as crowded as',\n          note:'Cấu trúc so sánh bằng: as + adjective + as.' },\n        { q:1, cat:'grammar', quote:'many small restaurant', fix:'many small restaurants',\n          note:'\"many\" luôn đi với danh từ số nhiều.' },\n        { q:1, cat:'lexical', quote:'the price is very reasonable', fix:'the prices are very affordable',\n          note:'\"affordable\" tự nhiên hơn khi nói về giá đồ ăn.' },\n        { q:3, cat:'grammar', quote:'a company make cosmetics', fix:'a company that makes cosmetics',\n          note:'Cần mệnh đề quan hệ: a company that makes / a company making.' },\n        { q:5, cat:'fluency', quote:'or, um, maybe study abroad', fix:'or perhaps study abroad',\n          note:'Thay \"um\" bằng một từ nối thật: \"or perhaps\", \"or possibly\".' }\n      ]\n    },\n    {\n      bands:{ fluency:7.0, pron:6.0, lexical:6.5, grammar:6.5 },\n      overview:'Bạn nói gần đủ hai phút và bao quát cả bốn ý trên cue card — giám khảo chấm điều này đầu tiên. '\n             + 'Ý tưởng mạch lạc. Cần chú ý thì của động từ khi nói về dự định.',\n      notes:{\n        fluency:'Nói liền mạch gần hai phút, không bị tắc. Đây là band 7 thật sự.',\n        pron:'Rõ ràng, nhưng trọng âm từ dài còn chưa chắc: \"effective\", \"properly\".',\n        lexical:'Có cố gắng dùng từ khó. \"practising with a teacher\" dùng đúng.',\n        grammar:'Thì tương lai giả định còn lẫn: \"will join\" nên là \"would join\".'\n      },\n      errors:[\n        { q:0, cat:'grammar', quote:'will join', fix:'would join',\n          note:'Đang nói về dự định giả định nên dùng \"would\", không phải \"will\".' },\n        { q:0, cat:'grammar', quote:'three or four year', fix:'three or four years',\n          note:'Lại là lỗi số nhiều — giống Part 1.' },\n        { q:0, cat:'grammar', quote:'music make me relax', fix:'music helps me relax',\n          note:'\"music\" số ít nên động từ phải là \"makes\"; \"helps me relax\" tự nhiên hơn.' },\n        { q:0, cat:'pron', quote:'some simple song', fix:'some simple songs',\n          note:'Âm cuối /s/ bị nuốt. Luyện đọc to: songs, years, friends.' }\n      ]\n    },\n    {\n      bands:{ fluency:6.0, pron:6.0, lexical:6.5, grammar:6.0 },\n      overview:'Ý tưởng tốt và luôn có ví dụ thật — điểm mạnh của bạn ở Part 3. '\n             + 'Hãy dùng trạng từ thay cho tính từ, và mở rộng bằng \"on the other hand\".',\n      notes:{\n        fluency:'Trả lời dài hơn Part 1, đúng yêu cầu. Thỉnh thoảng lặp ý.',\n        pron:'Ổn định. Ngữ điệu còn hơi phẳng khi nêu quan điểm.',\n        lexical:'Dùng được \"give up\", \"practical\". Thiếu từ nối học thuật.',\n        grammar:'Nhầm tính từ/trạng từ: \"more easy\", \"quite confident\".'\n      },\n      errors:[\n        { q:0, cat:'grammar', quote:'you must go', fix:'you had to go',\n          note:'Nói về quá khứ nên dùng \"had to\", không phải \"must\".' },\n        { q:0, cat:'lexical', quote:'more easy', fix:'more easily',\n          note:'Bổ nghĩa cho động từ \"give up\" nên cần trạng từ.' },\n        { q:1, cat:'grammar', quote:'practical thing', fix:'practical things',\n          note:'Lỗi số nhiều lần thứ tư trong bài — ưu tiên sửa.' },\n        { q:2, cat:'lexical', quote:'quite confident', fix:'quite confidently',\n          note:'\"talk ... confidently\" — trạng từ bổ nghĩa cho \"talk\".' },\n        { q:3, cat:'fluency', quote:'both side', fix:'both sides',\n          note:'Thêm \"On the other hand,\" trước ý phản biện để câu trả lời mạch lạc hơn.' }\n      ]\n    }\n  ]\n};\n\n/* A single-part page keeps only that part's grading. */\nif (ONLY !== null){\n  ED.parts = [ED.parts[ONLY]];\n  TEACHER.parts = [TEACHER.parts[ONLY]];\n}\n\n/* Ed, drawn from the LearnED logo: blue body, white face, lime tuft. */\nfunction edSvg(size){\n  return '<svg class=\"edmark\" width=\"' + size + '\" height=\"' + size + '\" viewBox=\"0 0 100 100\" aria-hidden=\"true\">'\n    + '<path d=\"M30 93C13 93 7 80 11 63 17 39 34 13 58 9c19-3 29 10 25 31-3 16-10 32-16 44-5 8-17 9-37 9z\" fill=\"#4A63E7\"/>'\n    + '<path d=\"M70 6c9-2 17 0 17 6 0 7-3 13-6 17-3-8-6-15-11-23z\" fill=\"#DFF77A\" stroke=\"#1C1508\" stroke-width=\"0\"/>'\n    + '<ellipse cx=\"60\" cy=\"33\" rx=\"18\" ry=\"13\" transform=\"rotate(-14 60 33)\" fill=\"#fff\"/>'\n    + '<ellipse cx=\"56\" cy=\"37\" rx=\"2.8\" ry=\"3.6\" fill=\"#1C1508\"/>'\n    + '<ellipse cx=\"68\" cy=\"27\" rx=\"2.8\" ry=\"3.6\" fill=\"#1C1508\"/>'\n    + '<\/svg>';\n}\n\nfunction round5(v){ return Math.round(v * 2) / 2; }\nfunction partBand(pi, G){\n  var b = G.parts[pi].bands;\n  var vals = CRIT.map(function(c){ return b[c.key]; });\n  return round5(vals.reduce(function(a,x){ return a + x; }, 0) / vals.length);\n}\nfunction overallBand(G){\n  var vals = PARTS.map(function(p,i){ return partBand(i, G); });\n  return round5(vals.reduce(function(a,x){ return a + x; }, 0) / vals.length);\n}\nfunction critName(cls){\n  var c = CRIT.filter(function(x){ return x.cls === cls; })[0];\n  return c ? c.name : cls;\n}\n\n/* The grader's marks for one answer, shown under that answer. */\nfunction marksFor(pi, ai, G){\n  var list = G.parts[pi].errors.filter(function(e){ return e.q === ai; });\n  if (!list.length) return '<p class=\"noerr\">No errors marked in this answer.<\/p>';\n  return '<div class=\"marks\">' + list.map(function(e){\n    return '<div class=\"mark ' + e.cat + '\">'\n      + '<div class=\"marktop\"><span class=\"mtag ' + e.cat + '\">' + critName(e.cat) + '<\/span><\/div>'\n      + '<div class=\"mquote\">“' + esc(e.quote) + '”<\/div>'\n      + '<div class=\"mfix\"><b>Say it as<\/b>' + esc(e.fix) + '<\/div>'\n      + '<div class=\"mnote\"><b>' + esc(G.name) + '<\/b>' + esc(e.note) + '<\/div>'\n      + '<\/div>';\n  }).join('') + '<\/div>';\n}\n\n/* One part of the grading: bands, comments, then every answer with its marks.\n   Ed also gives a rewritten version of each answer (shown when the answer is the sample one,\n   since the rewrite in this mockup is written for the sample). */\nfunction addPartFeedback(pi, G){\n  var p = PARTS[pi], answers = state.log[pi], t = G.parts[pi], isEd = G.key === 'ed';\n  var el = document.createElement('div');\n  el.className = 'turn coach ' + G.key;\n\n  el.innerHTML =\n    '<div class=\"coachhead\"><span class=\"tag\">' + p.name + ' · ' + esc(p.desc) + '<\/span>'\n    + '<span class=\"pill ' + (isEd ? 'edband' : 'band') + '\">Band ' + partBand(pi, G).toFixed(1) + '<\/span><\/div>'\n    + '<p class=\"note\">' + esc(t.overview) + '<\/p>'\n    + '<div class=\"critgrid\">' + CRIT.map(function(c){\n        return '<div class=\"critcard ' + c.cls + '\">'\n          + '<div class=\"critrow\"><span class=\"critname\">' + c.name + '<\/span>'\n          + '<span class=\"critband\">' + t.bands[c.key].toFixed(1) + '<\/span><\/div>'\n          + '<p class=\"critnote\">' + esc(t.notes[c.key]) + '<\/p><\/div>';\n      }).join('') + '<\/div>'\n    + '<div class=\"recs\"><div class=\"k\">Your answers · ' + p.name + '<\/div>'\n    + answers.map(function(a, ai){\n        var key = pi + '-' + ai;\n        var label = p.kind === 'cue' ? 'LT' : 'Q' + (ai + 1);\n        var qtext = p.kind === 'cue' ? p.cue.title : p.questions[ai].q;\n        var sample = p.kind === 'cue' ? p.sample : p.questions[ai].sample;\n        var better = isEd && t.improved && t.improved[ai] && a.text === sample.trim()\n          ? '<div class=\"improved\"><div class=\"k\">Ed’s version · say it like this<\/div><p>' + esc(t.improved[ai]) + '<\/p><\/div>'\n          : '';\n        return '<div class=\"qblock\">'\n          + '<div class=\"qbhead\"><span class=\"reclab\">' + label + '<\/span>'\n            + '<span class=\"qbq\">' + esc(qtext) + '<\/span>'\n            + '<span class=\"qbw\">' + a.words + 'w<\/span><\/div>'\n          + '<div class=\"recrow\">'\n            + '<button class=\"miniplay\" data-play=\"' + key + '\" aria-label=\"Play your answer\">'\n              + '<svg viewBox=\"0 0 24 24\"><path d=\"M8 5v14l11-7z\"/><\/svg><\/button>'\n            + '<span class=\"bar\"><span class=\"barfill\" data-bar=\"' + key + '\"><\/span><\/span>'\n            + '<span class=\"ptime\" data-ptime=\"' + key + '\">' + clock(a.secs) + '<\/span>'\n          + '<\/div>'\n          + '<p class=\"qbscript\">' + esc(a.text) + '<\/p>'\n          + marksFor(pi, ai, G)\n          + better\n          + '<\/div>';\n      }).join('')\n    + '<\/div>';\n\n  thread.appendChild(el);\n}\n\n/* The examiner speaking between parts — still the test, not the coach. */\nfunction examinerSays(text, then){\n  var turn = document.createElement('div');\n  turn.className = 'turn';\n  turn.innerHTML = '<div class=\"ask\"><div class=\"quotemark\">&rdquo;<\/div><div class=\"bubble\">'\n    + '<div class=\"tag\">Examiner<\/div>'\n    + '<div class=\"dots\" aria-label=\"The examiner is speaking\"><i><\/i><i><\/i><i><\/i><\/div>'\n    + '<\/div><\/div>';\n  thread.appendChild(turn);\n  scrollDown();\n\n  setTimeout(function(){\n    turn.querySelector('.bubble').innerHTML =\n      '<div class=\"tag\">Examiner<\/div>'\n      + '<div class=\"askrow\">'\n      + '<button class=\"hearbtn\" aria-label=\"Hear this again\"><svg viewBox=\"0 0 24 24\"><path d=\"M8 5v14l11-7z\"/><\/svg><\/button>'\n      + '<p class=\"say\">' + esc(text) + '<\/p><\/div>';\n    scrollDown();\n    if (then) setTimeout(then, 700);\n  }, 1000);\n}\n\n/* The test ends with the examiner's closing line and nothing else. The student sees only the\n   conversation they just had. Finish opens the \"who grades it?\" popup. */\nfunction endTest(){\n  state.stage = 'closing';\n  renderRail();\n  renderComposer();\n  examinerSays(SCRIPT.closing, function(){\n    state.stage = 'ended';\n    renderRail();\n    renderComposer();\n    scrollDown();\n  });\n}\n\n/* ============================ who grades it? ============================ */\nvar picker = document.getElementById('picker');\nvar lastFocus = null;\n\nfunction answerCount(){\n  return state.log.reduce(function(n, ans){ return n + ans.length; }, 0);\n}\n\nfunction openPicker(){\n  var n = answerCount();\n  document.getElementById('pickEyebrow').textContent = (ONLY === null ? 'Full test' : PARTS[0].name) + ' finished';\n  document.getElementById('pickLede').textContent = 'Your ' + n + ' answer' + (n === 1 ? ' is' : 's are')\n    + ' saved. Choose who grades ' + (ONLY === null ? 'this test' : 'this part') + '.';\n  document.getElementById('pickEdFace').innerHTML = edSvg(46);\n  lastFocus = document.activeElement;\n  picker.hidden = false;\n  document.getElementById('pickEd').focus();\n}\nfunction closePicker(){\n  picker.hidden = true;\n  if (lastFocus && lastFocus.focus) lastFocus.focus();\n}\n\ndocument.getElementById('pickEd').addEventListener('click', function(){ closePicker(); sendToEd(); });\ndocument.getElementById('pickTeacher').addEventListener('click', function(){ closePicker(); sendToTeacher(); });\ndocument.getElementById('pickCancel').addEventListener('click', closePicker);\npicker.addEventListener('click', function(e){ if (e.target === picker) closePicker(); });\ndocument.addEventListener('keydown', function(e){ if (e.key === 'Escape' && !picker.hidden) closePicker(); });\n\n/* ---------------- path 1: Ed grades it now ---------------- */\nfunction sendToEd(hold){\n  state.graders.push('ed');\n  state.stage = 'analysing';\n  renderComposer();\n\n  var el = document.createElement('div');\n  el.className = 'turn coach ed';\n  el.innerHTML = '<div class=\"edgrading\"><span class=\"edtile\" style=\"width:68px;height:68px\">' + edSvg(52) + '<\/span>'\n    + '<div><div class=\"coachhead\" style=\"margin:0 0 4px\"><span class=\"tag\">Ed is grading<\/span>'\n    + '<span class=\"pill\">Listening to ' + answerCount() + ' answers…<\/span><\/div>'\n    + '<div class=\"dots\"><i><\/i><i><\/i><i><\/i><\/div><\/div><\/div>';\n  thread.appendChild(el);\n  scrollDown();\n\n  if (hold) return;      /* preset: keep Ed mid-grading */\n  setTimeout(function(){\n    el.remove();\n    showGrading(ED);\n  }, 1800);\n}\n\n/* ---------------- path 2: the teacher grades it later ---------------- */\nfunction sendToTeacher(){\n  state.graders.push('teacher');\n  teacherStatus = 'waiting';\n\n  var el = document.createElement('div');\n  el.className = 'turn sentcard';\n  el.id = 'sentCard';\n  el.innerHTML = '<span class=\"av\">MH<\/span><div class=\"body\">'\n    + '<h2>Ms. Hạnh has received your submission<\/h2>'\n    + '<p>' + (ONLY === null ? 'Your full test' : 'Your ' + PARTS[0].name) + ' — ' + answerCount()\n    + (answerCount() === 1 ? ' recording' : ' recordings') + ' — is with your teacher. '\n    + 'You’ll get a notification when the grading is ready, usually within 48 hours. You can close this page; nothing will be lost.<\/p>'\n    + '<div class=\"steps\" id=\"sentSteps\">' + stepsHtml() + '<\/div><\/div>';\n  thread.appendChild(el);\n\n  state.finished = true;\n  state.stage = 'waiting';\n  renderRail();\n  renderComposer();\n  scrollDown();\n}\n\nfunction stepsHtml(){\n  var returned = teacherStatus === 'returned' || teacherStatus === 'shown';\n  return '<span class=\"step done\"><i><\/i>Submitted · just now<\/span>'\n    + '<span class=\"step ' + (returned ? 'done' : 'now') + '\"><i><\/i>' + (returned ? 'Graded' : 'Being graded') + '<\/span>'\n    + '<span class=\"step ' + (returned ? 'done' : '') + '\"><i><\/i>Returned to you<\/span>';\n}\n\n/* Demo only: stands in for the teacher pressing \"Send to student\" on the grading screen. */\nfunction teacherReturns(){\n  teacherStatus = 'returned';\n  var steps = document.getElementById('sentSteps');\n  if (steps) steps.innerHTML = stepsHtml();\n  var card = document.getElementById('sentCard');\n  if (card){\n    card.querySelector('h2').textContent = 'Ms. Hạnh has graded your submission';\n    card.querySelector('p').textContent = 'Your bands, her comments and every correction are ready to view.';\n  }\n  renderComposer();\n  document.getElementById('notice').hidden = false;\n  document.getElementById('noticeBtn').focus();\n}\n\nfunction openTeacherGrading(instant){\n  document.getElementById('notice').hidden = true;\n  if (teacherStatus !== 'returned') return;\n  teacherStatus = 'shown';\n  var steps = document.getElementById('sentSteps');\n  if (steps) steps.innerHTML = stepsHtml();\n  state.stage = 'analysing';\n  renderComposer();\n\n  var el = document.createElement('div');\n  el.className = 'turn coach';\n  el.innerHTML = '<div class=\"coachhead\"><span class=\"tag\">Teacher feedback<\/span>'\n    + '<span class=\"pill\">Opening your teacher’s notes…<\/span><\/div>'\n    + '<div class=\"dots\"><i><\/i><i><\/i><i><\/i><\/div>';\n  thread.appendChild(el);\n  scrollDown();\n\n  setTimeout(function(){\n    el.remove();\n    showGrading(TEACHER, instant);\n  }, instant ? 0 : 1100);\n}\ndocument.getElementById('noticeBtn').addEventListener('click', function(){ openTeacherGrading(); });\n\n/* ---------------- the graded view, same for both ---------------- */\nfunction showGrading(G, instant){\n  var mark = document.createElement('div');\n  mark.id = 'grading-' + G.key;\n  thread.appendChild(mark);\n  divider((G.key === 'ed' ? 'Graded by Ed' : 'Teacher feedback · ' + G.name), true);\n  addWrapUp(G);\n  PARTS.forEach(function(p,i){ addPartFeedback(i, G); });\n  wirePlayback();\n  state.finished = true;\n  state.stage = 'done';\n  renderRail();\n  renderComposer();\n  mark.scrollIntoView({ behavior: instant ? 'auto' : 'smooth', block:'start' });\n}\n\n/* ---------------- playback, inside the feedback panel only ----------------\n   The conversation above stays text. Every recording is replayed from here. */\n/* Question on top, its recording under it, then what the student actually said. */\nfunction recordingsHtml(pi){\n  var p = PARTS[pi], answers = state.log[pi];\n  if (!answers.length) return '';\n  return '<div class=\"recs\"><div class=\"k\">Your answers · ' + p.name + '<\/div>'\n    + answers.map(function(a, ai){\n        var key = pi + '-' + ai;\n        var label = p.kind === 'cue' ? 'LT' : 'Q' + (ai + 1);\n        var qtext = p.kind === 'cue' ? p.cue.title : p.questions[ai].q;\n        return '<div class=\"qblock\">'\n          + '<div class=\"qbhead\"><span class=\"reclab\">' + label + '<\/span>'\n            + '<span class=\"qbq\">' + esc(qtext) + '<\/span>'\n            + '<span class=\"qbw\">' + a.words + 'w<\/span>'\n            + (a.words < SHORT_ANSWER ? '<span class=\"flag\">Too short<\/span>' : '')\n          + '<\/div>'\n          + '<div class=\"recrow\">'\n            + '<button class=\"miniplay\" data-play=\"' + key + '\" aria-label=\"Play your answer\">'\n              + '<svg viewBox=\"0 0 24 24\"><path d=\"M8 5v14l11-7z\"/><\/svg><\/button>'\n            + '<span class=\"bar\"><span class=\"barfill\" data-bar=\"' + key + '\"><\/span><\/span>'\n            + '<span class=\"ptime\" data-ptime=\"' + key + '\">' + clock(a.secs) + '<\/span>'\n          + '<\/div>'\n          + '<p class=\"qbscript\">' + esc(a.text) + '<\/p>'\n          + '<\/div>';\n      }).join('')\n    + '<\/div>';\n}\n\nfunction wirePlayback(){\n  thread.querySelectorAll('[data-play]').forEach(function(btn){\n    if (btn.dataset.wired) return;\n    btn.dataset.wired = '1';\n    btn.addEventListener('click', function(){ playAnswer(btn.dataset.play); });\n  });\n}\n\nfunction playAnswer(key){\n  var bits = key.split('-'), a = state.log[+bits[0]][+bits[1]];\n  if (!a) return;\n\n  if (state.playing === key){ stopPlayback(); return; }\n  stopPlayback();\n\n  state.playing = key;\n  state.playPos = 0;\n  setPlayIcon(key, true);\n\n  state.playTimer = setInterval(function(){\n    state.playPos += 0.25;\n    var fill = thread.querySelector('[data-bar=\"' + key + '\"]');\n    var t = thread.querySelector('[data-ptime=\"' + key + '\"]');\n    if (fill) fill.style.width = Math.min(100, (state.playPos / Math.max(1, a.secs)) * 100) + '%';\n    if (t) t.textContent = clock(Math.min(a.secs, state.playPos)) + ' / ' + clock(a.secs);\n    if (state.playPos >= a.secs) stopPlayback(true);\n  }, 250);\n}\n\nfunction stopPlayback(ended){\n  clearInterval(state.playTimer);\n  state.playTimer = null;\n  var key = state.playing;\n  if (key){\n    setPlayIcon(key, false);\n    if (ended){\n      var bits = key.split('-'), a = state.log[+bits[0]][+bits[1]];\n      var fill = thread.querySelector('[data-bar=\"' + key + '\"]');\n      var t = thread.querySelector('[data-ptime=\"' + key + '\"]');\n      if (fill) fill.style.width = '0%';\n      if (t && a) t.textContent = clock(a.secs);\n    }\n  }\n  state.playing = null;\n}\n\nfunction setPlayIcon(key, playing){\n  var btn = thread.querySelector('[data-play=\"' + key + '\"]');\n  if (!btn) return;\n  btn.innerHTML = playing\n    ? '<svg viewBox=\"0 0 24 24\"><path d=\"M6 5h4v14H6zM14 5h4v14h-4z\"/><\/svg>'\n    : '<svg viewBox=\"0 0 24 24\"><path d=\"M8 5v14l11-7z\"/><\/svg>';\n}\n\nfunction addWrapUp(G){\n  var tw = 0, ts = 0, tf = 0, answered = 0, total = 0, parts = 0;\n  PARTS.forEach(function(p,i){\n    total += qCount(p);\n    if (state.log[i].length === qCount(p)) parts++;\n    state.log[i].forEach(function(a){ tw += a.words; ts += a.secs; tf += countFillers(a.text); answered++; });\n  });\n  var el = document.createElement('div');\n  var isEd = G.key === 'ed';\n  el.className = 'turn gradehead' + (isEd ? ' ed' : '');\n  el.innerHTML =\n    '<div class=\"who\">' + (isEd ? '<span class=\"edtile\">' + edSvg(52) + '<\/span>' : '') + '<div>'\n      + '<div class=\"lbl\">' + (isEd ? 'Graded by Ed' : 'Graded by your teacher') + '<\/div>'\n      + '<h2>' + esc(G.name) + '<\/h2>'\n      + '<p class=\"sub\">' + esc(G.role) + ' · marked ' + esc(G.graded) + '<br>'\n      + answered + ' answers · ' + clock(ts) + ' of speaking · ' + tw + ' words<\/p><\/div><\/div>'\n    + (PARTS.length > 1 ? '<div class=\"bands\">' + PARTS.map(function(p,i){\n        return '<div class=\"pb\"><span class=\"n\">' + p.name + '<\/span>'\n          + '<span class=\"v\">' + partBand(i, G).toFixed(1) + '<\/span><\/div>';\n      }).join('') + '<\/div>' : '')\n    + '<div class=\"overall\"><div class=\"n\">' + (PARTS.length > 1 ? 'Overall band' : PARTS[0].name + ' band') + '<\/div>'\n      + '<div class=\"v\">' + overallBand(G).toFixed(1) + '<\/div><\/div>';\n  thread.appendChild(el);\n}\n\n/* ============================ composer ============================ */\nfunction renderComposer(){\n  if (state.stage === 'analysing') return renderWaitBar();\n  if (state.finished) return renderComplete();\n  if (state.stage === 'ended') return renderEndedBar();\n  if (state.stage === 'moving' || state.stage === 'closing' || state.stage === 'analysing') return renderWaitBar();\n  if (state.stage === 'prep') return renderPrep();\n\n  var p = part(), answering = state.stage === 'answering', isCue = p.kind === 'cue';\n  var hint = state.recording ? clock(state.seconds) + (isCue ? ' / 2:00' : ' · tap to stop')\n            : (state.seconds > 0 ? clock(state.seconds) + ' saved' : 'Tap to answer');\n\n  composer.innerHTML =\n    '<div class=\"micwrap\">'\n      + '<button class=\"mic' + (state.recording ? ' live' : '') + '\" id=\"micBtn\"' + (answering ? '' : ' disabled') + ' aria-label=\"Record your answer\">'\n        + '<svg viewBox=\"0 0 24 24\"><rect x=\"9\" y=\"3\" width=\"6\" height=\"11\" rx=\"3\"/><path d=\"M5 11a7 7 0 0 0 14 0M12 18v3\"/><\/svg><\/button>'\n      + '<span class=\"miclab\" id=\"micLab\">' + (state.recording ? 'Recording' : (state.seconds > 0 ? 'Recorded' : 'Ready')) + '<\/span>'\n      + '<span class=\"michint\" id=\"micHint\">' + hint + '<\/span>'\n    + '<\/div>'\n    + '<div class=\"writer\">'\n      + '<textarea class=\"answerbox\" id=\"answer\" ' + (answering ? '' : 'disabled ')\n        + 'placeholder=\"' + (isCue ? 'Speak for one to two minutes. Your speech appears here as you talk.'\n                                   : 'Your speech appears here as you talk. You can correct it before sending.') + '\"><\/textarea>'\n      + '<div class=\"writerbar\">'\n        + '<span class=\"count\" id=\"count\">0 words<\/span>'\n        + '<button class=\"linkbtn\" id=\"sampleBtn\">Load sample answer<\/button>'\n        + '<button class=\"act\" id=\"sendBtn\" disabled>'\n        + (isCue ? 'Finish long turn' : (state.q + 1 < p.questions.length ? 'Next question' : 'Finish ' + p.name))\n        + ' <svg viewBox=\"0 0 24 24\"><path d=\"M5 12h14M13 6l6 6-6 6\"/><\/svg><\/button>'\n      + '<\/div>'\n    + '<\/div>';\n\n  var box = document.getElementById('answer');\n  box.value = state.draft || '';\n  updateCount();\n  box.addEventListener('input', function(){ state.draft = box.value; updateCount(); });\n  document.getElementById('micBtn').addEventListener('click', toggleRecord);\n  document.getElementById('sampleBtn').addEventListener('click', loadSample);\n  document.getElementById('sendBtn').addEventListener('click', send);\n}\n\nfunction renderPrep(){\n  composer.innerHTML =\n    '<div class=\"prepwrap\">'\n      + '<div class=\"prepdial' + (state.prepLeft <= 15 ? ' low' : '') + '\" id=\"prepDial\">' + clock(state.prepLeft) + '<\/div>'\n      + '<span class=\"miclab\">Preparing<\/span><span class=\"michint\">1 minute<\/span><\/div>'\n    + '<div class=\"writer\">'\n      + '<textarea class=\"answerbox\" id=\"notes\" placeholder=\"Make notes here, as you would on the paper the examiner gives you. Notes are not graded.\"><\/textarea>'\n      + '<div class=\"writerbar\"><span class=\"count\">Notes are private<\/span>'\n        + '<button class=\"act\" id=\"startBtn\">Start speaking now'\n        + ' <svg viewBox=\"0 0 24 24\"><path d=\"M5 12h14M13 6l6 6-6 6\"/><\/svg><\/button><\/div>'\n    + '<\/div>';\n  var n = document.getElementById('notes');\n  n.value = state.notes;\n  n.addEventListener('input', function(){ state.notes = n.value; });\n  document.getElementById('startBtn').addEventListener('click', endPrep);\n}\n\n/* While the examiner is moving between parts, or closing the test. */\nfunction renderWaitBar(){\n  var msg = state.stage === 'analysing'\n    ? (teacherStatus === 'shown' ? 'Loading your teacher’s feedback…' : 'Ed is grading your answers…')\n    : state.stage === 'closing' ? 'The examiner is finishing the test…'\n    : 'The examiner is moving on to the next part…';\n  composer.innerHTML =\n    '<div class=\"prepwrap\">'\n      + '<div class=\"prepdial\"><svg viewBox=\"0 0 24 24\"><path d=\"M12 6v6l4 2\"/><circle cx=\"12\" cy=\"12\" r=\"9\"/><\/svg><\/div>'\n      + '<span class=\"miclab\">Listening<\/span><span class=\"michint\">Please wait<\/span><\/div>'\n    + '<div class=\"writer\">'\n      + '<div class=\"saved\"><span>' + msg + '<\/span><\/div>'\n      + '<div class=\"writerbar\"><span class=\"count\">Your microphone is off while the examiner speaks<\/span><\/div>'\n    + '<\/div>';\n}\n\n/* The test is over. Nothing graded yet — Finish asks who should grade it. */\nfunction renderEndedBar(){\n  var tw = 0, ts = 0, n = 0;\n  state.log.forEach(function(ans){ ans.forEach(function(a){ tw += a.words; ts += a.secs; n++; }); });\n  composer.innerHTML =\n    '<div class=\"donewrap\">'\n      + '<div class=\"prepdial\"><svg viewBox=\"0 0 24 24\"><path d=\"M5 13l4 4L19 7\"/><\/svg><\/div>'\n      + '<span class=\"miclab\">Test over<\/span><span class=\"michint\">' + n + ' answers saved<\/span><\/div>'\n    + '<div class=\"writer\">'\n      + '<div class=\"saved\"><span>The interview is complete. All speaking files have been saved. '\n      + 'Press Finish to send it to Ed for instant grading, or to your teacher.<\/span>'\n        + '<button class=\"act\" id=\"finishBtn\">'\n        + '<svg viewBox=\"0 0 24 24\"><path d=\"M5 13l4 4L19 7\"/><\/svg> Finish<\/button><\/div>'\n      + '<div class=\"writerbar\"><span class=\"count\">' + tw + ' words · ' + clock(ts) + ' spoken<\/span>'\n        + '<button class=\"act ghost\" id=\"leaveBtn\">'\n        + '<svg viewBox=\"0 0 24 24\"><path d=\"M3 12a9 9 0 1 0 3-6.7M3 4v5h5\"/><\/svg> Take the test again<\/button><\/div>'\n    + '<\/div>';\n  document.getElementById('finishBtn').addEventListener('click', openPicker);\n  document.getElementById('leaveBtn').addEventListener('click', restart);\n}\n\n/* After Finish. Three cases: waiting on the teacher, teacher's grading ready to open,\n   or a grading on screen (Ed's, the teacher's, or both). */\nfunction renderComplete(){\n  var tw = 0;\n  state.log.forEach(function(ans){ ans.forEach(function(a){ tw += a.words; }); });\n  var hasEd = state.graders.indexOf('ed') > -1, hasTeacher = state.graders.indexOf('teacher') > -1;\n\n  var lab, hint, msg, main, extra = '';\n  if (teacherStatus === 'waiting'){\n    lab = 'Submitted'; hint = 'With Ms. Hạnh';\n    msg = 'Your teacher has your submission. We’ll notify you when the grading is ready.';\n    main = '<button class=\"act ghost\" id=\"topBtn\"><svg viewBox=\"0 0 24 24\"><path d=\"M12 19V5M6 11l6-6 6 6\"/><\/svg> Back to the top<\/button>';\n    extra = '<button class=\"demo\" id=\"demoBtn\">Demo: teacher sends the grading back<\/button>';\n  } else if (teacherStatus === 'returned'){\n    lab = 'Graded'; hint = 'Ready to view';\n    msg = 'Ms. Hạnh has graded your ' + (ONLY === null ? 'test' : PARTS[0].name) + '.';\n    main = '<button class=\"act\" id=\"viewBtn\">View teacher grading <svg viewBox=\"0 0 24 24\"><path d=\"M5 12h14M13 6l6 6-6 6\"/><\/svg><\/button>';\n  } else {\n    lab = 'Complete'; hint = 'Tap to practise again';\n    msg = (teacherStatus === 'shown' ? 'Your teacher’s grading is below.' : 'Ed’s grading is below.')\n      + ' Each answer shows what was marked on it.';\n    main = '<button class=\"act\" id=\"topBtn\"><svg viewBox=\"0 0 24 24\"><path d=\"M12 19V5M6 11l6-6 6 6\"/><\/svg> Back to the top<\/button>';\n    if (hasEd && !hasTeacher)\n      extra = '<button class=\"act ghost\" id=\"alsoTeacherBtn\" style=\"margin-left:0\">Also send to your teacher<\/button>';\n  }\n\n  composer.innerHTML =\n    '<div class=\"donewrap\">'\n      + (teacherStatus === 'waiting'\n          ? '<div class=\"prepdial\"><svg viewBox=\"0 0 24 24\"><path d=\"M12 6v6l4 2\"/><circle cx=\"12\" cy=\"12\" r=\"9\"/><\/svg><\/div>'\n          : '<button class=\"donebtn\" id=\"againBtn\" aria-label=\"Practise again\"><svg viewBox=\"0 0 24 24\"><path d=\"M5 13l4 4L19 7\"/><\/svg><\/button>')\n      + '<span class=\"miclab\">' + lab + '<\/span><span class=\"michint\">' + hint + '<\/span><\/div>'\n    + '<div class=\"writer\">'\n      + '<div class=\"saved\"><span>' + msg + '<\/span>' + main + '<\/div>'\n      + '<div class=\"writerbar\"><span class=\"count\">' + tw + ' words spoken<\/span>' + extra\n        + '<button class=\"act ghost\" id=\"restartBtn\">'\n        + '<svg viewBox=\"0 0 24 24\"><path d=\"M3 12a9 9 0 1 0 3-6.7M3 4v5h5\"/><\/svg> Practise from the beginning<\/button><\/div>'\n    + '<\/div>';\n\n  function on(id, fn){ var b = document.getElementById(id); if (b) b.addEventListener('click', fn); }\n  on('againBtn', restart);\n  on('restartBtn', restart);\n  on('topBtn', function(){ thread.scrollTo({ top:0, behavior:'smooth' }); });\n  on('demoBtn', teacherReturns);\n  on('viewBtn', function(){ openTeacherGrading(); });\n  on('alsoTeacherBtn', sendToTeacher);\n}\n\nfunction updateCount(){\n  var box = document.getElementById('answer');\n  if (!box) return;\n  var n = words(box.value).length;\n  document.getElementById('count').textContent = n + (n === 1 ? ' word' : ' words');\n  var b = document.getElementById('sendBtn');\n  if (b) b.disabled = n === 0;\n}\n\n/* ============================ actions ============================ */\nfunction toggleRecord(){\n  var isCue = part().kind === 'cue';\n  if (state.recording){\n    state.recording = false;\n    clearInterval(state.timer); state.timer = null;\n    var b = document.getElementById('micBtn');\n    if (b){\n      b.className = 'mic';\n      document.getElementById('micLab').textContent = 'Recorded';\n      document.getElementById('micHint').textContent = clock(state.seconds) + ' saved';\n    }\n  } else {\n    state.recording = true;\n    state.seconds = 0;\n    document.getElementById('micBtn').className = 'mic live';\n    document.getElementById('micLab').textContent = 'Recording';\n    state.timer = setInterval(function(){\n      state.seconds++;\n      var h = document.getElementById('micHint');\n      if (h) h.textContent = clock(state.seconds) + (isCue ? ' / 2:00' : ' · tap to stop');\n      if (isCue && state.seconds >= 120) toggleRecord();\n    }, 1000);\n  }\n}\n\nfunction startPrep(){\n  state.stage = 'prep';\n  state.prepLeft = PREP_SECONDS;\n  renderRail();\n  renderComposer();\n  state.prepTimer = setInterval(function(){\n    state.prepLeft--;\n    var d = document.getElementById('prepDial');\n    if (d){\n      d.textContent = clock(state.prepLeft);\n      d.className = 'prepdial' + (state.prepLeft <= 15 ? ' low' : '');\n    }\n    if (state.prepLeft <= 0) endPrep();\n  }, 1000);\n}\n\nfunction endPrep(){\n  clearInterval(state.prepTimer); state.prepTimer = null;\n  state.stage = 'answering';\n  renderRail();\n  renderComposer();\n}\n\nfunction loadSample(){\n  var p = part(), box = document.getElementById('answer');\n  box.value = p.kind === 'cue' ? p.sample : p.questions[state.q].sample;\n  state.draft = box.value;\n  if (state.seconds === 0){\n    state.seconds = Math.round(words(box.value).length / (p.kind === 'cue' ? 1.3 : 2.1));\n    document.getElementById('micLab').textContent = 'Recorded';\n    document.getElementById('micHint').textContent = clock(state.seconds) + ' saved';\n  }\n  updateCount();\n  box.focus();\n}\n\nfunction send(){\n  var p = part(), box = document.getElementById('answer');\n  var text = box.value.trim();\n  if (!text) return;\n  if (state.recording) toggleRecord();\n\n  state.log[state.p].push({ text:text, words:words(text).length, secs:state.seconds });\n  addAnswer(text, state.seconds, p.kind === 'cue' ? p.name + ' · Long turn' : p.name + ' · Question ' + (state.q + 1));\n  state.draft = '';\n  state.seconds = 0;\n\n  if (p.kind === 'questions' && state.q + 1 < p.questions.length){\n    state.q++;\n    state.stage = 'asking';\n    renderRail();\n    renderComposer();\n    setTimeout(askQuestion, 450);\n  } else if (state.p + 1 < PARTS.length){\n    nextPart();\n  } else {\n    endTest();\n  }\n}\n\n/* The examiner introduces the next part and carries straight on — no pause, no coach. */\nfunction nextPart(){\n  state.stage = 'moving';\n  renderRail();\n  renderComposer();\n\n  examinerSays(state.p === 0 ? SCRIPT.toPart2 : SCRIPT.toPart3, function(){\n    state.p++;\n    state.q = 0;\n    state.seconds = 0;\n    state.notes = '';\n    state.stage = 'asking';\n    renderRail();\n    renderComposer();\n    divider(PARTS[state.p].name + ' · ' + PARTS[state.p].desc, true);\n    if (part().kind === 'cue') setTimeout(showCue, 350);\n    else setTimeout(askQuestion, 350);\n  });\n}\n\nfunction restart(){\n  clearInterval(state.timer); clearInterval(state.prepTimer); clearInterval(state.playTimer);\n  state = { p:0, q:0, stage:'asking', recording:false, seconds:0, timer:null, prepTimer:null,\n            prepLeft:PREP_SECONDS, draft:'', notes:'', log:PARTS.map(function(){ return []; }), finished:false,\n            playing:null, playTimer:null, playPos:0, graders:[] };\n  teacherStatus = null;\n  picker.hidden = true;\n  document.getElementById('notice').hidden = true;\n  thread.innerHTML = '';\n  start();\n}\n\n/* Opens on the first part. Part 2 starts with the task card, not a question. */\nfunction start(){\n  renderRail();\n  renderComposer();\n  divider(PARTS[0].name + ' · ' + PARTS[0].desc, true);\n  if (part().kind === 'cue') setTimeout(showCue, 350);\n  else askQuestion();\n}\n\ndocument.getElementById('endBtn').addEventListener('click', restart);\ndocument.getElementById('replayBtn').addEventListener('click', scrollDown);\n\n/* ============================ preset (workflow explorer) ============================\n   The workflow page opens this screen at one moment by setting window.__AT (or #at=... in the\n   URL). The test is fast-forwarded with the sample answers, then moved to that moment:\n   finished · picker · ed-grading · ed · sent · returned · teacher. */\nvar AT = window.__AT || (location.hash.match(/at=([\\w-]+)/) || [])[1] || '';\n\nfunction staticExaminer(tag, text){\n  var turn = document.createElement('div');\n  turn.className = 'turn';\n  turn.innerHTML = '<div class=\"ask\"><div class=\"quotemark\">&rdquo;<\/div><div class=\"bubble\">'\n    + '<div class=\"tag\">' + esc(tag) + '<\/div><div class=\"askrow\">'\n    + '<button class=\"hearbtn\" aria-label=\"Hear this again\"><svg viewBox=\"0 0 24 24\"><path d=\"M8 5v14l11-7z\"/><\/svg><\/button>'\n    + '<p class=\"say\">' + esc(text) + '<\/p><\/div><\/div><\/div>';\n  thread.appendChild(turn);\n}\n\nfunction fastForward(){\n  thread.innerHTML = '';\n  PARTS.forEach(function(p, pi){\n    state.p = pi;\n    if (pi > 0) staticExaminer('Examiner', pi === 1 ? SCRIPT.toPart2 : SCRIPT.toPart3);\n    divider(p.name + ' · ' + p.desc, true);\n    if (p.kind === 'cue'){\n      var c = p.cue, el = document.createElement('div');\n      el.className = 'turn cue';\n      el.innerHTML = '<div class=\"tag\">Examiner · Candidate task card<\/div>'\n        + '<h2>' + esc(c.title) + '<\/h2><div class=\"lead\">You should say:<\/div>'\n        + '<ul>' + c.bullets.map(function(b){ return '<li>' + esc(b) + '<\/li>'; }).join('') + '<\/ul>'\n        + '<p class=\"explain\">' + esc(c.explain) + '<\/p>';\n      thread.appendChild(el);\n      var secs = Math.round(words(p.sample).length / 1.3);\n      state.log[pi].push({ text:p.sample, words:words(p.sample).length, secs:secs });\n      addAnswer(p.sample, secs, p.name + ' · Long turn');\n    } else {\n      p.questions.forEach(function(q, qi){\n        if (qi === 0 || p.questions[qi - 1].set !== q.set) divider(p.name + ' · ' + q.set);\n        staticExaminer('Examiner · ' + p.name + ' · Question ' + (qi + 1) + ' of ' + p.questions.length, q.q);\n        var secs = Math.round(words(q.sample).length / 2.1);\n        state.log[pi].push({ text:q.sample, words:words(q.sample).length, secs:secs });\n        addAnswer(q.sample, secs, p.name + ' · Question ' + (qi + 1));\n      });\n      state.q = p.questions.length - 1;\n    }\n  });\n  staticExaminer('Examiner', SCRIPT.closing);\n  state.stage = 'ended';\n  renderRail();\n  renderComposer();\n  scrollDown();\n}\n\nif (!AT) start();\nelse {\n  fastForward();\n  if (AT === 'picker') openPicker();\n  else if (AT === 'ed-grading') sendToEd(true);\n  else if (AT === 'ed'){ state.graders.push('ed'); showGrading(ED, true); }\n  else if (AT === 'sent' || AT === 'returned' || AT === 'teacher'){\n    sendToTeacher();\n    if (AT !== 'sent') teacherReturns();\n    if (AT === 'teacher') openTeacherGrading(true);\n  }\n}\n})();\n<\/script>\n","teacher-queue.html":"<title>Speaking Submissions Queue<\/title>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n<link href=\"https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap\" rel=\"stylesheet\">\n<style>\n/* Teacher side, same visual system as speaking-grading-screen: the list of speaking tests\n   students have sent to the teacher, and the \"how do you want to grade it?\" choice. */\n:root{\n  color-scheme:light;\n  --bg:#F5F6F8; --surface:#FFFFFF; --surface-2:#FAFBFC;\n  --border:#E4E7EC; --border-strong:#D0D5DD;\n  --ink:#101828; --ink-2:#475467; --ink-3:#98A2B3;\n  --accent:#EA580C; --accent-ink:#FFFFFF; --accent-soft:#FFF1E9; --accent-line:#F7C39C; --accent-deep:#9A3412;\n  --ok:#15803D; --ok-bg:#EFFAF1; --ok-line:#BBE8C4;\n  --warn:#B45309; --warn-bg:#FEF3E0; --warn-line:#FBDFA6;\n  --info:#1D4ED8; --info-bg:#EEF3FF; --info-line:#C4D6FB;\n  --ed:#4A63E7; --ed-bg:#15182B; --ed-bg-2:#22274A;\n}\n*{box-sizing:border-box}\nhtml,body{min-height:100%}\nbody{background:var(--bg);color:var(--ink);font-family:'Inter',system-ui,-apple-system,sans-serif}\nh1,h2,h3{text-wrap:balance;margin:0}\np{margin:0}\nbutton{font-family:inherit;cursor:pointer;color:inherit}\n:focus-visible{outline:2px solid var(--accent);outline-offset:2px}\n.mono{font-family:'JetBrains Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums}\n\n.app{max-width:1240px;margin:0 auto;padding:0 20px 40px}\n\n.topbar{\n  display:flex;align-items:center;gap:14px;flex-wrap:wrap;\n  padding:14px 0;border-bottom:1px solid var(--border);\n}\n.avatar{\n  width:38px;height:38px;border-radius:999px;flex:none;\n  background:linear-gradient(135deg,#FFD9BF,var(--accent-soft));border:1px solid var(--accent-line);\n  display:grid;place-items:center;font-weight:700;font-size:13px;color:var(--accent);\n}\n.who{display:flex;flex-direction:column;line-height:1.3}\n.who .name{font-weight:700;font-size:14.5px}\n.who .meta{font-size:12px;color:var(--ink-3)}\n.spacer{flex:1}\n.stat{display:flex;flex-direction:column;align-items:flex-end;line-height:1.2}\n.stat b{font-size:18px;font-weight:800;font-variant-numeric:tabular-nums}\n.stat span{font-size:11px;font-weight:600;color:var(--ink-3);text-transform:uppercase;letter-spacing:.05em}\n\n.head{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;padding:22px 0 14px}\n.head h1{font-size:22px;font-weight:800;letter-spacing:-.02em}\n.head p{font-size:13.5px;color:var(--ink-2);margin-top:4px}\n.tabs{display:flex;gap:6px;flex-wrap:wrap}\n.tab{\n  border:1px solid var(--border);background:var(--surface);border-radius:8px;\n  padding:7px 12px;font-size:13px;font-weight:600;color:var(--ink-2);display:inline-flex;gap:7px;align-items:center\n}\n.tab .n{font-size:11.5px;font-weight:700;background:var(--surface-2);border:1px solid var(--border);border-radius:999px;padding:1px 7px}\n.tab[aria-current=\"true\"]{border-color:var(--accent);color:var(--ink);box-shadow:0 0 0 3px var(--accent-soft)}\n.tab[aria-current=\"true\"] .n{background:var(--accent);border-color:var(--accent);color:#fff}\n\n.list{background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden}\n.row{\n  display:grid;grid-template-columns:minmax(200px,1.5fr) minmax(150px,1fr) minmax(150px,1fr) minmax(120px,.8fr) auto;\n  gap:14px;align-items:center;padding:14px 18px;border-top:1px solid var(--border)\n}\n.row:first-child{border-top:none}\n.row.colhead{background:var(--surface-2);padding-block:9px}\n.row.colhead span{font-size:11px;font-weight:700;color:var(--ink-3);text-transform:uppercase;letter-spacing:.06em}\n.row.urgent{background:linear-gradient(90deg,var(--accent-soft),var(--surface) 40%)}\n.stu{display:flex;align-items:center;gap:11px;min-width:0}\n.stu .av{width:34px;height:34px;border-radius:999px;flex:none;display:grid;place-items:center;font-size:12px;font-weight:700;background:var(--surface-2);border:1px solid var(--border-strong);color:var(--ink-2)}\n.stu .nm{font-weight:700;font-size:14px}\n.stu .cl{font-size:12px;color:var(--ink-3)}\n.test b{display:block;font-size:13.5px}\n.test span{font-size:12px;color:var(--ink-3)}\n.chip{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:600;border:1px solid;border-radius:999px;padding:3px 10px 3px 4px;white-space:nowrap}\n.chip.ed{background:#EEF0FD;border-color:#CBD2F8;color:#2B3A9E}\n.chip.ed .t{width:20px;height:20px;border-radius:999px;background:var(--ed-bg);display:grid;place-items:center}\n.chip.wait{background:var(--surface-2);border-color:var(--border);color:var(--ink-2);padding-left:10px}\n.chip.draft{background:var(--info-bg);border-color:var(--info-line);color:var(--info);padding-left:10px}\n.due b{display:block;font-size:13px;font-variant-numeric:tabular-nums}\n.due span{font-size:12px;color:var(--ink-3)}\n.due.soon b{color:var(--accent-deep)}\n.gbtn{\n  border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);\n  border-radius:8px;padding:8px 16px;font-size:13px;font-weight:700;white-space:nowrap\n}\n.gbtn:hover{background:var(--accent-deep);border-color:var(--accent-deep)}\n.gbtn.ghost{background:var(--surface);color:var(--ink-2);border-color:var(--border-strong)}\n.gbtn.ghost:hover{background:var(--surface-2)}\n@media (max-width:860px){\n  .row{grid-template-columns:1fr 1fr}\n  .row.colhead{display:none}\n  .row > :last-child{grid-column:1 / -1;justify-self:start}\n}\n.foot{font-size:12.5px;color:var(--ink-3);margin-top:12px}\n\n/* ---------- how do you want to grade it? ---------- */\n.overlay{position:fixed;inset:0;z-index:40;background:rgba(16,24,40,.5);display:grid;place-items:center;padding:16px}\n.dialog{\n  width:min(640px,100%);max-height:calc(100% - 16px);overflow:auto;background:var(--surface);\n  border:1px solid var(--border);border-radius:14px;box-shadow:0 20px 50px rgba(16,24,40,.25);padding:22px\n}\n.dialog .eyebrow{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}\n.dialog h2{font-size:20px;font-weight:800;letter-spacing:-.01em;margin-top:6px}\n.dialog .lede{font-size:13.5px;color:var(--ink-2);margin:6px 0 18px;line-height:1.5}\n.modes{display:grid;grid-template-columns:1fr 1fr;gap:12px}\n@media (max-width:560px){.modes{grid-template-columns:1fr}}\n.mode{\n  text-align:left;display:flex;flex-direction:column;gap:9px;background:var(--surface);\n  border:1px solid var(--border-strong);border-radius:12px;padding:16px;transition:border-color .12s,box-shadow .12s\n}\n.mode:hover{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}\n.mode .ic{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;flex:none}\n.mode.draft .ic{background:var(--ed-bg);box-shadow:inset 0 0 0 3px var(--ed-bg-2)}\n.mode.scratch .ic{background:var(--accent-soft);border:1px solid var(--accent-line)}\n.mode.scratch .ic svg{width:22px;height:22px;fill:none;stroke:var(--accent);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}\n.mode .nm{font-size:16px;font-weight:800}\n.mode .d{font-size:13px;line-height:1.5;color:var(--ink-2)}\n.mode .facts{display:flex;gap:6px;flex-wrap:wrap}\n.mode .facts span{font-size:11.5px;font-weight:600;border:1px solid var(--border);background:var(--surface-2);border-radius:6px;padding:3px 8px;color:var(--ink-2)}\n.dialog .end{display:flex;justify-content:flex-end;margin-top:16px}\n.linkbtn{border:none;background:none;font-size:13px;font-weight:600;color:var(--ink-2);text-decoration:underline;text-underline-offset:3px;padding:0}\n\n#toast{\n  position:fixed;left:50%;bottom:20px;transform:translateX(-50%) translateY(20px);opacity:0;\n  background:var(--ink);color:#fff;font-size:13px;font-weight:600;padding:10px 16px;border-radius:9px;\n  transition:opacity .2s,transform .2s;pointer-events:none;z-index:60\n}\n#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}\n@media (prefers-reduced-motion:reduce){*{transition:none!important}}\n<\/style>\n\n<div class=\"app\">\n  <div class=\"topbar\">\n    <div class=\"avatar\">MH<\/div>\n    <div class=\"who\"><span class=\"name\">Ms. Hạnh<\/span><span class=\"meta\">IELTS Speaking examiner · IEC<\/span><\/div>\n    <div class=\"spacer\"><\/div>\n    <div class=\"stat\"><b>48h<\/b><span>Return promise<\/span><\/div>\n    <div class=\"stat\"><b id=\"statWaiting\">4<\/b><span>Waiting for you<\/span><\/div>\n  <\/div>\n\n  <div class=\"head\">\n    <div>\n      <h1>Speaking submissions<\/h1>\n      <p>Tests your students sent to you instead of Ed. Ed has already drafted a grading for each one.<\/p>\n    <\/div>\n    <div class=\"spacer\"><\/div>\n    <div class=\"tabs\">\n      <button class=\"tab\" aria-current=\"true\">Needs grading <span class=\"n\">4<\/span><\/button>\n      <button class=\"tab\" aria-current=\"false\">In progress <span class=\"n\">1<\/span><\/button>\n      <button class=\"tab\" aria-current=\"false\">Returned <span class=\"n\">12<\/span><\/button>\n    <\/div>\n  <\/div>\n\n  <div class=\"list\" id=\"list\"><\/div>\n  <p class=\"foot\">Oldest first. A submission turns orange when less than 12 hours are left on the 48-hour promise.<\/p>\n<\/div>\n\n<div class=\"overlay\" id=\"modeDlg\" hidden>\n  <div class=\"dialog\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"modeTitle\">\n    <div class=\"eyebrow\" id=\"modeEyebrow\"><\/div>\n    <h2 id=\"modeTitle\"><\/h2>\n    <p class=\"lede\" id=\"modeLede\"><\/p>\n    <div class=\"modes\">\n      <button class=\"mode draft\" id=\"modeDraft\">\n        <span class=\"ic\" id=\"modeDraftIc\"><\/span>\n        <span class=\"nm\">Review Ed’s draft<\/span>\n        <span class=\"d\">Start from Ed’s bands and flagged errors. Keep, change or remove each one, then add your own comments.<\/span>\n        <span class=\"facts\" id=\"modeDraftFacts\"><\/span>\n      <\/button>\n      <button class=\"mode scratch\" id=\"modeScratch\">\n        <span class=\"ic\"><svg viewBox=\"0 0 24 24\"><path d=\"M4 20h4L18.5 9.5a2.1 2.1 0 0 0-3-3L5 17v3z\"/><path d=\"M14 8l3 3\"/><\/svg><\/span>\n        <span class=\"nm\">Grade from scratch<\/span>\n        <span class=\"d\">Start with empty bands and no flags. Ed’s draft stays hidden until you choose to look at it.<\/span>\n        <span class=\"facts\"><span>No AI suggestions<\/span><span>Your marking only<\/span><\/span>\n      <\/button>\n    <\/div>\n    <div class=\"end\"><button class=\"linkbtn\" id=\"modeCancel\">Cancel<\/button><\/div>\n  <\/div>\n<\/div>\n<div id=\"toast\" role=\"status\" aria-live=\"polite\"><\/div>\n\n<script>\n(function(){\n\"use strict\";\n\n/* Demo submissions. Phạm Anh Thư's full test is the one open in speaking-grading-screen. */\nvar SUBS = [\n  { av:'PT', name:'Phạm Anh Thư', cls:'IEC K29 · Foundation', test:'Full test', detail:'Parts 1–3 · 16 answers · 5:24',\n    sent:'Today, 09:42', due:'Due in 9h', soon:true, ed:{ band:'6.0', flags:13 } },\n  { av:'NK', name:'Nguyễn Minh Khoa', cls:'IEC K30 · Intermediate', test:'Part 2', detail:'Long turn · 1 answer · 1:52',\n    sent:'Yesterday, 21:15', due:'Due in 21h', ed:{ band:'6.5', flags:4 } },\n  { av:'TN', name:'Trần Bảo Ngọc', cls:'IEC K29 · Foundation', test:'Part 1', detail:'10 answers · 3:40',\n    sent:'Yesterday, 18:03', due:'Due in 24h', ed:{ band:'5.5', flags:7 } },\n  { av:'LH', name:'Lê Gia Huy', cls:'IEC K31 · Advanced', test:'Full test', detail:'Parts 1–3 · 16 answers · 6:10',\n    sent:'Today, 10:58', due:'Due in 46h', ed:null }\n];\n\nfunction esc(s){ return String(s).replace(/&/g,'&amp;').replace(/<\/g,'&lt;').replace(/>/g,'&gt;'); }\nfunction edSvg(size){\n  return '<svg width=\"' + size + '\" height=\"' + size + '\" viewBox=\"0 0 100 100\" aria-hidden=\"true\">'\n    + '<path d=\"M30 93C13 93 7 80 11 63 17 39 34 13 58 9c19-3 29 10 25 31-3 16-10 32-16 44-5 8-17 9-37 9z\" fill=\"#4A63E7\"/>'\n    + '<path d=\"M70 6c9-2 17 0 17 6 0 7-3 13-6 17-3-8-6-15-11-23z\" fill=\"#DFF77A\"/>'\n    + '<ellipse cx=\"60\" cy=\"33\" rx=\"18\" ry=\"13\" transform=\"rotate(-14 60 33)\" fill=\"#fff\"/>'\n    + '<ellipse cx=\"56\" cy=\"37\" rx=\"2.8\" ry=\"3.6\" fill=\"#1C1508\"/><ellipse cx=\"68\" cy=\"27\" rx=\"2.8\" ry=\"3.6\" fill=\"#1C1508\"/><\/svg>';\n}\n\ndocument.getElementById('list').innerHTML =\n  '<div class=\"row colhead\"><span>Student<\/span><span>Test<\/span><span>Ed’s draft<\/span><span>Due back<\/span><span><\/span><\/div>'\n  + SUBS.map(function(s, i){\n    return '<div class=\"row' + (s.soon ? ' urgent' : '') + '\">'\n      + '<div class=\"stu\"><span class=\"av\">' + s.av + '<\/span><div><div class=\"nm\">' + esc(s.name) + '<\/div><div class=\"cl\">' + esc(s.cls) + '<\/div><\/div><\/div>'\n      + '<div class=\"test\"><b>' + s.test + '<\/b><span>' + esc(s.detail) + '<\/span><\/div>'\n      + '<div>' + (s.ed\n          ? '<span class=\"chip ed\"><span class=\"t\">' + edSvg(15) + '<\/span>Ready · band ' + s.ed.band + ' · ' + s.ed.flags + ' flags<\/span>'\n          : '<span class=\"chip wait\">Ed is still drafting…<\/span>') + '<\/div>'\n      + '<div class=\"due' + (s.soon ? ' soon' : '') + '\"><b>' + s.due + '<\/b><span>Sent ' + s.sent + '<\/span><\/div>'\n      + '<div><button class=\"gbtn' + (i === 0 ? '' : ' ghost') + '\" data-grade=\"' + i + '\">Grade<\/button><\/div>'\n      + '<\/div>';\n  }).join('');\n\nvar dlg = document.getElementById('modeDlg'), current = 0;\nfunction openMode(i){\n  current = i;\n  var s = SUBS[i];\n  document.getElementById('modeEyebrow').textContent = s.test + ' · sent ' + s.sent;\n  document.getElementById('modeTitle').textContent = 'How do you want to grade ' + s.name + '’s ' + s.test.toLowerCase() + '?';\n  document.getElementById('modeLede').textContent = s.ed\n    ? 'Ed has already graded it. You can work from Ed’s draft or mark it yourself. Either way, only your grading goes back to the student.'\n    : 'Ed is still drafting this one. You can wait a minute for Ed’s draft, or mark it yourself now.';\n  document.getElementById('modeDraftIc').innerHTML = edSvg(34);\n  document.getElementById('modeDraftFacts').innerHTML = s.ed\n    ? '<span>Ed’s band ' + s.ed.band + '<\/span><span>' + s.ed.flags + ' errors flagged<\/span><span>Rewritten answers<\/span>'\n    : '<span>Draft not ready yet<\/span>';\n  document.getElementById('modeDraft').disabled = !s.ed;\n  dlg.hidden = false;\n  document.getElementById(s.ed ? 'modeDraft' : 'modeScratch').focus();\n}\nfunction closeMode(){ dlg.hidden = true; }\n\n/* Inside the workflow page, choosing a mode jumps to the grading screen in that mode. */\nfunction choose(mode){\n  closeMode();\n  if (window.parent !== window){\n    try { window.parent.postMessage({ workflow:'goto', step:'t4', tab: mode === 'scratch' ? 1 : 0 }, '*'); } catch(e){}\n  }\n  toast(mode === 'scratch' ? 'Opening the grading screen with empty bands…' : 'Opening the grading screen with Ed’s draft…');\n}\n\ndocument.querySelectorAll('[data-grade]').forEach(function(b){\n  b.addEventListener('click', function(){ openMode(+b.dataset.grade); });\n});\ndocument.getElementById('modeDraft').addEventListener('click', function(){ choose('draft'); });\ndocument.getElementById('modeScratch').addEventListener('click', function(){ choose('scratch'); });\ndocument.getElementById('modeCancel').addEventListener('click', closeMode);\ndlg.addEventListener('click', function(e){ if (e.target === dlg) closeMode(); });\ndocument.addEventListener('keydown', function(e){ if (e.key === 'Escape' && !dlg.hidden) closeMode(); });\n\nvar toastTimer;\nfunction toast(msg){\n  var t = document.getElementById('toast');\n  t.textContent = msg; t.classList.add('on');\n  clearTimeout(toastTimer);\n  toastTimer = setTimeout(function(){ t.classList.remove('on'); }, 2200);\n}\n\n/* Preset from the workflow page: 'choose' opens the grading-mode choice for the first student. */\nvar AT = window.__AT || (location.hash.match(/at=([\\w-]+)/) || [])[1] || '';\nif (AT === 'choose') openMode(0);\n})();\n<\/script>\n","speaking-grading-screen.html":"<title>Speaking Grading Screen<\/title>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n<link href=\"https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap\" rel=\"stylesheet\">\n<style>\n:root{\n  color-scheme:light;\n  --bg:#F5F6F8; --surface:#FFFFFF; --surface-2:#FAFBFC;\n  --border:#E4E7EC; --border-strong:#D0D5DD;\n  --ink:#101828; --ink-2:#475467; --ink-3:#98A2B3;\n  --accent:#EA580C; --accent-ink:#FFFFFF; --accent-soft:#FFF1E9; --accent-line:#F7C39C; --accent-deep:#9A3412;\n\n  --c-fluency:#15803D; --c-fluency-bg:#EFFAF1; --c-fluency-line:#BBE8C4;\n  --c-pron:#1D4ED8;    --c-pron-bg:#EEF3FF;    --c-pron-line:#C4D6FB;\n  --c-lexical:#B45309; --c-lexical-bg:#FFF8EB; --c-lexical-line:#F5DDA8;\n  --c-grammar:#B91C1C; --c-grammar-bg:#FDF0F0; --c-grammar-line:#F3C6C6;\n\n  --badge-neutral-bg:#F2F4F7; --badge-neutral-ink:#344054; --badge-neutral-line:#E4E7EC;\n  --badge-priority-bg:#FEF3E0; --badge-priority-ink:#B45309; --badge-priority-line:#FBDFA6;\n  --badge-attempt-bg:#EEF3FF; --badge-attempt-ink:#1D4ED8; --badge-attempt-line:#C4D6FB;\n  --danger:#B91C1C; --danger-soft:#FDF0F0; --danger-line:#F3C6C6;\n  --ok:#15803D;\n\n  --select-bg:#FEF9E3; --select-line:#F2CE4B; --select-ink:#8A6206;\n}\n*{box-sizing:border-box}\nbody{background:var(--bg);color:var(--ink);font-family:'Inter',system-ui,-apple-system,sans-serif}\n.mono{font-family:'JetBrains Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums}\nh1,h2,h3{text-wrap:balance;margin:0}\np{margin:0}\nbutton{font-family:inherit;cursor:pointer}\ntextarea,input,select{font-family:inherit;background:var(--surface);color:var(--ink)}\n:focus-visible{outline:2px solid var(--accent);outline-offset:2px}\n::selection{background:var(--accent-soft)}\n\n.app{max-width:1560px;margin:0 auto}\n\n/* ---------- top bar ---------- */\n.topbar{\n  position:sticky;top:env(safe-area-inset-top,0px);z-index:20;\n  background:var(--surface);border-bottom:1px solid var(--border);\n  display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:12px 20px;\n}\n.avatar{\n  width:38px;height:38px;border-radius:999px;flex:none;\n  background:linear-gradient(135deg,#FFD9BF,var(--accent-soft));border:1px solid var(--accent-line);\n  display:grid;place-items:center;font-weight:700;font-size:13px;color:var(--accent);\n}\n.who{display:flex;flex-direction:column;line-height:1.3}\n.who .name{font-weight:700;font-size:14.5px;letter-spacing:-.01em}\n.who .meta{font-size:12px;color:var(--ink-3)}\n.spacer{flex:1}\n.badges{display:flex;align-items:center;gap:8px;flex-wrap:wrap}\n.badge{font-size:11px;font-weight:700;letter-spacing:.02em;text-transform:uppercase;padding:4px 9px;border-radius:999px;border:1px solid;white-space:nowrap}\n.badge.neutral{background:var(--badge-neutral-bg);color:var(--badge-neutral-ink);border-color:var(--badge-neutral-line)}\n.badge.priority{background:var(--badge-priority-bg);color:var(--badge-priority-ink);border-color:var(--badge-priority-line)}\n.badge.attempt{background:var(--badge-attempt-bg);color:var(--badge-attempt-ink);border-color:var(--badge-attempt-line)}\n.tbtn{font-size:12.5px;font-weight:600;padding:6px 12px;border-radius:7px;background:var(--surface);border:1px solid var(--border-strong);color:var(--ink-2)}\n.tbtn:hover{background:var(--surface-2)}\n.tbtn.danger{color:var(--danger);border-color:var(--danger-line);background:var(--danger-soft)}\n\n/* ---------- test overall (above the part tabs) ---------- */\n.overallbar{\n  display:flex;align-items:center;gap:18px;flex-wrap:wrap;\n  margin:14px 20px 0;padding:11px 16px;\n  background:var(--surface);border:1px solid var(--border);border-radius:11px;\n}\n.ovparts{display:flex;align-items:center;gap:7px;flex-wrap:wrap;flex:1;min-width:0}\n.ovpart{\n  display:flex;align-items:center;gap:7px;flex:none;\n  border:1px solid var(--border);border-radius:8px;padding:5px 11px;background:var(--surface-2);\n}\n.ovpart.graded{background:var(--c-fluency-bg);border-color:var(--c-fluency-line)}\n.ovpart .nm{font-size:11.5px;font-weight:700;color:var(--ink-2)}\n.ovpart .bd{font-size:14px;font-weight:800;color:var(--c-fluency);font-variant-numeric:tabular-nums}\n.ovpart .bd.unset{font-size:10.5px;font-weight:700;color:var(--ink-3);text-transform:uppercase;letter-spacing:.04em}\n.ovtotal{display:flex;align-items:center;gap:11px;flex:none;padding-left:18px;border-left:1px solid var(--border)}\n.ovtotal .lbl{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}\n.ovtotal .val{font-size:26px;font-weight:800;letter-spacing:-.02em;color:var(--accent);font-variant-numeric:tabular-nums;line-height:1}\n@media (max-width:720px){\n  .ovtotal{padding-left:0;border-left:none;width:100%;justify-content:space-between}\n}\n\n/* ---------- part switcher ---------- */\n.parts{display:flex;gap:10px;padding:12px 20px 0;flex-wrap:wrap}\n.parttab{\n  flex:1;min-width:210px;text-align:left;background:var(--surface);\n  border:1px solid var(--border);border-radius:10px;padding:10px 13px;\n  display:flex;flex-direction:column;gap:4px;transition:border-color .12s,box-shadow .12s;\n}\n.parttab:hover{border-color:var(--border-strong)}\n.parttab[aria-current=\"true\"]{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}\n.parttab .pt-top{display:flex;align-items:center;gap:8px}\n.parttab .pt-name{font-size:13px;font-weight:700;letter-spacing:-.01em}\n.parttab .pt-band{margin-left:auto;font-size:14px;font-weight:800}\n.parttab .pt-band.unset{color:var(--ink-3);font-weight:600;font-size:11.5px}\n.parttab .pt-meta{font-size:11px;color:var(--ink-3);font-weight:500}\n.dotstate{width:7px;height:7px;border-radius:999px;flex:none;background:var(--border-strong)}\n.dotstate.done{background:var(--ok)}\n\n/* ---------- layout ---------- */\n.layout{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(250px,0.78fr) minmax(320px,1fr);gap:16px;padding:14px 20px 40px}\n@media (max-width:1080px){.layout{grid-template-columns:1fr}}\n.panel{background:var(--surface);border:1px solid var(--border);border-radius:12px}\n.eyebrow{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}\n\n/* ---------- main column ---------- */\n.col{display:flex;flex-direction:column;gap:16px;min-width:0}\n.headcard{padding:18px 20px 0;display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start}\n.headcard h1{font-size:19px;font-weight:700;letter-spacing:-.01em;margin-top:4px;line-height:1.35}\n.headscore{margin-left:auto;text-align:right}\n.headscore .num{font-size:30px;font-weight:800;letter-spacing:-.02em;color:var(--c-fluency)}\n.headscore .num.unset{color:var(--ink-3)}\n.headscore .lbl{font-size:11px;color:var(--ink-3);font-weight:600}\n.metarow{display:flex;gap:22px;flex-wrap:wrap;padding:14px 20px 16px;font-size:12.5px;border-bottom:1px solid var(--border)}\n.metarow div b{display:block;font-size:13.5px;color:var(--ink);font-weight:700}\n.metarow div span{color:var(--ink-3);font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.04em}\n\n.answerbar{display:flex;align-items:center;gap:10px;padding:12px 20px;border-bottom:1px solid var(--border);background:var(--surface-2);flex-wrap:wrap}\n.answerbar .lbl{font-size:12px;font-weight:600;color:var(--ink-2)}\n.playall{display:flex;align-items:center;gap:7px;padding:6px 12px;border-radius:7px;border:1px solid var(--border-strong);background:var(--surface);font-size:12.5px;font-weight:600;color:var(--ink)}\n.playall svg{width:11px;height:11px;fill:var(--ink)}\n.speedgroup{display:flex;border:1px solid var(--border-strong);border-radius:7px;overflow:hidden;flex:none}\n.speedgroup button{border:none;background:var(--surface);padding:5px 9px;font-size:11px;font-weight:600;color:var(--ink-2);border-right:1px solid var(--border-strong)}\n.speedgroup button:last-child{border-right:none}\n.speedgroup button.active{background:var(--accent-soft);color:var(--accent-deep);font-weight:700}\n\n/* ---------- question cards ---------- */\n.qlist{display:flex;flex-direction:column}\n.qcard{padding:16px 20px;border-bottom:1px solid var(--border);cursor:pointer;transition:background .12s,box-shadow .12s}\n.qcard:last-child{border-bottom:none}\n.qcard:hover{background:var(--surface-2)}\n.qcard.selected{background:var(--select-bg);box-shadow:inset 3px 0 0 var(--select-line)}\n.qcard.selected:hover{background:var(--select-bg)}\n.qcard.active{box-shadow:inset 3px 0 0 var(--accent)}\n.qcard.selected.active{box-shadow:inset 3px 0 0 var(--accent)}\n.qcard.selected .qnum{background:var(--select-line);color:var(--select-ink);border-color:var(--select-ink)}\n.selflag{\n  font-size:9.5px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;\n  background:var(--select-line);color:var(--select-ink);border-radius:5px;padding:2px 6px;flex:none;\n}\n.qhead{display:flex;align-items:baseline;gap:10px;margin-bottom:8px;flex-wrap:wrap}\n.qnum{\n  font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:700;\n  background:var(--badge-neutral-bg);color:var(--badge-neutral-ink);\n  border:1px solid var(--border-strong);border-radius:5px;padding:2px 7px;flex:none;\n}\n.qtext{font-size:13.5px;font-weight:600;line-height:1.5;color:var(--ink);flex:1;min-width:200px}\n.qmeta{font-size:11px;color:var(--ink-3);font-weight:600;white-space:nowrap}\n.qplayer{display:flex;align-items:center;gap:10px;margin-bottom:10px}\n.playbtn{width:30px;height:30px;border-radius:999px;flex:none;border:1px solid var(--accent);background:var(--accent);display:grid;place-items:center}\n.playbtn:hover{background:#D9500D}\n.playbtn svg{width:11px;height:11px;fill:#fff}\n.wave{flex:1;height:32px;cursor:pointer;min-width:0}\n.time{font-size:11px;color:var(--ink-3);flex:none;min-width:74px;text-align:right}\n.transcript{font-size:14px;line-height:2;color:var(--ink);cursor:text}\n.transcript::selection,.transcript *::selection{background:var(--accent-soft)}\n.transcript mark{background:none;color:inherit;padding:0 1px;border-bottom:2px dotted var(--c-grammar);cursor:pointer}\n.transcript mark.lexical{border-bottom-color:var(--c-lexical)}\n.transcript mark.fluency{border-bottom-color:var(--c-fluency)}\n.transcript mark.pron{border-bottom-color:var(--c-pron)}\n.transcript mark.teacher{border-bottom-style:solid}\n.transcript mark.focus{background:var(--accent-soft);border-radius:3px;box-shadow:0 0 0 2px var(--accent-line)}\n.transcript sup{\n  font-family:'JetBrains Mono',monospace;font-weight:700;font-size:9.5px;\n  background:var(--c-grammar-bg);color:var(--c-grammar);border:1px solid var(--c-grammar-line);\n  border-radius:999px;padding:1px 4px;margin-left:2px;cursor:pointer;\n}\n.transcript sup.lexical{background:var(--c-lexical-bg);color:var(--c-lexical);border-color:var(--c-lexical-line)}\n.transcript sup.fluency{background:var(--c-fluency-bg);color:var(--c-fluency);border-color:var(--c-fluency-line)}\n.transcript sup.pron{background:var(--c-pron-bg);color:var(--c-pron);border-color:var(--c-pron-line)}\n\n/* ---------- mark-an-error popover ---------- */\n#markpop{\n  position:absolute;z-index:40;background:var(--surface);border:1px solid var(--border-strong);\n  border-radius:10px;box-shadow:0 8px 24px rgba(16,24,40,.16);padding:9px 10px;width:max-content;max-width:min(320px,92vw);\n}\n#markpop[hidden]{display:none}\n#markpop .pophead{display:flex;align-items:center;gap:8px;margin-bottom:7px}\n#markpop .popq{\n  font-size:11px;font-style:italic;color:var(--ink-2);max-width:200px;\n  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;\n}\n#markpop .popx{margin-left:auto;border:none;background:none;color:var(--ink-3);font-size:14px;line-height:1;padding:0 2px;cursor:pointer}\n#markpop .poplab{font-size:9.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin-bottom:6px}\n#markpop .popgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px}\n#markpop .popgrid button{\n  text-align:left;border:1px solid var(--border);border-radius:7px;padding:6px 9px;background:var(--surface-2);\n  font-size:11.5px;font-weight:700;line-height:1.25;cursor:pointer;\n}\n#markpop .popgrid button:hover{background:var(--surface)}\n#markpop .popgrid button.fluency{border-left:3px solid var(--c-fluency);color:var(--c-fluency)}\n#markpop .popgrid button.pron{border-left:3px solid var(--c-pron);color:var(--c-pron)}\n#markpop .popgrid button.lexical{border-left:3px solid var(--c-lexical);color:var(--c-lexical)}\n#markpop .popgrid button.grammar{border-left:3px solid var(--c-grammar);color:var(--c-grammar)}\n\n/* ---------- grading column ---------- */\n.gradepanel{padding:18px;display:flex;flex-direction:column;gap:16px}\n.gradehead{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}\n.gradehead .meta{font-size:11px;color:var(--ink-3);font-weight:600}\n.gradehead .meta b{color:var(--ink-2)}\n.scopenote{\n  font-size:11.5px;line-height:1.5;color:var(--ink-2);background:var(--surface-2);\n  border:1px solid var(--border);border-left:3px solid var(--accent);border-radius:7px;padding:8px 11px;\n}\n.scorerow{display:flex;gap:10px;align-items:flex-end}\n.scorerow label{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3);display:block;margin-bottom:5px}\n.scoreinput{\n  width:84px;font-size:20px;font-weight:800;padding:7px 10px;border-radius:8px;\n  border:1.5px solid var(--c-fluency-line);background:var(--c-fluency-bg);color:var(--c-fluency);\n}\n.scoreinput:focus{background:var(--surface)}\n.ghostbtn{padding:9px 14px;border-radius:8px;font-size:12.5px;font-weight:600;border:1px solid var(--border-strong);background:var(--surface-2);color:var(--ink-2)}\n.ghostbtn:hover{background:var(--surface)}\n\n.tabs{display:flex;border-bottom:1px solid var(--border);gap:2px;flex-wrap:wrap}\n.tabs button{padding:8px 4px;margin-right:16px;font-size:12.5px;font-weight:600;color:var(--ink-3);border:none;background:none;border-bottom:2px solid transparent}\n.tabs button.active{color:var(--ink);border-bottom-color:var(--accent)}\n.tabpanel{padding-top:10px}\n.tabpanel[hidden]{display:none}\n.tabpanel textarea{width:100%;min-height:86px;resize:vertical;border:1px solid var(--border);border-radius:8px;padding:10px 12px;font-size:13px;line-height:1.55;color:var(--ink-2);background:var(--surface-2)}\n.impblock{margin-bottom:10px}\n.impblock:last-child{margin-bottom:0}\n.impblock .impq{font-size:11px;font-weight:700;color:var(--ink-3);display:flex;gap:6px;align-items:center;margin-bottom:4px}\n.impblock .impq .qnum{background:var(--surface-2);color:var(--ink-3)}\n.impblock textarea{min-height:64px;font-size:12.5px}\n\n.actionrow{display:flex;gap:10px}\n.btn-primary{flex:1;padding:10px 14px;border-radius:8px;border:none;background:var(--accent);color:var(--accent-ink);font-size:13px;font-weight:700}\n.btn-primary:hover{background:#D9500D}\n.btn-secondary{padding:10px 14px;border-radius:8px;border:1px solid var(--border-strong);background:var(--surface);color:var(--ink-2);font-size:13px;font-weight:600}\n\n.critheader h2{font-size:13px;font-weight:700;letter-spacing:-.01em}\n.critheader p{font-size:11.5px;color:var(--ink-3);margin-top:2px;line-height:1.45}\n.critcard{border:1px solid var(--border);border-left-width:3px;border-radius:9px;padding:12px 14px;background:var(--surface);display:flex;flex-direction:column;gap:8px}\n.critcard.fluency{border-left-color:var(--c-fluency)}\n.critcard.pron{border-left-color:var(--c-pron)}\n.critcard.lexical{border-left-color:var(--c-lexical)}\n.critcard.grammar{border-left-color:var(--c-grammar)}\n.critrow{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}\n.critname{font-size:12.5px;font-weight:700}\n.critcard.fluency .critname{color:var(--c-fluency)}\n.critcard.pron .critname{color:var(--c-pron)}\n.critcard.lexical .critname{color:var(--c-lexical)}\n.critcard.grammar .critname{color:var(--c-grammar)}\n.critsub{font-size:10.5px;color:var(--ink-3);margin-top:2px}\n.critscore{display:flex;align-items:center;gap:6px;flex:none}\n.critscore input{width:46px;text-align:center;font-size:14.5px;font-weight:700;padding:5px 4px;border-radius:6px;border:1px solid var(--border-strong);background:var(--surface);colo
