<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0;font-size:14px}[hidden]{display:none!important}</style>
<title>IELTS Speaking Workflow</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet">
<style>
/* Layout: the workflow as a flow chart on the left (one trunk that forks into the Ed path and the
   teacher path), and a live screen on the right. Clicking a step loads the mockup at that moment.
   One committed light look, in the same drafting-board vocabulary as the student mockups. */
:root{
  color-scheme:light;
  --board:#EFE9D8; --grid:rgba(28,21,8,.06);
  --card:#FFFDF6; --ink:#1C1508; --ink-2:#4A3D1E; --ink-3:#8A7C5A; --line:#1C1508;
  --student:#F7DC5E; --student-soft:#FBF1B5;
  --ed:#4A63E7; --ed-bg:#15182B; --ed-soft:#E4E8FC;
  --teacher:#EA580C; --teacher-soft:#FFE6D6;
  --new:#3F6B3C; --new-soft:#E3F0E0;
  --font-ui:'Outfit',system-ui,-apple-system,sans-serif;
  --font-read:'DM Sans',system-ui,sans-serif;
  --r:14px; --shadow:0 3px 0 rgba(28,21,8,.16);
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;font-family:var(--font-ui);color:var(--ink);background-color:var(--board);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:28px 28px;
}
button{font-family:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--ed);outline-offset:2px}

.page{display:grid;grid-template-columns:minmax(330px,440px) minmax(0,1fr);gap:18px;height:100%;padding:16px}
@media (max-width:900px){.page{grid-template-columns:1fr;height:auto}}

/* ---------------- left: the flow ---------------- */
.flowcol{display:flex;flex-direction:column;gap:12px;min-height:0;overflow:auto;padding-right:4px}
.title h1{margin:0;font-size:22px;font-weight:800;letter-spacing:-.01em;text-wrap:balance}
.title p{margin:4px 0 0;font-family:var(--font-read);font-size:13.5px;color:var(--ink-2);line-height:1.5}
.legend{display:flex;gap:6px;flex-wrap:wrap}
.who{
  display:inline-flex;align-items:center;gap:6px;border:1.6px solid var(--ink);border-radius:999px;
  padding:2px 9px 2px 3px;font-size:10.5px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;background:var(--card)
}
.who i{width:14px;height:14px;border-radius:999px;border:1.6px solid var(--ink);display:block}
.who.student i{background:var(--student)}
.who.ed i{background:var(--ed-bg);border-color:var(--ed-bg);box-shadow:inset 0 0 0 3px var(--ed)}
.who.teacher i{background:var(--teacher)}
.newtag{
  display:inline-block;border:1.6px solid var(--new);color:var(--new);background:var(--new-soft);border-radius:999px;
  padding:1px 7px;font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase
}

.flow{display:flex;flex-direction:column;align-items:stretch}
.col{display:flex;flex-direction:column;align-items:stretch}
.step{
  position:relative;text-align:left;width:100%;
  background:var(--card);border:2px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);
  padding:10px 12px 11px 12px;display:flex;flex-direction:column;gap:5px;transition:transform .1s ease-out
}
.step:hover{transform:translateY(-1px)}
.step[aria-current="true"]{box-shadow:0 0 0 4px var(--ink),var(--shadow)}
.step .top{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.step .num{font-size:11px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--ink-3)}
.step .nm{font-size:14.5px;font-weight:700;line-height:1.25;text-wrap:balance}
.step .d{font-family:var(--font-read);font-size:12.5px;line-height:1.45;color:var(--ink-2)}
.step.student{border-left:8px solid var(--student)}
.step.ed{border-left:8px solid var(--ed)}
.step.teacher{border-left:8px solid var(--teacher)}
.step.decision{background:repeating-linear-gradient(-45deg,var(--card) 0 10px,#F7F2E2 10px 20px)}
.step.decision .num::after{content:' · decision';text-transform:uppercase;letter-spacing:.06em}

/* arrows between steps */
.arrow{height:22px;display:grid;place-items:center}
.arrow::before{content:'';width:2px;height:100%;background:var(--line)}
.arrow{position:relative}
.arrow::after{content:'';position:absolute;bottom:0;left:50%;transform:translateX(-50%);border:5px solid transparent;border-top:7px solid var(--line);border-bottom:0}

/* the fork after "who grades it?" */
.fork{position:relative;height:40px;margin:0 25%}
.fork::before{content:'';position:absolute;left:50%;top:0;width:2px;height:14px;background:var(--line)}
.fork::after{content:'';position:absolute;left:0;right:0;top:14px;height:2px;background:var(--line)}
.fork span{position:absolute;top:14px;width:2px;height:26px;background:var(--line)}
.fork span.l{left:0}.fork span.r{right:0}
.branches{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:start}
.blabel{
  align-self:center;margin-bottom:6px;font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;
  border-radius:999px;padding:3px 10px;border:1.6px solid var(--ink)
}
.blabel.ed{background:var(--ed-bg);color:#fff;border-color:var(--ed-bg)}
.blabel.teacher{background:var(--teacher-soft)}
.joinnote{
  margin-top:10px;border:2px dashed var(--ink-3);border-radius:12px;padding:8px 10px;
  font-family:var(--font-read);font-size:12px;line-height:1.45;color:var(--ink-2);background:rgba(255,253,246,.6)
}
.joinnote b{font-family:var(--font-ui)}
@media (max-width:420px){.branches{grid-template-columns:1fr}.fork{display:none}}

/* ---------------- right: the screen ---------------- */
.viewer{
  display:flex;flex-direction:column;min-height:0;min-width:0;
  background:var(--card);border:2px solid var(--line);border-radius:18px;box-shadow:var(--shadow);overflow:hidden
}
@media (max-width:900px){.viewer{height:82vh;position:relative}}
.vhead{padding:14px 16px 12px;border-bottom:2px solid var(--line);display:flex;flex-direction:column;gap:8px}
.vrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.vhead h2{margin:0;font-size:19px;font-weight:800;letter-spacing:-.01em;text-wrap:balance}
.vhead p{margin:0;font-family:var(--font-read);font-size:13.5px;line-height:1.5;color:var(--ink-2);max-width:75ch}
.vnum{font-size:12px;font-weight:800;color:var(--ink-3);font-variant-numeric:tabular-nums}
.grow{flex:1}
.nav{display:flex;gap:6px}
.nav button,.tabs button{
  border:1.8px solid var(--ink);background:var(--card);border-radius:10px;padding:6px 11px;font-size:13px;font-weight:700
}
.nav button:hover,.tabs button:hover{background:var(--student-soft)}
.nav button:disabled{opacity:.35;cursor:default;background:var(--card)}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--card)}
.file{font-size:12px;font-family:var(--font-read);color:var(--ink-3)}
.file code{font-size:12px;color:var(--ink-2);background:var(--board);border-radius:5px;padding:1px 5px}
.file a{color:var(--ink-2);font-weight:600}
.stage{position:relative;flex:1;min-height:0;background:#D9D2BD;overflow:hidden}
.stage iframe{position:absolute;top:0;left:0;border:0;background:#fff;transform-origin:0 0}
.loading{
  position:absolute;inset:0;display:grid;place-items:center;font-size:13px;font-weight:700;color:var(--ink-2);
  background:rgba(239,233,216,.85)
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<script>window.SCREENS = {"interview-choose-part.html":"<title>IELTS mock interview choose part<\/title>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n<link href=\"https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;1,9..40,400&display=swap\" rel=\"stylesheet\">\n\n<style>\n/* Layout: a chooser screen first — practise one part, or take the full test — then one screen\n   per part. Free mode lets you move between parts; full-test mode locks them into order. */\n:root{\n  color-scheme:light;\n\n  --gold:#C9A33E; --grid:rgba(28,21,8,.085);\n  --ink:#1C1508; --ink-2:#4A3D1E; --olive:#7A6A2E;\n  --cream:#F8F5EA; --cream-2:#FFFDF6; --paper:#FEFCF2;\n  --yellow:#F7DC5E; --yellow-deep:#E9C935; --yellow-soft:#FBF1B5;\n  --mint:#E3F0E0; --mint-ink:#3F6B3C;\n  --pink:#FBDDDC; --pink-ink:#A2453C;\n  --lilac:#E7E3F8; --lilac-ink:#5546A0;\n  --red:#B4443A; --red-soft:#FADFDC;\n\n  --line:2.5px solid var(--ink);\n  --line-thin:2px solid var(--ink);\n  --r-lg:20px; --r-md:14px; --r-sm:10px;\n  --shadow:0 3px 0 rgba(28,21,8,.18);\n\n  --font-ui:'Outfit',system-ui,-apple-system,sans-serif;\n  --font-read:'DM Sans',Georgia,serif;\n}\n*{box-sizing:border-box}\nhtml,body{height:100%}\nbody{\n  margin:0;font-family:var(--font-ui);color:var(--ink);\n  background-color:var(--gold);\n  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);\n  background-size:46px 46px;\n}\nbutton{font-family:inherit;color:inherit;cursor:pointer}\ntextarea{font-family:inherit}\n:focus-visible{outline:3px solid var(--ink);outline-offset:2px}\n::selection{background:var(--yellow)}\n\n.shell{\n  height:100%;max-width:1180px;margin:0 auto;\n  display:flex;flex-direction:column;gap:12px;\n  padding-inline:16px;padding-block:16px 0;\n}\n\n/* ---------------- top bar ---------------- */\n.topbar{\n  flex:none;background:var(--cream);border:var(--line);border-radius:var(--r-lg);\n  box-shadow:var(--shadow);padding:12px 14px;\n  display:flex;align-items:center;gap:12px;flex-wrap:wrap;\n}\n.iconbtn{\n  width:40px;height:40px;flex:none;border:var(--line-thin);border-radius:12px;\n  background:var(--cream-2);display:grid;place-items:center;\n}\n.iconbtn:hover{background:var(--yellow-soft)}\n.iconbtn svg{width:17px;height:17px;fill:none;stroke:var(--ink);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}\n.brand{display:flex;flex-direction:column;gap:3px;min-width:0}\n.brand h1{margin:0;font-size:19px;font-weight:800;letter-spacing:.01em;text-transform:uppercase;line-height:1}\n.brand .status{display:flex;align-items:center;gap:7px;font-size:10.5px;font-weight:700;letter-spacing:.11em;text-transform:uppercase;color:var(--olive)}\n.live{width:8px;height:8px;border-radius:999px;background:#4E9A5A;flex:none}\n.grow{flex:1;min-width:8px}\n\n.voicewrap{display:flex;flex-direction:column;align-items:center;gap:5px}\n.voicewrap .cap{font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--olive)}\n.voicerow{display:flex;align-items:center;gap:9px;flex-wrap:wrap;justify-content:center}\n.playbtn{\n  width:42px;height:38px;flex:none;border:var(--line-thin);border-radius:11px;\n  background:var(--yellow);display:grid;place-items:center;box-shadow:var(--shadow);\n}\n.playbtn:hover{background:var(--yellow-deep)}\n.playbtn svg{width:14px;height:14px;fill:var(--ink)}\n.voicesel{\n  appearance:none;font-family:var(--font-ui);font-size:14px;font-weight:600;color:var(--ink);\n  background:var(--cream-2);border:var(--line-thin);border-radius:12px;padding:9px 34px 9px 14px;\n  background-image:url(\"data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%231C1508' stroke-width='2.4' stroke-linecap='round'><path d='M6 9l6 6 6-6'/><\/svg>\");\n  background-repeat:no-repeat;background-position:right 11px center;background-size:15px;\n}\n.chip{\n  display:inline-flex;align-items:center;gap:7px;flex:none;\n  border:var(--line-thin);border-radius:11px;background:var(--cream-2);\n  padding:9px 13px;font-size:11.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;\n  font-variant-numeric:tabular-nums;\n}\n.chip svg{width:13px;height:13px;fill:none;stroke:var(--ink);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}\n.chip.counter{background:var(--yellow-soft)}\n.chip.mode{background:var(--ink);color:var(--cream)}\n.chip.mode svg{stroke:var(--cream)}\n.endbtn{\n  flex:none;border:var(--line-thin);border-radius:11px;background:var(--red-soft);color:var(--red);\n  padding:9px 18px;font-size:14px;font-weight:700;\n}\n.endbtn:hover{background:#F6CFCB}\n\n/* ---------------- chooser ---------------- */\n.chooser{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:4px 4px 20px}\n.choosehead{text-align:center;margin:10px 0 20px}\n.choosehead h2{margin:0;font-size:30px;font-weight:800;letter-spacing:-.015em;line-height:1.1;text-wrap:balance}\n.choosehead p{margin:8px auto 0;max-width:52ch;font-family:var(--font-read);font-size:15.5px;line-height:1.55;color:var(--ink-2)}\n.options{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}\n@media (max-width:860px){.options{grid-template-columns:1fr}}\n.opt{\n  text-align:left;background:var(--cream);border:var(--line);border-radius:var(--r-lg);\n  box-shadow:var(--shadow);padding:18px 19px;display:flex;flex-direction:column;gap:9px;\n  transition:transform .12s,box-shadow .12s;\n}\n.opt:hover{transform:translateY(-2px);box-shadow:0 6px 0 rgba(28,21,8,.2)}\n.opt:active{transform:translateY(1px);box-shadow:0 2px 0 rgba(28,21,8,.2)}\n.opt .top{display:flex;align-items:center;gap:10px}\n.opt .num{\n  width:38px;height:38px;flex:none;border-radius:999px;border:var(--line-thin);background:var(--yellow);\n  display:grid;place-items:center;font-size:16px;font-weight:800;\n}\n.opt .nm{font-size:16px;font-weight:800;letter-spacing:-.01em;line-height:1.15}\n.opt .state{\n  margin-left:auto;flex:none;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;\n  border:1.8px solid var(--ink);border-radius:999px;padding:3px 9px;background:var(--cream-2);\n}\n.opt .state.done{background:var(--mint);color:var(--mint-ink)}\n.opt .d{font-family:var(--font-read);font-size:13.5px;line-height:1.5;color:var(--ink-2);margin:0;flex:1}\n.opt .facts{display:flex;gap:7px;flex-wrap:wrap}\n.opt .facts span{\n  font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;\n  border:1.8px solid var(--ink);border-radius:999px;padding:4px 10px;background:var(--yellow-soft);\n}\n.opt .go{\n  margin-top:3px;display:inline-flex;align-items:center;gap:8px;align-self:flex-start;\n  font-size:13.5px;font-weight:700;border-bottom:2.5px solid var(--ink);padding-bottom:1px;\n}\n.opt .go svg{width:14px;height:14px;fill:none;stroke:var(--ink);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}\n\n.opt.full{\n  grid-column:1/-1;background:var(--ink);border-color:var(--ink);color:var(--cream);\n  flex-direction:row;align-items:center;gap:18px;flex-wrap:wrap;\n}\n.opt.full .num{background:var(--yellow);border-color:var(--yellow)}\n.opt.full .nm{font-size:19px}\n.opt.full .d{color:#E7DFC9;min-width:220px}\n.opt.full .facts span{background:rgba(255,253,246,.14);border-color:rgba(255,253,246,.5);color:var(--cream)}\n.opt.full .state{background:rgba(255,253,246,.14);border-color:rgba(255,253,246,.5);color:var(--cream)}\n.opt.full .go{border-bottom-color:var(--yellow);color:var(--yellow)}\n.opt.full .go svg{stroke:var(--yellow)}\n.opt.full .body{flex:1;min-width:240px;display:flex;flex-direction:column;gap:8px}\n\n/* ---------------- part rail ---------------- */\n.rail{flex:none;display:flex;gap:10px;flex-wrap:wrap;align-items:stretch}\n.part{\n  flex:1;min-width:190px;border:var(--line-thin);border-radius:var(--r-md);text-align:left;\n  background:rgba(255,253,246,.5);padding:9px 12px;display:flex;flex-direction:column;gap:5px;\n}\n.part:not(:disabled):hover{background:rgba(255,253,246,.85)}\n.part.now{background:var(--cream);border:var(--line);box-shadow:var(--shadow)}\n.part:disabled{opacity:.6;cursor:not-allowed}\n.part .pt{display:flex;align-items:center;gap:8px}\n.part .pn{font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase}\n.part .pk{font-size:10.5px;font-weight:600;color:var(--ink-2);margin-left:auto;font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:5px}\n.part .pk svg{width:11px;height:11px;fill:none;stroke:var(--ink-2);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}\n.part .pd{font-size:11px;font-family:var(--font-read);color:var(--ink-2);line-height:1.3}\n.segs{display:flex;gap:3px}\n.seg{flex:1;height:6px;border:1.5px solid var(--ink);border-radius:999px;background:transparent}\n.seg.done{background:var(--ink)}\n.seg.now{background:var(--yellow)}\n.tick{width:16px;height:16px;border-radius:999px;border:1.8px solid var(--ink);display:grid;place-items:center;flex:none}\n.tick.on{background:var(--ink)}\n.tick svg{width:9px;height:9px;fill:none;stroke:var(--cream);stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}\n\n/* ---------------- screens ---------------- */\n.screens{flex:1;min-height:0;display:flex}\n.screen{flex:1;min-width:0;display:flex;flex-direction:column}\n.thread{\n  flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;\n  display:flex;flex-direction:column;gap:15px;padding:4px 4px 18px;scroll-behavior:smooth;\n}\n.turn{display:flex;flex-direction:column;gap:14px;animation:rise .28s ease-out}\n@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}\n\n.intro{\n  align-self:center;width:min(620px,96%);margin-top:auto;margin-bottom:auto;\n  background:var(--cream);border:var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow);padding:24px 26px;\n}\n.intro .pin{\n  display:inline-block;font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;\n  background:var(--ink);color:var(--cream);border-radius:999px;padding:6px 14px;\n}\n.intro h2{margin:13px 0 6px;font-size:27px;font-weight:800;letter-spacing:-.01em;line-height:1.15;text-wrap:balance}\n.intro .say{font-family:var(--font-read);font-size:16px;line-height:1.6;color:var(--ink-2);margin:0}\n.facts{display:flex;gap:9px;flex-wrap:wrap;margin-top:17px}\n.facts span{\n  font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;\n  border:var(--line-thin);border-radius:999px;padding:6px 13px;background:var(--yellow-soft);\n}\n\n.divider{display:flex;align-items:center;gap:12px;margin:4px 0}\n.divider span{\n  font-size:10.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--ink);\n  background:var(--yellow-soft);border:var(--line-thin);border-radius:999px;padding:5px 14px;flex:none;\n}\n.divider::before,.divider::after{content:'';flex:1;height:2px;background:rgba(28,21,8,.3)}\n\n.ask{position:relative;align-self:flex-start;max-width:min(640px,92%);margin-left:22px}\n.quotemark{\n  position:absolute;left:-22px;top:-14px;width:38px;height:38px;border-radius:999px;\n  background:var(--ink);color:var(--cream);display:grid;place-items:center;\n  font-size:21px;font-weight:800;line-height:1;padding-top:9px;font-family:Georgia,serif;\n}\n.bubble{\n  background:var(--cream);border:var(--line);border-radius:var(--r-lg);\n  box-shadow:var(--shadow);padding:16px 20px;\n}\n.bubble .tag{font-size:10.5px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--olive);margin-bottom:7px}\n.bubble .say{font-family:var(--font-read);font-size:17px;line-height:1.5;margin:0}\n.askrow{display:flex;align-items:flex-start;gap:12px}\n.hearbtn{\n  flex:none;width:34px;height:34px;border:var(--line-thin);border-radius:999px;background:var(--yellow);\n  display:grid;place-items:center;margin-top:1px;\n}\n.hearbtn:hover{backgroun lass=\"live\"><\/span> <span id=\"brandSub\">Choose what to practise<\/span><\/div>\n    <\/div>\n\n    <div class=\"grow\"><\/div>\n\n    <div class=\"voicewrap\">\n      <span class=\"cap\">Examiner voice<\/span>\n      <div class=\"voicerow\">\n        <button class=\"playbtn\" id=\"replayBtn\" aria-label=\"Replay the question\">\n          <svg viewBox=\"0 0 24 24\"><path d=\"M8 5v14l11-7z\"/><\/svg>\n        <\/button>\n        <select class=\"voicesel\" id=\"voice\" aria-label=\"Examiner accent\">\n          <option>British (UK)<\/option>\n          <option>American (US)<\/option>\n          <option>Australian (AU)<\/option>\n        <\/select>\n        <button class=\"iconbtn\" aria-label=\"Mute examiner\">\n          <svg viewBox=\"0 0 24 24\"><path d=\"M4 9v6h4l5 4V5L8 9H4zM17 9.5a4 4 0 0 1 0 5M19.5 7a7 7 0 0 1 0 10\"/><\/svg>\n        <\/button>\n        <span class=\"chip mode\" id=\"modeChip\" hidden>\n          <svg viewBox=\"0 0 24 24\"><path d=\"M5 13l4 4L19 7\"/><\/svg> <span id=\"modeText\">Full test<\/span>\n        <\/span>\n        <span class=\"chip\"><svg viewBox=\"0 0 24 24\"><path d=\"M4 6h16M4 12h16M4 18h10\"/><\/svg>\n          <span id=\"posText\">Choose a part<\/span><\/span>\n        <span class=\"chip counter\">\n          <svg viewBox=\"0 0 24 24\"><circle cx=\"12\" cy=\"12\" r=\"8\"/><path d=\"M12 8v4l3 2\"/><\/svg>\n          3/3 free credits / 24h\n        <\/span>\n        <button class=\"endbtn\" id=\"endBtn\">Reset<\/button>\n      <\/div>\n    <\/div>\n  <\/header>\n\n  <\u0021-- chooser screen -->\n  <div class=\"chooser\" id=\"chooser\">\n    <div class=\"choosehead\">\n      <h2>What would you like to practise?<\/h2>\n      <p>Practise one part on its own, or sit the whole test from start to finish. Either way the\n         AI coach gives you feedback at the end of each part.<\/p>\n    <\/div>\n    <div class=\"options\" id=\"options\"><\/div>\n  <\/div>\n\n  <\u0021-- part screens -->\n  <div class=\"rail\" id=\"rail\" hidden><\/div>\n  <div class=\"screens\" id=\"screens\" hidden>\n    <section class=\"screen\" id=\"screen-0\"><div class=\"thread\" id=\"thread-0\" tabindex=\"-1\"><\/div><\/section>\n    <section class=\"screen\" id=\"screen-1\" hidden><div class=\"thread\" id=\"thread-1\" tabindex=\"-1\"><\/div><\/section>\n    <section class=\"screen\" id=\"screen-2\" hidden><div class=\"thread\" id=\"thread-2\" tabindex=\"-1\"><\/div><\/section>\n  <\/div>\n\n  <footer class=\"composer\" id=\"composer\" hidden><\/footer>\n<\/div>\n\n<script>\n(function(){\n\"use strict\";\n\n/* ============================ test content ============================ */\nvar PARTS = [\n  {\n    name:'Part 1', desc:'Introduction and interview', kind:'questions', minutes:'4–5 minutes',\n    brief:'The examiner asks about you, your home, your work or studies, and other familiar topics. Answer naturally — two or three sentences, always with a reason.',\n    questions:[\n      { set:'Hometown', q:'Where is your hometown?',\n        sample:'My hometown is Hải Phòng, a port city in the north, about two hour from Hanoi by car. It is quite big but not so crowded like Hanoi.' },\n      { set:'Hometown', q:'What do you like most about your hometown?',\n        sample:'The food, especially the seafood. There are many small restaurant near the sea and the price is very reasonable.' },\n      { set:'Hometown', q:'Is it a good place for young people to live?',\n        sample:'Yes and no. It is comfortable and cheap to live, but there are not many opportunity for career, so a lot of my friend moved to Hanoi.' },\n      { set:'Work', q:'Do you work, or are you a student?',\n        sample:'I am working now. I am a marketing assistant for a company make cosmetics, and I have done this job for about one year and a half.' },\n      { set:'Work', q:'What do you enjoy most about your job?',\n        sample:'I enjoy working with my team because they are young and friendly. Also I can learn a lot of thing about design and social media.' },\n      { set:'Work', q:'Would you like to change your job in the future?',\n        sample:'Maybe in two or three years. I want to try a bigger company, or, um, maybe study abroad if I can save enough money.' },\n      { set:'Weather', q:'What kind of weather do you like most?',\n        sample:'I like sunny weather but not too hot. In my city it is very humid in summer, so I prefer autumn when the air is cool and dry.' },\n      { set:'Weather', q:'Does the weather affect how you feel?',\n        sample:'Yes, definitely. When it rain many days I feel tired and lazy, but on a sunny morning I have more energy to go out.' },\n      { set:'Weather', q:'Is the weather in your hometown similar to other parts of your country?',\n        sample:'Not really. My hometown is in the north so we have four season, but in the south it is hot all year with only rainy and dry season.' },\n      { set:'Weather', q:'Has the weather in your country changed in recent years?',\n        sample:'Yes, I think it changed a lot. The summer is hotter than before and the rain come at strange time, not like when I was a child.' }\n    ],\n    tip:'Phản xạ tốt, bạn trả lời ngay và không im lặng lâu. Lỗi lặp lại nhiều nhất là danh từ số nhiều sau số đếm và từ chỉ lượng: \"two hours\", \"four seasons\", \"many restaurants\", \"a lot of things\". Những câu dưới 20 từ nên kéo dài thêm một lý do hoặc ví dụ.'\n  },\n  {\n    name:'Part 2', desc:'Individual long turn', kind:'cue', minutes:'3–4 minutes',\n    brief:'You get a task card. You have one minute to prepare and may write notes, then you speak on your own for one to two minutes. The examiner will not interrupt you.',\n    cue:{\n      title:'Describe a skill you would like to learn.',\n      bullets:['what the skill is','how you would learn it','how long it would take to learn'],\n      explain:'And explain why you want to learn this skill.'\n    },\n    sample:'I would like to talk about playing the guitar, because it is a skill I have wanted for a long time but I never had enough time to learn it properly. I think I would learn it by watching video on YouTube first, and maybe later I will join a small class near my house, because practicing with a teacher is more effective than practicing alone. I think it would take about one year to play some simple song, but to play really well it will take much longer, maybe three or four year. The reason I want to learn it is because music make me relax after a stressful day at work, and I also think it would be a good skill to have at parties with my friends.',\n    tip:'Bạn nói gần đủ hai phút và bao quát cả bốn ý trên cue card — đây là điều giám khảo nhìn vào đầu tiên. Cần chú ý thì khi nói về dự định: \"I would join\" chứ không phải \"I will join\", và \"three or four years\".'\n  },\n  {\n    name:'Part 3', desc:'Two-way discussion', kind:'questions', minutes:'4–5 minutes',\n    brief:'The examiner asks broader questions linked to the Part 2 topic. Give reasons, examples and more than one point of view — these answers should be longer than in Part 1.',\n    questions:[\n      { set:'Learning & technology', q:'Do you think people learn new skills differently now compared to the past?',\n        sample:'Definitely, it is very different now. In the past you must go to a class or find a teacher, but now you can learn almost everything on the internet. My father learned to repair his motorbike just from watching video. But the problem is people give up more easy now, because nobody is checking on them.' },\n      { set:'Learning & technology', q:\"What kinds of skills should schools teach that they don't teach now?\",\n        sample:'I think schools should teach more practical thing like managing money, or how to speak in front of people. When I left school I did not know anything about tax or saving and I had to learn it myself, which was quite stressful.' },\n      { set:'Learning & technology', q:'Is it ever too late for someone to learn a new skill?',\n        sample:'No, I do not think so. My mother started to learn English when she was fifty and now she can talk with foreign customer quite confident. Maybe it takes more time when you are older, but it is never impossible.' },\n      { set:'Learning & technology', q:'Should employers pay for their staff to learn new skills?',\n        sample:'Yes, I think it is good for both side. If the company pay for training, the staff will be more loyal and also more skillful, so the company get benefit too. But some employer worry that people will leave after they finish the course.' },\n      { set:'Learning & technology', q:'Which is more useful, learning from a teacher or learning on your own?',\n        sample:'It depend on the skill. For language I think a teacher is better because they correct your mistake immediately, but for computer skill you can learn alone with video and a lot of practice.' }\n    ],\n    tip:'Ý tưởng tốt và luôn có ví dụ thật — đây là điểm mạnh của bạn ở Part 3. Hãy dùng trạng từ thay cho tính từ: \"quite confidently\", \"more easily\", và mở rộng câu trả lời bằng \"on the other hand\" hoặc \"that said\".'\n  }\n];\n\nvar FILLERS = ['um','uh','er','ah','like','you know','i mean','sort of','kind of','actually','basically','well'];\nvar PREP_SECONDS = 60, SHORT_ANSWER = 20;\n\n/* ============================ state ============================ */\nvar S = PARTS.map(function(){\n  return { phase:'intro', q:0, log:[], seconds:0, recording:false, draft:'', notes:'', prepLeft:PREP_SECONDS };\n});\nvar mode = 'choose';        /* choose | single | full */\nvar screen = 0, timer = null, prepTimer = null, testDone = false;\n\nvar composer = document.getElementById('composer');\nfunction st(){ return S[screen]; }\nfunction part(){ return PARTS[screen]; }\nfunction thread(i){ return document.getElementById('thread-' + (i === undefined ? screen : i)); }\nfunction qCount(p){ return p.kind === 'cue' ? 1 : p.questions.length; }\nfunction words(t){ return t.trim().split(/\\s+/).filter(Boolean); }\nfunction clock(s){ return Math.floor(s/60) + ':' + String(Math.floor(s%60)).padStart(2,'0'); }\nfunction esc(s){ return String(s).replace(/&/g,'&amp;').replace(/<\/g,'&lt;').replace(/>/g,'&gt;'); }\nfunction scrollDown(){ var t = thread(); if (t) requestAnimationFrame(function(){ t.scrollTop = t.scrollHeight; }); }\nfunction countFillers(text){\n  var low = ' ' + text.toLowerCase().replace(/[.,!?;:]/g,' ') + ' ', n = 0;\n  FILLERS.forEach(function(f){\n    var m = low.match(new RegExp('\\\\s' + f.replace(/ /g,'\\\\s+') + '\\\\s','g'));\n    if (m) n += m.length;\n  });\n  return n;\n}\nfunction stopTimers(){ clearInterval(timer); clearInterval(prepTimer); timer = prepTimer = null; }\nfunction done(i){ return S[i].log.length === qCount(PARTS[i]); }\n\n/* ============================ chooser ============================ */\nfunction renderChooser(){\n  var html = PARTS.map(function(p,i){\n    var d = done(i), n = S[i].log.length;\n    return '<button class=\"opt\" data-part=\"' + i + '\">'\n      + '<span class=\"top\"><span class=\"num\">' + p.name.replace('Part ','') + '<\/span>'\n      + '<span class=\"nm\">' + p.name + '<br>' + esc(p.desc) + '<\/span>'\n      + '<span class=\"state' + (d ? ' done' : '') + '\">' + (d ? 'Done' : (n ? n + '/' + qCount(p) : 'Not started')) + '<\/span><\/span>'\n      + '<p class=\"d\">' + esc(p.brief) + '<\/p>'\n      + '<span class=\"facts\"><span>' + p.minutes + '<\/span>'\n      + '<span>' + (p.kind === 'cue' ? '1 task card' : qCount(p) + ' questions') + '<\/span><\/span>'\n      + '<span class=\"go\">Practise ' + p.name\n      + ' <svg viewBox=\"0 0 24 24\"><path d=\"M5 12h14M13 6l6 6-6 6\"/><\/svg><\/span><\/button>';\n  }).join('');\n\n  var allDone = PARTS.every(function(p,i){ return done(i); });\n  html += '<button class=\"opt full\" data-full=\"1\">'\n    + '<span class=\"num\"><svg viewBox=\"0 0 24 24\" style=\"width:19px;height:19px;fill:none;stroke:#1C1508;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round\"><path d=\"M5 13l4 4L19 7\"/><\/svg><\/span>'\n    + '<span class=\"body\">'\n      + '<span class=\"top\"><span class=\"nm\">Take the full test<\/span>'\n      + '<span class=\"state\">' + (allDone ? 'Completed' : 'Parts 1, 2 and 3 in order') + '<\/span><\/span>'\n      + '<p class=\"d\">The real thing, start to finish. Part 2 only opens once Part 1 is finished, and '\n      + 'Part 3 once Part 2 is done — you cannot skip ahead or go back.<\/p>'\n      + '<span class=\"facts\"><span>About 14 minutes<\/span><span>16 turns<\/span><span>Feedback after every part<\/span><\/span>'\n      + '<span class=\"go\">Start the full test'\n      + ' <svg viewBox=\"0 0 24 24\"><path d=\"M5 12h14M13 6l6 6-6 6\"/><\/svg><\/span>'\n    + '<\/span><\/button>';\n\n  document.getElementById('options').innerHTML = html;\n  document.querySelectorAll('[data-part]').forEach(function(b){\n    b.addEventListener('click', function(){ openPart(+b.dataset.part, 'single'); });\n  });\n  document.querySelector('[data-full]').addEventListener('click', startFullTest);\n}\n\nfunction showChooser(){\n  stopTimers();\n  if (st() && st().recording) st().recording = false;\n  mode = 'choose';\n  document.getElementById('chooser').hidden = false;\n  document.getElementById('rail').hidden = true;\n  document.getElementById('screens').hidden = true;\n  composer.hidden = true;\n  document.getElementById('modeChip').hidden = true;\n  document.getElementById('posText').textContent = 'Choose a part';\n  document.getElementById('brandSub').textContent = 'Choose what to practise';\n  renderChooser();\n}\n\nfunction openPart(i, m){\n  mode = m;\n  document.getElementById('chooser').hidden = true;\n  document.getElementById('rail').hidden = false;\n  document.getElementById('screens').hidden = false;\n  composer.hidden = false;\n  document.getElementById('modeChip').hidden = m !== 'full';\n  document.getElementById('modeText').textContent = 'Full test';\n  document.getElementById('screen-' + screen).hidden = true;\n  screen = i;\n  document.getElementById('screen-' + screen).hidden = false;\n  if (st().phase === 'prep') st().phase = 'answering';\n  renderRail();\n  renderComposer();\n  scrollDown();\n}\n\nfunction startFullTest(){\n  stopTimers();\n  S = PARTS.map(function(){\n    return { phase:'intro', q:0, log:[], seconds:0, recording:false, draft:'', notes:'', prepLeft:PREP_SECONDS };\n  });\n  testDone = false;\n  PARTS.forEach(function(p,i){ thread(i).innerHTML = ''; showIntro(i); });\n  screen = 0;\n  document.getElementById('screen-1').hidden = true;\n  document.getElementById('screen-2').hidden = true;\n  document.getElementById('screen-0').hidden = false;\n  openPart(0, 'full');\n}\n\n/* ============================ rail ============================ */\nfunction renderRail(){\n  document.getElementById('rail').innerHTML = PARTS.map(function(p,i){\n    var s = S[i], total = qCount(p), n = s.log.length, segs = '';\n    var locked = mode === 'full' && i > screen && !done(i);\n    for (var k = 0; k < total; k++){\n      segs += '<span class=\"seg ' + (k < n ? 'done' : (i === screen && k === s.q && s.phase !== 'intro' && s.phase !== 'feedback' ? 'now' : '')) + '\"><\/span>';\n    }\n    return '<button class=\"part' + (i === screen ? ' now' : '') + '\" data-go=\"' + i + '\"'\n      + (locked ? ' disabled' : '') + ' aria-current=\"' + (i === screen) + '\">'\n      + '<span class=\"pt\"><span class=\"tick' + (n === total ? ' on' : '') + '\">'\n        + (n === total ? '<svg viewBox=\"0 0 24 24\"><path d=\"M5 13l4 4L19 7\"/><\/svg>' : '') + '<\/span>'\n      + '<span class=\"pn\">' + p.name + '<\/span>'\n      + '<span class=\"pk\">' + (locked\n          ? '<svg viewBox=\"0 0 24 24\"><rect x=\"5\" y=\"11\" width=\"14\" height=\"10\" rx=\"2\"/><path d=\"M8 11V7a4 4 0 0 1 8 0v4\"/><\/svg> Locked'\n          : n + '/' + total) + '<\/span><\/span>'\n      + '<span class=\"segs\">' + segs + '<\/span>'\n      + '<span class=\"pd\">' + p.desc + '<\/span><\/button>';\n  }).join('');\n  document.querySelectorAll('[data-go]').forEach(function(b){\n    b.addEventListener('click', function(){\n      var i = +b.dataset.go;\n      if (i !== screen) goScreen(i);\n    });\n  });\n\n  var p = part(), s = st(), txt;\n  if (testDone) txt = 'Test complete';\n  else if (s.phase === 'intro') txt = p.name + ' · not started';\n  else if (s.phase === 'feedback') txt = p.name + ' · feedback';\n  else if (p.kind === 'cue') txt = p.name + ' · long turn';\n  else txt = p.name + ' · ' + Math.min(s.q + 1, p.questions.length) + '/' + p.questions.length;\n  document.getElementById('posText').textContent = txt;\n  document.getElementById('brandSub').textContent =\n    (mode === 'full' ? 'Full test · ' : 'Practising ') + p.name + ' · ' + p.desc;\n}\n\nfunction goScreen(i){\n  if (st().recording) toggleRecord();\n  stopTimers();\n  document.getElementById('screen-' + screen).hidden = true;\n  screen = i;\n  document.getElementById('screen-' + screen).hidden = false;\n  if (st().phase === 'prep') st().phase = 'answering';\n  renderRail();\n  renderComposer();\n  scrollDown();\n}\n\n/* ============================ thread blocks ============================ */\nfunction showIntro(i){\n  var p = PARTS[i];\n  var el = document.createElement('div');\n  el.className = 'turn intro';\n  el.innerHTML = '<span class=\"pin\">' + p.name + '<\/span>'\n    + '<h2>' + esc(p.desc) + '<\/h2>'\n    + '<p class=\"say\">' + esc(p.brief) + '<\/p>'\n    + '<div class=\"facts\"><span>' + p.minutes + '<\/span>'\n    + '<span>' + (p.kind === 'cue' ? '1 task card' : qCount(p) + ' questions') + '<\/span>'\n    + '<span>' + (p.kind === 'cue' ? '1 min to prepare' : 'Asked one after another') + '<\/span>'\n    + '<span>Feedback at the end<\/span><\/div>';\n  thread(i).appendChild(el);\n}\n\nfunction divider(label){\n  var d = document.createElement('div');\n  d.className = 'divider';\n  d.innerHTML = '<span>' + esc(label) + '<\/span>';\n  thread().appendChild(d);\n}\n\nfunction askQuestion(){\n  var p = part(), s = st(), q = p.questions[s.q], n = s.q + 1, mine = screen;\n  if (s.q === 0 || p.questions[s.q - 1].set !== q.set) divider(p.name + ' · ' + q.set);\n\n  var turn = document.createElement('div');\n  turn.className = 'turn';\n  turn.innerHTML = '<div class=\"ask\"><div class=\"quotemark\">&rdquo;<\/div><div class=\"bubble\">'\n    + '<div class=\"tag\">Examiner · Question ' + n + ' of ' + p.questions.length + '<\/div>'\n    + '<div class=\"dots\" aria-label=\"The examiner is speaking\"><i><\/i><i><\/i><i><\/i><\/div>'\n    + '<\/div><\/div>';\n  thread().appendChild(turn);\n  scrollDown();\n\n  setTimeout(function(){\n    turn.querySelector('.bubble').innerHTML =\n      '<div class=\"tag\">Examiner · Question ' + n + ' of ' + p.questions.length + '<\/div>'\n      + '<div class=\"askrow\">'\n      + '<button class=\"hearbtn\" aria-label=\"Hear the question again\"><svg viewBox=\"0 0 24 24\"><path d=\"M8 5v14l11-7z\"/><\/svg><\/button>'\n      + '<p class=\"say\">' + esc(q.q) + '<\/p><\/div>';\n    S[mine].phase = 'answering';\n    if (screen === mine && mode !== 'choose'){ renderComposer(); scrollDown(); }\n  }, 950);\n}\n\nfunction showCue(){\n  var c = part().cue;\n  var el = document.createElement('div');\n  el.className = 'turn cue';\n  el.innerHTML = '<div class=\"tag\">Examiner · Candidate task card<\/div>'\n    + '<h2>' + esc(c.title) + '<\/h2>'\n    + '<div class=\"lead\">You should say:<\/div>'\n    + '<ul>' + c.bullets.map(function(b){ return '<li>' + esc(b) + '<\/li>'; }).join('') + '<\/ul>'\n    + '<p class=\"explain\">' + esc(c.explain) + '<\/p>'\n    + '<div class=\"rules\"><span>1 minute to prepare<\/span><span>Speak for 1–2 minutes<\/span><span>Notes allowed<\/span><\/div>';\n  thread().appendChild(el);\n  scrollDown();\n  startPrep();\n}\n\nfunction addAnswer(text, secs, label){\n  var el = document.createElement('div');\n  el.className = 'turn said';\n  el.innerHTML = '<div class=\"bubble\"><div class=\"head\">'\n    + '<div class=\"tag\">You · ' + esc(label) + '<\/div>'\n    + '<span class=\"stamp\">' + clock(secs) + '<\/span><\/div>'\n    + '<p class=\"say\">' + esc(text) + '<\/p><\/div>';\n  thread().appendChild(el);\n  scrollDown();\n}\n\n/* ============================ feedback ============================ */\nfunction addPartFeedback(){\n  var p = part(), mine = screen, answers = S[mine].log;\n  var el = document.createElement('div');\n  el.className = 'turn coach';\n  el.innerHTML = '<div class=\"coachhead\"><span class=\"tag\">AI coach feedback · ' + p.name + '<\/span>'\n    + '<span class=\"pill\">Analysing ' + answers.length + ' answer' + (answers.length > 1 ? 's' : '') + '…<\/span><\/div>'\n    + '<div class=\"dots\"><i><\/i><i><\/i><i><\/i><\/div>';\n  thread(mine).appendChild(el);\n  scrollDown();\n\n  setTimeout(function(){\n    var tw = 0, ts = 0, tf = 0;\n    answers.forEach(function(a){ tw += a.words; ts += a.secs; tf += countFillers(a.text); });\n    var wpm = ts > 3 ? Math.round(tw / (ts / 60)) : null;\n    var pauses = ts > 3 ? Math.max(0, Math.round(ts / 14) - Math.round(tw / 42)) : null;\n    var conf = ts > 3 ? Math.min(92, 40 + Math.round(tw / 3)) : 20;\n    var short = answers.filter(function(a){ return a.words < SHORT_ANSWER; }).length;\n\n    var rows = '';\n    if (p.kind === 'questions'){\n      rows = '<div class=\"perq\"><div class=\"k\">Answer length · every question in ' + p.name + '<\/div>'\n        + answers.map(function(a,i){\n            return '<div class=\"qrow\"><span class=\"num\">Q' + (i+1) + '<\/span>'\n              + '<span class=\"txt\">' + esc(p.questions[i].q) + '<\/span>'\n              + '<span class=\"w\">' + a.words + 'w<\/span>'\n              + (a.words < SHORT_ANSWER ? '<span class=\"flag\">Too short<\/span>' : '') + '<\/div>';\n          }).join('') + '<\/div>';\n    }\n\n    el.innerHTML =\n      '<div class=\"coachhead\"><span class=\"tag\">AI coach feedback · ' + p.name + '<\/span>'\n      + '<span class=\"pill\">' + (ts > 3 ? p.name + ' complete' : 'Fallback feedback') + '<\/span><\/div>'\n      + '<p class=\"note\">' + esc(ts > 3 ? p.tip\n          : 'Mình đã lưu file nói, nhưng cần transcript để AI phản hồi nội dung câu trả lời.')\n      + (short > 0 && p.kind === 'questions' && ts > 3\n          ? ' <strong>' + short + ' câu trả lời còn quá ngắn<\/strong> (dưới ' + SHORT_ANSWER + ' từ).' : '') + '<\/p>'\n      + '<div class=\"panel\">'\n        + '<div class=\"panelhead\"><div><h3>Pronunciation coach · Fluency signals<\/h3>'\n        + '<p class=\"sub\">Measured across every answer in ' + p.name + '. Practice signals, not an absolute IELTS Pronunciation band.<\/p><\/div>'\n        + '<span class=\"conf\">Confidence ' + conf + '%<\/span><\/div>'\n        + '<div class=\"signalslab\">Fluency signals · whole part<\/div>'\n        + '<div class=\"tiles\">'\n          + tile('rate','Speaking rate · wpm', wpm === null ? '—' : wpm,\n                 wpm === null ? 'Not enough data' : (wpm < 95 ? 'A little slow' : wpm > 165 ? 'Rushing slightly' : 'Natural pace'), wpm === null)\n          + tile('pause','Long pauses', pauses === null ? '—' : pauses,\n                 pauses === null ? 'No audio signal' : (pauses === 0 ? 'None over 3s' : 'Over 3 seconds'), pauses === null)\n          + tile('filler','Filler words', tf, tf === 0 ? 'None detected' : 'Across ' + answers.length + ' answer' + (answers.length > 1 ? 's' : ''), false)\n          + tile('clarity','Pronunciation clarity','Not analyzed','Requires a phoneme model', true)\n        + '<\/div>' + rows\n        + '<div class=\"practise\"><div class=\"k\">Words to practise<\/div>'\n        + '<p>Words to practise, final sounds, stress, and intonation will be added with phoneme analysis; the system does not guess them.<\/p><\/div>'\n      + '<\/div>';\n\n    S[mine].phase = 'feedback';\n    if (mode === 'full'){\n      if (mine < PARTS.length - 1) addGate(mine);\n      else { addWrapUp(mine); testDone = true; }\n    }\n    renderRail();\n    if (screen === mine){ renderComposer(); scrollDown(); }\n  }, 1100);\n}\n\nfunction tile(cls, k, v, n, small){\n  return '<div class=\"tile ' + cls + '\"><div class=\"k\">' + k + '<\/div>'\n    + '<div class=\"v' + (small ? ' small' : '') + '\">' + v + '<\/div>'\n    + '<div class=\"n\">' + n + '<\/div><\/div>';\n}\n\nfunction addGate(i){\n  var next = PARTS[i + 1];\n  var el = document.createElement('div');\n  el.className = 'turn gate';\n  el.innerHTML = '<div class=\"n\">' + next.name.replace('Part ','') + '<\/div>'\n    + '<div class=\"t\"><h2>' + next.name + ' is now unlocked · ' + esc(next.desc) + '<\/h2>'\n    + '<p>' + esc(next.brief) + ' ' + next.minutes + '.<\/p><\/div>';\n  thread(i).appendChild(el);\n}\n\nfunction addWrapUp(i){\n  var tw = 0, ts = 0, tf = 0, answered = 0, total = 0, parts = 0;\n  PARTS.forEach(function(p,k){\n    total += qCount(p);\n    if (done(k)) parts++;\n    S[k].log.forEach(function(a){ tw += a.words; ts += a.secs; tf += countFillers(a.text); answered++; });\n  });\n  var el = document.createElement('div');\n  el.className = 'turn wrap';\n  el.innerHTML = '<h2>Speaking test complete<\/h2>'\n    + '<p class=\"sub\">You answered ' + answered + ' of ' + total + ' turns across all three parts, in order. '\n    + 'Every recording is saved — a teacher can review them and give the official band.<\/p>'\n    + '<div class=\"sums\">'\n      + '<div class=\"sum\"><div class=\"k\">Parts finished<\/div><div class=\"v\">' + parts + '/3<\/div><div class=\"n\">Part 1, 2 and 3<\/div><\/div>'\n      + '<div class=\"sum\"><div class=\"k\">Time spoken<\/div><div class=\"v\">' + clock(ts) + '<\/div><div class=\"n\">Whole test<\/div><\/div>'\n      + '<div class=\"sum\"><div class=\"k\">Words<\/div><div class=\"v\">' + tw + '<\/div><div class=\"n\">' + (ts > 3 ? Math.round(tw/(ts/60)) : '—') + ' wpm average<\/div><\/div>'\n      + '<div class=\"sum\"><div class=\"k\">Filler words<\/div><div class=\"v\">' + tf + '<\/div><div class=\"n\">Whole test<\/div><\/div>'\n    + '<\/div>';\n  thread(i).appendChild(el);\n}\n\n/* ============================ composer ============================ */\nfunction renderComposer(){\n  var p = part(), s = st();\n  if (s.phase === 'intro') return renderIntroBar();\n  if (s.phase === 'prep') return renderPrep();\n  if (s.phase === 'feedback') return renderAfter();\n\n  var answering = s.phase === 'answering', isCue = p.kind === 'cue';\n  var hint = s.recording ? clock(s.seconds) + (isCue ? ' / 2:00' : ' · tap to stop')\n            : (s.seconds > 0 ? clock(s.seconds) + ' saved' : 'Tap to answer');\n\n  composer.innerHTML =\n    '<div class=\"micwrap\">'\n      + '<button class=\"mic' + (s.recording ? ' live' : '') + '\" id=\"micBtn\"' + (answering ? '' : ' disabled') + ' aria-label=\"Record your answer\">'\n        + '<svg viewBox=\"0 0 24 24\"><rect x=\"9\" y=\"3\" width=\"6\" height=\"11\" rx=\"3\"/><path d=\"M5 11a7 7 0 0 0 14 0M12 18v3\"/><\/svg><\/button>'\n      + '<span class=\"miclab\" id=\"micLab\">' + (s.recording ? 'Recording' : (s.seconds > 0 ? 'Recorded' : 'Ready')) + '<\/span>'\n      + '<span class=\"michint\" id=\"micHint\">' + hint + '<\/span>'\n    + '<\/div>'\n    + '<div class=\"writer\">'\n      + '<textarea class=\"answerbox\" id=\"answer\" ' + (answering ? '' : 'disabled ')\n        + 'placeholder=\"' + (isCue ? 'Speak for one to two minutes. Your speech appears here as you talk.'\n                                   : 'Your speech appears here as you talk. You can correct it before sending.') + '\"><\/textarea>'\n      + '<div class=\"writerbar\">'\n        + '<span class=\"count\" id=\"count\">0 words<\/span>'\n        + '<button class=\"linkbtn\" id=\"sampleBtn\">Load sample answer<\/button>'\n        + '<button class=\"act\" id=\"sendBtn\" disabled>'\n        + (isCue ? 'Finish long turn' : (s.q + 1 < p.questions.length ? 'Next question' : 'Finish ' + p.name))\n        + ' <svg viewBox=\"0 0 24 24\"><path d=\"M5 12h14M13 6l6 6-6 6\"/><\/svg><\/button>'\n      + '<\/div>'\n    + '<\/div>';\n\n  var box = document.getElementById('answer');\n  box.value = s.draft || '';\n  updateCount();\n  box.addEventListener('input', function(){ s.draft = box.value; updateCount(); });\n  document.getElementById('micBtn').addEventListener('click', toggleRecord);\n  document.getElementById('sampleBtn').addEventListener('click', loadSample);\n  document.getElementById('sendBtn').addEventListener('click', send);\n}\n\nfunction renderIntroBar(){\n  var p = part();\n  composer.innerHTML =\n    '<div class=\"prepwrap\"><div class=\"prepdial\">' + p.name.replace('Part ','') + '<\/div>'\n      + '<span class=\"miclab\">' + p.name + '<\/span><span class=\"michint\">Not started<\/span><\/div>'\n    + '<div class=\"writer\">'\n      + '<div class=\"saved\"><span>' + esc(p.brief) + '<\/span>'\n        + '<button class=\"act\" id=\"beginBtn\">Begin ' + p.name\n        + ' <svg viewBox=\"0 0 24 24\"><path d=\"M5 12h14M13 6l6 6-6 6\"/><\/svg><\/button><\/div>'\n      + '<div class=\"writerbar\"><span class=\"count\">' + p.minutes + ' · '\n        + (p.kind === 'cue' ? '1 task card' : qCount(p) + ' questions, asked one after another') + '<\/span>'\n      + (mode === 'single' ? '<button class=\"linkbtn\" id=\"chooseBtn\">Choose a different part<\/button>' : '')\n      + '<\/div>'\n    + '<\/div>';\n  document.getElementById('beginBtn').addEventListener('click', beginPart);\n  var c = document.getElementById('chooseBtn');\n  if (c) c.addEventListener('click', showChooser);\n}\n\nfunction renderPrep(){\n  var s = st();\n  composer.innerHTML =\n    '<div class=\"prepwrap\">'\n      + '<div class=\"prepdial' + (s.prepLeft <= 15 ? ' low' : '') + '\" id=\"prepDial\">' + clock(s.prepLeft) + '<\/div>'\n      + '<span class=\"miclab\">Preparing<\/span><span class=\"michint\">1 minute<\/span><\/div>'\n    + '<div class=\"writer\">'\n      + '<textarea class=\"answerbox\" id=\"notes\" placeholder=\"Make notes here, as you would on the paper the examiner gives you. Notes are not graded.\"><\/textarea>'\n      + '<div class=\"writerbar\"><span class=\"count\">Notes are private<\/span>'\n        + '<button class=\"act\" id=\"startBtn\">Start speaking now'\n        + ' <svg viewBox=\"0 0 24 24\"><path d=\"M5 12h14M13 6l6 6-6 6\"/><\/svg><\/button><\/div>'\n    + '<\/div>';\n  var n = document.getElementById('notes');\n  n.value = s.notes;\n  n.addEventListener('input', function(){ s.notes = n.value; });\n  document.getElementById('startBtn').addEventListener('click', endPrep);\n}\n\nfunction renderAfter(){\n  var p = part(), s = st(), last = screen === PARTS.length - 1;\n  var full = mode === 'full';\n  composer.innerHTML =\n    '<div class=\"prepwrap\">'\n      + '<div class=\"prepdial\"><svg viewBox=\"0 0 24 24\"><path d=\"M5 13l4 4L19 7\"/><\/svg><\/div>'\n      + '<span class=\"miclab\">' + p.name + ' done<\/span>'\n      + '<span class=\"michint\">' + s.log.length + ' saved<\/span><\/div>'\n    + '<div class=\"writer\">'\n      + '<div class=\"saved\"><span>' + (full && last\n          ? 'The interview is complete. All speaking files have been saved.'\n          : full ? 'Read your ' + p.name + ' feedback above. ' + PARTS[screen + 1].name + ' is unlocked.'\n                 : p.name + ' is complete. All speaking files have been saved.') + '<\/span>'\n        + '<button class=\"act\" id=\"contBtn\">' + (full && !last\n            ? 'Start ' + PARTS[screen + 1].name + ' <svg viewBox=\"0 0 24 24\"><path d=\"M5 12h14M13 6l6 6-6 6\"/><\/svg>'\n            : '<svg viewBox=\"0 0 24 24\"><path d=\"M5 13l4 4L19 7\"/><\/svg> Finish') + '<\/button><\/div>'\n      + '<div class=\"writerbar\">'\n        + '<span class=\"count\">' + s.log.reduce(function(n,a){ return n + a.words; },0) + ' words in ' + p.name + '<\/span>'\n        + '<button class=\"linkbtn\" id=\"redoBtn\">Practise ' + p.name + ' again<\/button>'\n        + '<button class=\"act ghost\" id=\"homeBtn\">'\n        + '<svg viewBox=\"0 0 24 24\"><path d=\"M4 6h16M4 12h16M4 18h16\"/><\/svg> Choose another part<\/button>'\n      + '<\/div>'\n    + '<\/div>';\n  document.getElementById('redoBtn').addEventListener('click', function(){ resetPart(screen); });\n  document.getElementById('homeBtn').addEventListener('click', showChooser);\n  document.getElementById('contBtn').addEventListener('click', function(){\n    if (full && !last) goScreen(screen + 1);\n    else document.getElementById('contBtn').innerHTML = '<svg viewBox=\"0 0 24 24\"><path d=\"M5 13l4 4L19 7\"/><\/svg> Saved';\n  });\n}\n\nfunction updateCount(){\n  var box = document.getElementById('answer');\n  if (!box) return;\n  var n = words(box.value).length;\n  document.getElementById('count').textContent = n + (n === 1 ? ' word' : ' words');\n  var b = document.getElementById('sendBtn');\n  if (b) b.disabled = n === 0;\n}\n\n/* ============================ actions ============================ */\nfunction beginPart(){\n  var p = part(), s = st();\n  thread().innerHTML = '';\n  s.phase = 'asking';\n  renderRail();\n  renderComposer();\n  if (p.kind === 'cue') setTimeout(showCue, 300);\n  else setTimeout(askQuestion, 300);\n}\n\nfunction toggleRecord(){\n  var s = st(), isCue = part().kind === 'cue';\n  if (s.recording){\n    s.recording = false;\n    clearInterval(timer); timer = null;\n    var b = document.getElementById('micBtn');\n    if (b){\n      b.className = 'mic';\n      document.getElementById('micLab').textContent = 'Recorded';\n      document.getElementById('micHint').textContent = clock(s.seconds) + ' saved';\n    }\n  } else {\n    s.recording = true;\n    s.seconds = 0;\n    document.getElementById('micBtn').className = 'mic live';\n    document.getElementById('micLab').textContent = 'Recording';\n    timer = setInterval(function(){\n      s.seconds++;\n      var h = document.getElementById('micHint');\n      if (h) h.textContent = clock(s.seconds) + (isCue ? ' / 2:00' : ' · tap to stop');\n      if (isCue && s.seconds >= 120) toggleRecord();\n    }, 1000);\n  }\n}\n\nfunction startPrep(){\n  var s = st();\n  s.phase = 'prep';\n  s.prepLeft = PREP_SECONDS;\n  renderRail();\n  renderComposer();\n  prepTimer = setInterval(function(){\n    s.prepLeft--;\n    var d = document.getElementById('prepDial');\n    if (d){\n      d.textContent = clock(s.prepLeft);\n      d.className = 'prepdial' + (s.prepLeft <= 15 ? ' low' : '');\n    }\n    if (s.prepLeft <= 0) endPrep();\n  }, 1000);\n}\n\nfunction endPrep(){\n  clearInterval(prepTimer); prepTimer = null;\n  st().phase = 'answering';\n  renderRail();\n  renderComposer();\n}\n\nfunction loadSample(){\n  var p = part(), s = st(), box = document.getElementById('answer');\n  box.value = p.kind === 'cue' ? p.sample : p.questions[s.q].sample;\n  s.draft = box.value;\n  if (s.seconds === 0){\n    s.seconds = Math.round(words(box.value).length / (p.kind === 'cue' ? 1.3 : 2.1));\n    document.getElementById('micLab').textContent = 'Recorded';\n    document.getElementById('micHint').textContent = clock(s.seconds) + ' saved';\n  }\n  updateCount();\n  box.focus();\n}\n\nfunction send(){\n  var p = part(), s = st(), box = document.getElementById('answer');\n  var text = box.value.trim();\n  if (!text) return;\n  if (s.recording) toggleRecord();\n\n  s.log.push({ text:text, words:words(text).length, secs:s.seconds });\n  addAnswer(text, s.seconds, p.kind === 'cue' ? 'Long turn' : 'Question ' + (s.q + 1));\n  s.draft = '';\n  s.seconds = 0;\n\n  if (p.kind === 'questions' && s.q + 1 < p.questions.length){\n    s.q++;\n    s.phase = 'asking';\n    renderRail();\n    renderComposer();\n    setTimeout(askQuestion, 450);\n  } else {\n    s.phase = 'analysing';\n    renderRail();\n    renderComposer();\n    addPartFeedback();\n  }\n}\n\nfunction resetPart(i){\n  stopTimers();\n  S[i] = { phase:'intro', q:0, log:[], seconds:0, recording:false, draft:'', notes:'', prepLeft:PREP_SECONDS };\n  thread(i).innerHTML = '';\n  showIntro(i);\n  testDone = false;\n  renderRail();\n  if (screen === i) renderComposer();\n}\n\ndocument.getElementById('backBtn').addEventListener('click', showChooser);\ndocument.getElementById('endBtn').addEventListener('click', function(){\n  stopTimers();\n  S = PARTS.map(function(){\n    return { phase:'intro', q:0, log:[], seconds:0, recording:false, draft:'', notes:'', prepLeft:PREP_SECONDS };\n  });\n  testDone = false;\n  PARTS.forEach(function(p,i){ thread(i).innerHTML = ''; showIntro(i); });\n  showChooser();\n});\ndocument.getElementById('replayBtn').addEventListener('click', scrollDown);\n\nPARTS.forEach(function(p,i){ showIntro(i); });\nshowChooser();\n})();\n<\/script>\n","interview-send-full.html":"<title>IELTS mock interview send full<\/title>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n<link href=\"https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;1,9..40,400&display=swap\" rel=\"stylesheet\">\n\n<style>\n/* Layout: one continuous test. A fixed examiner bar, a read-only part rail, a single thread\n   that runs Part 1 -> 2 -> 3 in order, and a composer that changes role as the test moves on.\n   Pressing Finish asks who grades the test: Ed (the AI coach, instant) or the teacher\n   (submitted, then returned later). Both end in the same graded view. */\n:root{\n  color-scheme:light;\n\n  --gold:#C9A33E; --grid:rgba(28,21,8,.085);\n  --ink:#1C1508; --ink-2:#4A3D1E; --olive:#7A6A2E;\n  --cream:#F8F5EA; --cream-2:#FFFDF6; --paper:#FEFCF2;\n  --yellow:#F7DC5E; --yellow-deep:#E9C935; --yellow-soft:#FBF1B5;\n  --mint:#E3F0E0; --mint-ink:#3F6B3C;\n  --pink:#FBDDDC; --pink-ink:#A2453C;\n  --lilac:#E7E3F8; --lilac-ink:#5546A0;\n  --red:#B4443A; --red-soft:#FADFDC;\n\n  --line:2.5px solid var(--ink);\n  --line-thin:2px solid var(--ink);\n  --r-lg:20px; --r-md:14px; --r-sm:10px;\n  --shadow:0 3px 0 rgba(28,21,8,.18);\n\n  --font-ui:'Outfit',system-ui,-apple-system,sans-serif;\n  --font-read:'DM Sans',Georgia,serif;\n}\n*{box-sizing:border-box}\nhtml,body{height:100%}\nbody{\n  margin:0;font-family:var(--font-ui);color:var(--ink);\n  background-color:var(--gold);\n  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);\n  background-size:46px 46px;\n}\nbutton{font-family:inherit;color:inherit;cursor:pointer}\ntextarea{font-family:inherit}\n:focus-visible{outline:3px solid var(--ink);outline-offset:2px}\n::selection{background:var(--yellow)}\n\n.shell{\n  height:100%;max-width:1180px;margin:0 auto;\n  display:flex;flex-direction:column;gap:12px;\n  padding-inline:16px;padding-block:16px 0;\n}\n\n/* ---------------- top bar ---------------- */\n.topbar{\n  flex:none;background:var(--cream);border:var(--line);border-radius:var(--r-lg);\n  box-shadow:var(--shadow);padding:12px 14px;\n  display:flex;align-items:center;gap:12px;flex-wrap:wrap;\n}\n.iconbtn{\n  width:40px;height:40px;flex:none;border:var(--line-thin);border-radius:12px;\n  background:var(--cream-2);display:grid;place-items:center;\n}\n.iconbtn:hover{background:var(--yellow-soft)}\n.iconbtn svg{width:17px;height:17px;fill:none;stroke:var(--ink);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}\n.brand{display:flex;flex-direction:column;gap:3px;min-width:0}\n.brand h1{margin:0;font-size:19px;font-weight:800;letter-spacing:.01em;text-transform:uppercase;line-height:1}\n.brand .status{display:flex;align-items:center;gap:7px;font-size:10.5px;font-weight:700;letter-spacing:.11em;text-transform:uppercase;color:var(--olive)}\n.live{width:8px;height:8px;border-radius:999px;background:#4E9A5A;flex:none}\n.grow{flex:1;min-width:8px}\n\n.voicewrap{display:flex;flex-direction:column;align-items:center;gap:5px}\n.voicewrap .cap{font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--olive)}\n.voicerow{display:flex;align-items:center;gap:9px;flex-wrap:wrap;justify-content:center}\n.playbtn{\n  width:42px;height:38px;flex:none;border:var(--line-thin);border-radius:11px;\n  background:var(--yellow);display:grid;place-items:center;box-shadow:var(--shadow);\n}\n.playbtn:hover{background:var(--yellow-deep)}\n.playbtn svg{width:14px;height:14px;fill:var(--ink)}\n.voicesel{\n  appearance:none;font-family:var(--font-ui);font-size:14px;font-weight:600;color:var(--ink);\n  background:var(--cream-2);border:var(--line-thin);border-radius:12px;padding:9px 34px 9px 14px;\n  background-image:url(\"data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%231C1508' stroke-width='2.4' stroke-linecap='round'><path d='M6 9l6 6 6-6'/><\/svg>\");\n  background-repeat:no-repeat;background-position:right 11px center;background-size:15px;\n}\n.chip{\n  display:inline-flex;align-items:center;gap:7px;flex:none;\n  border:var(--line-thin);border-radius:11px;background:var(--cream-2);\n  padding:9px 13px;font-size:11.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;\n  font-variant-numeric:tabular-nums;\n}\n.chip svg{width:13px;height:13px;fill:none;stroke:var(--ink);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}\n.chip.counter{background:var(--yellow-soft)}\n.endbtn{\n  flex:none;border:var(--line-thin);border-radius:11px;background:var(--red-soft);color:var(--red);\n  padding:9px 18px;font-size:14px;font-weight:700;\n}\n.endbtn:hover{background:#F6CFCB}\n\n/* ---------------- part rail (read-only: the test runs in order) ---------------- */\n.rail{flex:none;display:flex;gap:10px;flex-wrap:wrap;align-items:stretch}\n.part{\n  flex:1;min-width:190px;border:var(--line-thin);border-radius:var(--r-md);\n  background:rgba(255,253,246,.5);padding:9px 12px;display:flex;flex-direction:column;gap:5px;\n}\n.part.now{background:var(--cream);border:var(--line);box-shadow:var(--shadow)}\n.part.locked{opacity:.62}\n.part .pt{display:flex;align-items:center;gap:8px}\n.part .pn{font-s
