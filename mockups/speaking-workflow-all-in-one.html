eight:1.5}\n.railtip{\n  font-size:11px;color:var(--ink-2);line-height:1.5;background:var(--surface-2);\n  border:1px dashed var(--border-strong);border-radius:7px;padding:8px 10px;margin-top:12px;\n}\n.railtip b{color:var(--ink);font-weight:700}\n.critcount{\n  font-size:9.5px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;\n  padding:2px 6px;border-radius:5px;background:var(--surface-2);border:1px solid var(--border-strong);color:var(--ink-3);\n}\n.critcount.has{background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent-deep)}\n\n#toast{\n  position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(8px);\n  background:var(--ink);color:#fff;padding:9px 16px;border-radius:8px;font-size:12.5px;font-weight:600;\n  opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;z-index:50;\n}\n#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}\n@media (prefers-reduced-motion:reduce){*{transition:none!important}}\n<\/style>\n\n<div class=\"app\">\n\n  <div class=\"topbar\">\n    <div class=\"avatar\">PT<\/div>\n    <div class=\"who\">\n      <span class=\"name\">Phạm Anh Thư<\/span>\n      <span class=\"meta\">anhthupham.demo@gmail.com · IEC K29 · Foundation<\/span>\n    <\/div>\n    <div class=\"spacer\"><\/div>\n    <div class=\"badges\">\n      <span class=\"badge neutral\">Needs grading<\/span>\n      <span class=\"badge priority\">Medium<\/span>\n      <span class=\"badge attempt\">Attempt 1<\/span>\n      <span class=\"badge neutral\">Reviewer: Ms. Hạnh<\/span>\n    <\/div>\n    <button class=\"tbtn\">Flag<\/button>\n    <button class=\"tbtn\">Skip<\/button>\n    <button class=\"tbtn danger\">Close<\/button>\n  <\/div>\n\n  <div class=\"overallbar\">\n    <span class=\"eyebrow\">Test overall<\/span>\n    <div class=\"ovparts\" id=\"rollRows\"><\/div>\n    <div class=\"ovtotal\">\n      <span class=\"lbl\">Overall band<\/span>\n      <span class=\"val\" id=\"rollTotal\">—<\/span>\n    <\/div>\n  <\/div>\n\n  <div class=\"parts\" id=\"parts\"><\/div>\n\n  <div class=\"layout\">\n    <div class=\"col\">\n      <div class=\"panel\">\n        <div class=\"headcard\">\n          <div>\n            <span class=\"eyebrow\" id=\"partEyebrow\"><\/span>\n            <h1 id=\"partTitle\"><\/h1>\n          <\/div>\n          <div class=\"headscore\">\n            <div class=\"num\" id=\"headScore\">—<\/div>\n            <div class=\"lbl\">Band · this part<\/div>\n          <\/div>\n        <\/div>\n        <div class=\"metarow\" id=\"metarow\"><\/div>\n        <div class=\"answerbar\">\n          <button class=\"playall\" id=\"playAll\"><svg viewBox=\"0 0 24 24\"><path d=\"M8 5v14l11-7z\"/><\/svg> Play all answers<\/button>\n          <span class=\"lbl\" id=\"answerCount\"><\/span>\n          <div class=\"spacer\"><\/div>\n          <div class=\"speedgroup\" id=\"speeds\">\n            <button class=\"active\" data-rate=\"1\">1×<\/button>\n            <button data-rate=\"1.25\">1.25×<\/button>\n            <button data-rate=\"1.5\">1.5×<\/button>\n          <\/div>\n        <\/div>\n        <div class=\"qlist\" id=\"qlist\"><\/div>\n      <\/div>\n    <\/div>\n\n    <div class=\"panel railpanel\">\n      <div class=\"railhead\">\n        <h2>Marked error details<\/h2>\n        <button class=\"railclose\" aria-label=\"Close\">✕<\/button>\n      <\/div>\n      <p class=\"railhint\" id=\"railHint\"><\/p>\n      <div id=\"railFilter\"><\/div>\n      <div id=\"rail\"><\/div>\n    <\/div>\n\n    <div class=\"panel gradepanel\">\n      <div class=\"gradehead\">\n        <span class=\"eyebrow\">Grading<\/span>\n        <span class=\"meta\">AI band <b id=\"aiBandLbl\">—<\/b> · Saved <b id=\"savedLbl\">draft<\/b><\/span>\n      <\/div>\n\n      <div class=\"scopenote\" id=\"scopeNote\"><\/div>\n\n      <div class=\"scorerow\">\n        <div>\n          <label for=\"finalScore\">Band for this part<\/label>\n          <input class=\"scoreinput mono\" id=\"finalScore\" inputmode=\"decimal\">\n        <\/div>\n        <div class=\"spacer\"><\/div>\n        <button class=\"ghostbtn\" id=\"regradeBtn\">↻ Regrade with AI<\/button>\n      <\/div>\n\n      <div>\n        <div class=\"tabs\">\n          <button class=\"active\" data-tab=\"overview\">Overview<\/button>\n          <button data-tab=\"improved\">Improved answers (AI)<\/button>\n        <\/div>\n        <div class=\"tabpanel\" data-panel=\"overview\">\n          <textarea id=\"overviewText\"><\/textarea>\n        <\/div>\n        <div class=\"tabpanel\" data-panel=\"improved\" hidden>\n          <div id=\"improvedList\"><\/div>\n        <\/div>\n      <\/div>\n\n      <div class=\"actionrow\">\n        <button class=\"btn-primary\" id=\"sendBtn\">Send to student<\/button>\n        <button class=\"btn-secondary\">Save draft<\/button>\n      <\/div>\n\n      <div class=\"critheader\">\n        <h2>Teacher criterion analysis<\/h2>\n        <p id=\"critSub\"><\/p>\n      <\/div>\n      <div id=\"critList\" style=\"display:flex;flex-direction:column;gap:12px\"><\/div>\n\n    <\/div>\n\n  <\/div>\n<\/div>\n\n<div id=\"markpop\" hidden role=\"dialog\" aria-label=\"Mark this as an error\">\n  <div class=\"pophead\">\n    <span class=\"popq\" id=\"popQuote\"><\/span>\n    <button class=\"popx\" id=\"popClose\" aria-label=\"Cancel\">✕<\/button>\n  <\/div>\n  <div class=\"poplab\">Mark against<\/div>\n  <div class=\"popgrid\" id=\"popGrid\"><\/div>\n<\/div>\n\n<div id=\"toast\" role=\"status\" aria-live=\"polite\"><\/div>\n\n<script>\n(function(){\n\"use strict\";\n\n/* ============================ demo content ============================ */\nvar PARTS = [\n  {\n    id:'p1', name:'Part 1', topic:'Hometown & work', kind:'4 questions',\n    ai:{fluency:6.0,pron:5.5,lexical:6.0,grammar:5.5},\n    bands:{fluency:6.0,pron:6.0,lexical:6.0,grammar:5.5},\n    overview:'Answers are relevant and come quickly, but most are two sentences long — she should extend each one with a reason or example. Four of the five flagged errors are the same habit: singular nouns after numbers and quantifiers.',\n    questions:[\n      { n:1, dur:34, q:'Where is your hometown?',\n        text:[ 'My hometown is Hải Phòng, it is a port city in the north of Vietnam, about ',\n               {e:'e1',t:'two hour'}, ' from Hanoi by car. It is quite big but ',\n               {e:'e2',t:'not so crowded like'}, ' Hanoi.' ],\n        improved:'My hometown is Hải Phòng, a port city in the north of Vietnam, about two hours from Hanoi by car. It is quite big, but not as crowded as Hanoi.',\n        errors:[\n          {id:'e1',cat:'Grammar',t:11,quote:'two hour',fix:'two hours'},\n          {id:'e2',cat:'Grammar',t:22,quote:'not so crowded like',fix:'not as crowded as'}\n        ]},\n      { n:2, dur:41, q:'What do you like most about it?',\n        text:[ 'What I like most is the food, especially the seafood. There are ',\n               {e:'e3',t:'many small restaurant'}, ' near the sea and the price is very reasonable. Also the people there are very friendly, they always help you if you are lost.' ],\n        improved:'What I like most is the food, especially the seafood. There are many small restaurants near the sea and the prices are very reasonable. The people are friendly too — they will always help you if you get lost.',\n        errors:[{id:'e3',cat:'Grammar',t:14,quote:'many small restaurant',fix:'many small restaurants'}]},\n      { n:3, dur:29, q:'Do you work, or are you a student?',\n        text:[ 'I am working now, I am a marketing assistant for ',\n               {e:'e4',t:'a company make cosmetics'}, '. I have been doing this job for about one year and a half.' ],\n        improved:'I am working at the moment — I am a marketing assistant for a company that makes cosmetics. I have been doing this job for about a year and a half.',\n        errors:[{id:'e4',cat:'Grammar',t:12,quote:'a company make cosmetics',fix:'a company that makes cosmetics'}]},\n      { n:4, dur:38, q:'Would you like to live there in the future?',\n        text:[ 'Maybe in the future, yes. Right now I want to stay in Hanoi because ',\n               {e:'e5',t:'there have more opportunity'}, ' for young people, but when I am older I think I will come back to be near my parents.' ],\n        improved:'Maybe in the future, yes. Right now I want to stay in Hanoi because there are more opportunities for young people, but when I am older I think I will come back to be closer to my parents.',\n        errors:[{id:'e5',cat:'Grammar',t:13,quote:'there have more opportunity',fix:'there are more opportunities'}]}\n    ]\n  },\n  {\n    id:'p2', name:'Part 2', topic:'A skill you want to learn', kind:'Long turn',\n    ai:{fluency:6.5,pron:6.0,lexical:6.5,grammar:6.0},\n    bands:{fluency:7.0,pron:6.0,lexical:6.5,grammar:6.5},\n    overview:'Good range of ideas and the answer fills the full two minutes without drying up. Fluency dips slightly when reaching for less familiar vocabulary — the three flagged points are all worth a quick correction drill.',\n    questions:[\n      { n:1, dur:112, q:'Describe a skill you would like to learn. You should say: what the skill is, how you would learn it, how long it would take, and explain why you want to learn this skill.',\n        text:[ 'I would like to talk about playing the guitar, because it is a skill I have wanted for a long time but I never had enough time to learn it properly. I think I would learn it by watching video on YouTube first, and maybe later I ',\n               {e:'e1',t:'will join'}, ' a small class near my house, because practicing with a teacher is more effective than practicing alone. I think it would take about one year to play some simple song, but to play really well, it will take much longer, maybe ',\n               {e:'e2',t:'three or four year'}, '. The reason I want to learn it is because ',\n               {e:'e3',t:'music make me relax'}, ' after a stressful day at work, and I also think it would be a good skill to have at parties with my friends.' ],\n        improved:\"I'd like to talk about playing the guitar. It's a skill I've wanted to pick up for a long time, but I've never had enough time to learn it properly. I think I'd start by watching videos on YouTube, and later join a small class near my house, since practising with a teacher is more effective than practising alone. It would probably take about a year to play some simple songs, but to play really well would take much longer — maybe three or four years. The reason I want to learn it is that music helps me relax after a stressful day at work, and I think it would be a good skill to have at parties with friends.\",\n        errors:[\n          {id:'e1',cat:'Lexical',t:34,quote:'will join',fix:'would join / joining'},\n          {id:'e2',cat:'Grammar',t:71,quote:'three or four year',fix:'three or four years'},\n          {id:'e3',cat:'Grammar',t:88,quote:'music make me relax',fix:'music helps me relax'}\n        ]}\n    ]\n  },\n  {\n    id:'p3', name:'Part 3', topic:'Learning & technology', kind:'3 questions',\n    ai:{fluency:6.0,pron:6.0,lexical:6.5,grammar:6.0},\n    bands:{fluency:null,pron:null,lexical:null,grammar:null},\n    overview:'',\n    questions:[\n      { n:1, dur:52, q:'Do you think people learn new skills differently now compared to the past?',\n        text:[ 'Definitely, it is very different now. In the past ', {e:'e1',t:'you must go'},\n               ' to a class or find a teacher, but now you can learn almost everything on the internet. My father learned to repair his motorbike just from watching videos. But I think the problem is people give up ',\n               {e:'e2',t:'more easy'}, ' now, because nobody is checking on them.' ],\n        improved:'Definitely, it is very different now. In the past you had to go to a class or find a teacher, but now you can learn almost anything on the internet. My father learned to repair his motorbike just from watching videos. The problem, though, is that people give up more easily now, because nobody is checking on them.',\n        errors:[\n          {id:'e1',cat:'Grammar',t:9,quote:'you must go',fix:'you had to go'},\n          {id:'e2',cat:'Lexical',t:38,quote:'more easy',fix:'more easily'}\n        ]},\n      { n:2, dur:47, q:\"What kinds of skills should schools teach that they don't teach now?\",\n        text:[ 'I think schools should teach more ', {e:'e3',t:'practical thing'},\n               ' like managing money, or how to speak in front of people. When I left school I did not know anything about tax or saving, and I had to learn it myself which was quite stressful.' ],\n        improved:'I think schools should teach more practical things, like managing money or speaking in front of an audience. When I left school I did not know anything about tax or saving, so I had to learn it on my own, which was quite stressful.',\n        errors:[{id:'e3',cat:'Grammar',t:11,quote:'practical thing',fix:'practical things'}]},\n      { n:3, dur:44, q:'Is it ever too late for someone to learn a new skill?',\n        text:[ 'No, I do not think so. My mother started to learn English when she was fifty, and now she can talk with foreign customers ',\n               {e:'e4',t:'quite confident'}, '. Maybe it takes more time when you are older, but it is never impossible.' ],\n        improved:'No, I do not think so. My mother started learning English when she was fifty, and now she can talk to foreign customers quite confidently. It may take more time when you are older, but it is never impossible.',\n        errors:[{id:'e4',cat:'Lexical',t:26,quote:'quite confident',fix:'quite confidently'}]}\n    ]\n  }\n];\n\nvar CRIT = [\n  {key:'fluency', cls:'fluency', name:'Fluency & Coherence'},\n  {key:'pron',    cls:'pron',    name:'Pronunciation'},\n  {key:'lexical', cls:'lexical', name:'Lexical Resource'},\n  {key:'grammar', cls:'grammar', name:'Grammatical Range & Accuracy'}\n];\n\n/* ============================ normalise transcripts ============================\n   The transcript literals above are written as segments so the AI's flagged spans are easy\n   to read. The screen needs character offsets instead, so a teacher can highlight any run\n   of text. Flatten each transcript to a plain string once, and record where each span sits. */\nvar CATKEY = { Grammar:'grammar', Lexical:'lexical', Fluency:'fluency', Pronunciation:'pron' };\nvar seq = 0;\n\nPARTS.forEach(function(p){\n  p.questions.forEach(function(q){\n    var plain = '', at = {};\n    q.text.forEach(function(seg){\n      if (typeof seg === 'string'){ plain += seg; return; }\n      at[seg.e] = { start:plain.length, end:plain.length + seg.t.length };\n      plain += seg.t;\n    });\n    q.plain = plain;\n    q.errors.forEach(function(er){\n      var r = at[er.id] || { start:0, end:0 };\n      er.start = r.start;\n      er.end = r.end;\n      er.cat = CATKEY[er.cat] || er.cat;\n      er.source = 'ai';\n      er.comment = er.comment || '';\n      er.id = 'e' + (++seq);\n    });\n  });\n});\n\n/* ============================ preset (workflow explorer) ============================\n   The workflow page opens this screen at a given moment by setting window.__AT, or #at=... in\n   the URL. 'scratch' = the teacher chose to grade without Ed's draft: no AI bands, flags or\n   rewrites. 'sent' = the teacher has pressed Send to student. */\nvar AT = window.__AT || (location.hash.match(/at=([\\w-]+)/) || [])[1] || '';\nvar SCRATCH = AT === 'scratch';\nif (SCRATCH){\n  PARTS.forEach(function(p){\n    p.bands = { fluency:null, pron:null, lexical:null, grammar:null };\n    p.overview = '';\n    p.questions.forEach(function(q){ q.errors = []; q.improved = ''; });\n  });\n}\n\n/* ============================ state ============================ */\nvar state = { part:0, focus:null, selectedQ:null, playingKey:null, pos:{}, timer:null, chain:false, pending:null };\n\nfunction part(){ return PARTS[state.part]; }\nfunction qkey(pi,qi){ return PARTS[pi].id + '-q' + qi; }\nfunction fmt(s){ s = Math.max(0, Math.round(s||0)); return Math.floor(s/60) + ':' + String(s%60).padStart(2,'0'); }\nfunction wordsOf(q){ return q.plain.trim().split(/\\s+/).filter(Boolean).length; }\nfunction round5(v){ return Math.round(v*2)/2; }\nfunction bandOf(p){\n  var vals = CRIT.map(function(c){ return p.bands[c.key]; }).filter(function(v){ return v !== null && v !== undefined; });\n  if (vals.length < CRIT.length) return null;\n  return round5(vals.reduce(function(a,b){ return a+b; },0)/vals.length);\n}\nfunction aiBandOf(p){\n  var vals = CRIT.map(function(c){ return p.ai[c.key]; });\n  return round5(vals.reduce(function(a,b){ return a+b; },0)/vals.length);\n}\n\n/* ============================ rendering ============================ */\nfunction renderParts(){\n  document.getElementById('parts').innerHTML = PARTS.map(function(p,i){\n    var b = bandOf(p), total = p.questions.reduce(function(n,q){ return n+q.dur; },0);\n    return '<button class=\"parttab\" aria-current=\"'+(i===state.part)+'\" data-part=\"'+i+'\">'\n      + '<span class=\"pt-top\"><span class=\"dotstate '+(b!==null?'done':'')+'\"><\/span>'\n      + '<span class=\"pt-name\">'+p.name+' · '+p.topic+'<\/span>'\n      + '<span class=\"pt-band '+(b===null?'unset':'')+'\">'+(b===null?'Not graded':b.toFixed(1))+'<\/span><\/span>'\n      + '<span class=\"pt-meta\">'+p.kind+' · '+fmt(total)+' of audio · '+countErrors(p)+' flagged<\/span>'\n      + '<\/button>';\n  }).join('');\n  document.querySelectorAll('.parttab').forEach(function(b){\n    b.addEventListener('click', function(){\n      stopAudio(); state.part = +b.dataset.part; state.focus = null; state.selectedQ = null; renderAll();\n    });\n  });\n}\nfunction countErrors(p){\n  return p.questions.reduce(function(n,q){ return n + q.errors.length; },0);\n}\nfunction markedAgainst(p, cls){\n  return p.questions.reduce(function(n,q){\n    return n + q.errors.filter(function(er){ return er.cat === cls; }).length;\n  },0);\n}\n\nfunction renderHead(){\n  var p = part(), total = p.questions.reduce(function(n,q){ return n+q.dur; },0);\n  var words = p.questions.reduce(function(n,q){ return n+wordsOf(q); },0);\n  var b = bandOf(p);\n  document.getElementById('partEyebrow').textContent = 'Speaking attempt · ' + p.name;\n  document.getElementById('partTitle').textContent = '[IEC] Foundation Speaking — Test 3, ' + p.name + ' (' + p.topic + ')';\n  var hs = document.getElementById('headScore');\n  hs.textContent = b === null ? '—' : b.toFixed(1);\n  hs.className = 'num' + (b === null ? ' unset' : '');\n  document.getElementById('metarow').innerHTML =\n      meta('Answers', p.questions.length)\n    + meta('Total audio', fmt(total))\n    + meta('Words', words)\n    + meta('Pace', Math.round(words/total*60) + ' wpm')\n    + meta('Submitted', '14:22 · 21/09/2026');\n  document.getElementById('answerCount').textContent =\n    p.questions.length === 1 ? 'One long turn' : p.questions.length + ' answers in this part';\n}\nfunction meta(label, value){\n  return '<div><span>'+label+'<\/span><b>'+value+'<\/b><\/div>';\n}\n\nfunction renderQuestions(){\n  var p = part();\n  document.getElementById('qlist').innerHTML = p.questions.map(function(q,qi){\n    var key = qkey(state.part, qi), pos = state.pos[key] || 0;\n    var sel = state.selectedQ === qi;\n    return '<div class=\"qcard'+(sel?' selected':'')+(state.playingKey===key?' active':'')+'\"'\n      + ' data-q=\"'+qi+'\" id=\"qcard-'+qi+'\" role=\"button\" tabindex=\"0\"'\n      + ' aria-pressed=\"'+sel+'\"'\n      + ' title=\"'+(sel?'Click again to show every answer\\'s errors':'Click to show only this answer\\'s errors')+'\">'\n      + '<div class=\"qhead\">'\n        + (p.questions.length > 1 ? '<span class=\"qnum\">Q'+q.n+'<\/span>' : '<span class=\"qnum\">Long turn<\/span>')\n        + '<span class=\"qtext\">'+q.q+'<\/span>'\n        + (sel ? '<span class=\"selflag\">Showing<\/span>' : '')\n        + '<span class=\"qmeta\">'+fmt(q.dur)+' · '+wordsOf(q)+' words · '+Math.round(wordsOf(q)/q.dur*60)+' wpm<\/span>'\n      + '<\/div>'\n      + '<div class=\"qplayer\">'\n        + '<button class=\"playbtn\" data-play=\"'+qi+'\" aria-label=\"Play answer '+q.n+'\">'\n          + '<svg viewBox=\"0 0 24 24\">'+(state.playingKey===key?'<path d=\"M6 5h4v14H6zM14 5h4v14h-4z\"/>':'<path d=\"M8 5v14l11-7z\"/>')+'<\/svg>'\n        + '<\/button>'\n        + '<svg class=\"wave\" data-wave=\"'+qi+'\" viewBox=\"0 0 600 32\" preserveAspectRatio=\"none\">'+waveSvg(qi,q,pos)+'<\/svg>'\n        + '<span class=\"time mono\" data-time=\"'+qi+'\">'+fmt(pos)+' / '+fmt(q.dur)+'<\/span>'\n      + '<\/div>'\n      + '<div class=\"transcript\">'+transcriptHtml(q)+'<\/div>'\n    + '<\/div>';\n  }).join('');\n\n  document.querySelectorAll('.qcard').forEach(function(card){\n    card.addEventListener('click', function(ev){\n      if (ev.target.closest('.playbtn, .wave, mark, sup')) return;\n      var sel = window.getSelection();\n      if (sel && !sel.isCollapsed) return;        /* they were highlighting text, not picking a card */\n      selectQuestion(+card.dataset.q);\n    });\n    card.addEventListener('keydown', function(ev){\n      if (ev.key === 'Enter' || ev.key === ' '){ ev.preventDefault(); selectQuestion(+card.dataset.q); }\n    });\n  });\n  document.querySelectorAll('[data-play]').forEach(function(b){\n    b.addEventListener('click', function(){ togglePlay(+b.dataset.play); });\n  });\n  document.querySelectorAll('[data-wave]').forEach(function(w){\n    w.addEventListener('click', function(e){\n      var qi = +w.dataset.wave, q = part().questions[qi], r = w.getBoundingClientRect();\n      seek(qi, (e.clientX - r.left) / r.width * q.dur);\n    });\n  });\n  document.querySelectorAll('.transcript mark, .transcript sup').forEach(function(el){\n    el.addEventListener('click', function(ev){ ev.stopPropagation(); focusError(el.dataset.q, el.dataset.e, true); });\n  });\n}\n\nfunction waveSvg(qi, q, pos){\n  var bars = 70, w = 600, h = 32, out = '', seed = (qi+1)*7.3;\n  for (var i=0;i<bars;i++){\n    var amp = Math.abs(Math.sin(i*0.41 + seed))*9 + Math.abs(Math.cos(i*0.17 + seed))*5 + 2;\n    out += '<rect x=\"'+((i/bars)*w+1).toFixed(1)+'\" y=\"'+((h-amp)/2).toFixed(1)+'\" width=\"'+(w/bars-1.3).toFixed(1)+'\" height=\"'+amp.toFixed(1)+'\" rx=\"1.1\" fill=\"#CBD2DC\"><\/rect>';\n  }\n  q.errors.forEach(function(er){\n    out += '<circle cx=\"'+((er.t/q.dur)*w).toFixed(1)+'\" cy=\"3.5\" r=\"3.2\" fill=\"'+(er.cat==='Lexical'?'#FFF8EB':'#FDF0F0')+'\" stroke=\"'+(er.cat==='Lexical'?'#B45309':'#B91C1C')+'\" stroke-width=\"1.5\"><\/circle>';\n  });\n  var x = (pos/q.dur)*w;\n  out += '<rect x=\"0\" y=\"0\" width=\"'+x.toFixed(1)+'\" height=\"'+h+'\" fill=\"#EA580C\" opacity=\".13\"><\/rect>';\n  out += '<line x1=\"'+x.toFixed(1)+'\" y1=\"0\" x2=\"'+x.toFixed(1)+'\" y2=\"'+h+'\" stroke=\"#EA580C\" stroke-width=\"1.8\"><\/line>';\n  return out;\n}\n\n/* Build the transcript from plain text plus the marked ranges, so any run of characters\n   can carry a mark — the AI's own spans and anything a teacher highlights. */\nfunction transcriptHtml(q){\n  var qi = part().questions.indexOf(q);\n  var marks = sortedErrors(q);\n  var out = '', at = 0;\n  marks.forEach(function(er, i){\n    if (er.start < at) return;                       /* overlapping, already covered */\n    out += escapeHtml(q.plain.slice(at, er.start));\n    var focus = (state.focus && state.focus.q === qi && state.focus.e === er.id) ? ' focus' : '';\n    var teacher = er.source === 'teacher' ? ' teacher' : '';\n    out += '<mark class=\"' + er.cat + focus + teacher + '\" data-q=\"' + qi + '\" data-e=\"' + er.id + '\">'\n         + escapeHtml(q.plain.slice(er.start, er.end))\n         + '<sup class=\"' + er.cat + '\" data-q=\"' + qi + '\" data-e=\"' + er.id + '\">' + (i + 1) + '<\/sup><\/mark>';\n    at = er.end;\n  });\n  out += escapeHtml(q.plain.slice(at));\n  return out;\n}\n\nfunction sortedErrors(q){\n  return q.errors.slice().sort(function(a,b){ return a.start - b.start; });\n}\nfunction escapeHtml(s){ return String(s).replace(/&/g,'&amp;').replace(/<\/g,'&lt;').replace(/>/g,'&gt;'); }\n\nfunction renderGrading(){\n  var p = part(), b = bandOf(p);\n  document.getElementById('aiBandLbl').textContent = SCRATCH ? 'off' : aiBandOf(p).toFixed(1);\n  document.getElementById('finalScore').value = b === null ? '' : b.toFixed(1);\n  document.getElementById('finalScore').placeholder = '—';\n  document.getElementById('overviewText').value = p.overview;\n  document.getElementById('overviewText').placeholder = 'Overall comment the student will read for this part…';\n  document.getElementById('scopeNote').innerHTML = p.questions.length === 1\n    ? 'One set of bands covers this long turn. Mistakes are flagged per answer; the band is given for the part.'\n    : 'One set of bands covers <b>all ' + p.questions.length + ' answers<\/b> in ' + p.name + '. Mistakes are flagged per answer; the band is given for the part.';\n  document.getElementById('critSub').textContent =\n    'Scores apply to ' + p.name + ' as a whole. Comments appear in the same view the student sees.';\n\n  document.getElementById('critList').innerHTML = CRIT.map(function(c){\n    var v = p.bands[c.key], ai = p.ai[c.key];\n    var edited = v !== null && v !== ai;\n    var marked = markedAgainst(p, c.cls);\n    return '<div class=\"critcard '+c.cls+'\">'\n      + '<div class=\"critrow\"><div><div class=\"critname\">'+c.name\n      + ' <span class=\"critcount'+(marked ? ' has' : '')+'\">'+marked+' marked<\/span><\/div>'\n      + '<div class=\"critsub\">'+(SCRATCH ? 'Grading from scratch' : edited ? 'AI suggested '+ai.toFixed(1)+' · changed' : 'AI suggested '+ai.toFixed(1))+'<\/div><\/div>'\n      + '<div class=\"critscore\"><input class=\"mono\" data-crit=\"'+c.key+'\" value=\"'+(v===null?'':v.toFixed(1))+'\" placeholder=\"—\" inputmode=\"decimal\"><span class=\"editlbl\">Teacher<\/span><\/div><\/div>'\n      + '<textarea placeholder=\"Comment for this criterion (optional)\"><\/textarea><\/div>';\n  }).join('');\n  document.querySelectorAll('[data-crit]').forEach(function(inp){\n    inp.addEventListener('input', function(){\n      var val = parseFloat(inp.value);\n      part().bands[inp.dataset.crit] = isNaN(val) ? null : Math.max(1, Math.min(9, val));\n      renderParts(); renderHead(); renderRollup();\n      var b2 = bandOf(part());\n      document.getElementById('finalScore').value = b2 === null ? '' : b2.toFixed(1);\n    });\n  });\n\n  document.getElementById('improvedList').innerHTML = p.questions.map(function(q,qi){\n    return '<div class=\"impblock\">'\n      + '<div class=\"impq\">'+(p.questions.length>1?'<span class=\"qnum\">Q'+q.n+'<\/span>':'<span class=\"qnum\">Long turn<\/span>')\n      + '<span>'+escapeHtml(q.q.slice(0,58))+(q.q.length>58?'…':'')+'<\/span><\/div>'\n      + '<textarea>'+escapeHtml(q.improved)+'<\/textarea><\/div>';\n  }).join('');\n}\n\nfunction renderRollup(){\n  document.getElementById('rollRows').innerHTML = PARTS.map(function(p){\n    var b = bandOf(p);\n    return '<div class=\"ovpart'+(b!==null?' graded':'')+'\">'\n      + '<span class=\"dotstate '+(b!==null?'done':'')+'\"><\/span>'\n      + '<span class=\"nm\">'+p.name+'<\/span>'\n      + '<span class=\"bd '+(b===null?'unset':'')+'\">'+(b===null?'not graded':b.toFixed(1))+'<\/span><\/div>';\n  }).join('');\n  var done = PARTS.map(bandOf).filter(function(v){ return v !== null; });\n  document.getElementById('rollTotal').textContent = done.length === PARTS.length\n    ? round5(done.reduce(function(a,b){ return a+b; },0)/done.length).toFixed(1)\n    : '—';\n}\n\nfunction renderRail(){\n  var p = part(), total = countErrors(p), sel = state.selectedQ;\n  document.getElementById('railHint').innerHTML = total === 0\n    ? 'Nothing marked yet. Highlight any words in a transcript to mark your first error.'\n    : 'Highlight words in a transcript to add an error. Select a card to jump to that moment in the audio.';\n\n  var fb = document.getElementById('railFilter');\n  if (sel === null || p.questions.length === 1){\n    fb.innerHTML = '';\n  } else {\n    var sq = p.questions[sel], n = sq.errors.length;\n    fb.innerHTML = '<div class=\"railfilter\"><span>Q'+sq.n+' only · '\n      + (n === 0 ? 'no errors flagged' : n + ' error' + (n>1?'s':'')) + '<\/span>'\n      + '<button type=\"button\" id=\"showAllErrors\">Show all ' + total + '<\/button><\/div>';\n    document.getElementById('showAllErrors').addEventListener('click', function(){\n      state.selectedQ = null; state.focus = null; renderQuestions(); renderRail();\n    });\n  }\n\n  document.getElementById('rail').innerHTML = p.questions.map(function(q,qi){\n    if (sel !== null && qi !== sel) return '';\n    if (!q.errors.length) return '';\n    return '<div class=\"railgroup\">'\n      + '<div class=\"railgrouphead\">'+(p.questions.length>1?'<span class=\"qnum\">Q'+q.n+'<\/span>':'<span class=\"qnum\">Long turn<\/span>')\n      + '<span class=\"rgq\">'+escapeHtml(q.q.slice(0,34))+(q.q.length>34?'…':'')+'<\/span><\/div>'\n      + '<div class=\"evlist\">' + sortedErrors(q).map(function(er){\n          var focus = (state.focus && state.focus.q === qi && state.focus.e === er.id) ? ' focus' : '';\n          return '<div class=\"evcard'+focus+'\" data-q=\"'+qi+'\" data-e=\"'+er.id+'\">'\n            + '<div class=\"evtop\"><span class=\"evtag '+er.cat+'\">'+critShort(er.cat)+'<\/span>'\n            + '<span class=\"evsrc '+er.source+'\">'+(er.source === 'ai' ? 'AI' : 'You')+'<\/span>'\n            + '<span class=\"evtime mono\">'+fmt(er.t)+'<\/span><\/div>'\n            + '<div class=\"evquote\">“'+escapeHtml(er.quote)+'”<\/div>'\n            + '<div class=\"evfix\"><b>Say it as<\/b>'\n              + '<input data-fix=\"'+er.id+'\" data-fq=\"'+qi+'\" value=\"'+escapeHtml(er.fix)+'\" '\n              + 'placeholder=\"The correct version\"><\/div>'\n            + '<div class=\"evnote\"><b>Your comment<\/b>'\n              + '<textarea data-note=\"'+er.id+'\" data-nq=\"'+qi+'\" class=\"'+(er.comment ? 'filled' : '')+'\" '\n              + 'placeholder=\"What should the student do about this?\">'+escapeHtml(er.comment)+'<\/textarea><\/div>'\n            + '<div class=\"evfoot\"><button class=\"dropbtn\" data-drop=\"'+er.id+'\" data-dq=\"'+qi+'\">Remove<\/button><\/div>'\n            + '<\/div>';\n        }).join('') + '<\/div><\/div>';\n  }).join('') || '<p class=\"railempty\">' + (sel !== null && p.questions.length > 1\n      ? 'Nothing marked in Q' + p.questions[sel].n + ' yet. Highlight words in that answer to add one.'\n      : 'Nothing marked in this part yet.') + '<\/p>';\n\n  var tip = total === 0 ? '' :\n    '<p class=\"railtip\"><b>To add an error:<\/b> highlight a word or sentence in any transcript, '\n    + 'then choose which of the four criteria it belongs to.<\/p>';\n  document.getElementById('rail').insertAdjacentHTML('beforeend', tip);\n\n  document.querySelectorAll('.evcard').forEach(function(card){\n    card.addEventListener('click', function(ev){\n      if (ev.target.closest('input, textarea, button')) return;\n      focusError(card.dataset.q, card.dataset.e, false);\n    });\n  });\n  document.querySelectorAll('[data-fix]').forEach(function(inp){\n    inp.addEventListener('input', function(){\n      findError(+inp.dataset.fq, inp.dataset.fix).fix = inp.value;\n    });\n  });\n  document.querySelectorAll('[data-note]').forEach(function(ta){\n    ta.addEventListener('input', function(){\n      findError(+ta.dataset.nq, ta.dataset.note).comment = ta.value;\n      ta.classList.toggle('filled', ta.value.trim() !== '');\n    });\n  });\n  document.querySelectorAll('[data-drop]').forEach(function(b){\n    b.addEventListener('click', function(ev){\n      ev.stopPropagation();\n      dropError(+b.dataset.dq, b.dataset.drop);\n    });\n  });\n}\n\nfunction findError(qi, eid){\n  return part().questions[qi].errors.filter(function(er){ return er.id === eid; })[0] || {};\n}\nfunction critShort(cls){\n  return ({ fluency:'Fluency', pron:'Pronunciation', lexical:'Lexical', grammar:'Grammar' })[cls] || cls;\n}\n\n/* ============================ marking an error by hand ============================ */\n\n/* Character offset of a (node, offset) pair within a transcript element. */\nfunction offsetIn(root, node, nodeOffset){\n  var walk = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null);\n  var total = 0, t;\n  while ((t = walk.nextNode())){\n    if (t === node) return total + nodeOffset;\n    total += t.nodeValue.length;\n  }\n  return -1;\n}\n\nfunction readSelection(){\n  var sel = window.getSelection();\n  if (!sel || sel.isCollapsed || sel.rangeCount === 0) return null;\n  var range = sel.getRangeAt(0);\n  var box = range.commonAncestorContainer;\n  if (box.nodeType === 3) box = box.parentNode;\n  var tr = box.closest ? box.closest('.transcript') : null;\n  if (!tr) return null;                                   /* selection is outside a transcript */\n\n  var card = tr.closest('.qcard');\n  var qi = +card.dataset.q;\n  var a = offsetIn(tr, range.startContainer, range.startOffset);\n  var b = offsetIn(tr, range.endContainer, range.endOffset);\n  if (a < 0 || b < 0 || a === b) return null;\n\n  var start = Math.min(a,b), end = Math.max(a,b);\n  var q = part().questions[qi];\n\n  /* trim whitespace the browser likes to include at the edges of a double-click */\n  while (start < end && /\\s/.test(q.plain[start])) start++;\n  while (end > start && /\\s/.test(q.plain[end - 1])) end--;\n  if (end <= start) return null;\n\n  return { qi:qi, start:start, end:end, text:q.plain.slice(start,end), rect:range.getBoundingClientRect() };\n}\n\nfunction overlapsExisting(q, start, end){\n  return q.errors.some(function(er){ return start < er.end && end > er.start; });\n}\n\nfunction openMarkPopover(){\n  var s = readSelection();\n  if (!s) return;\n  var q = part().questions[s.qi];\n\n  if (overlapsExisting(q, s.start, s.end)){\n    toast('That text is already marked — open its card to edit it');\n    window.getSelection().removeAllRanges();\n    return;\n  }\n\n  state.pending = s;\n  var pop = document.getElementById('markpop');\n  document.getElementById('popQuote').textContent = '“' + s.text + '”';\n  document.getElementById('popGrid').innerHTML = CRIT.map(function(c){\n    return '<button class=\"' + c.cls + '\" data-cat=\"' + c.cls + '\">' + c.name + '<\/button>';\n  }).join('');\n  document.querySelectorAll('#popGrid button').forEach(function(b){\n    b.addEventListener('click', function(){ markError(b.dataset.cat); });\n  });\n\n  pop.hidden = false;\n  var pr = pop.getBoundingClientRect();\n  var left = s.rect.left + window.scrollX + (s.rect.width / 2) - (pr.width / 2);\n  var top = s.rect.top + window.scrollY - pr.height - 10;\n  if (top < window.scrollY + 8) top = s.rect.bottom + window.scrollY + 10;   /* flip below */\n  left = Math.max(window.scrollX + 8, Math.min(left, window.scrollX + document.documentElement.clientWidth - pr.width - 8));\n  pop.style.left = left + 'px';\n  pop.style.top = top + 'px';\n}\n\nfunction closeMarkPopover(){\n  document.getElementById('markpop').hidden = true;\n  state.pending = null;\n}\n\nfunction markError(cat){\n  var s = state.pending;\n  if (!s) return;\n  var q = part().questions[s.qi];\n\n  var er = {\n    id:'t' + (++seq), cat:cat, source:'teacher',\n    start:s.start, end:s.end, quote:s.text, fix:'', comment:'',\n    t: Math.round(q.dur * (s.start / Math.max(1, q.plain.length)))\n  };\n  q.errors.push(er);\n\n  closeMarkPopover();\n  window.getSelection().removeAllRanges();\n\n  state.focus = { q:s.qi, e:er.id };\n  if (state.selectedQ !== null) state.selectedQ = s.qi;\n  renderQuestions();\n  renderGrading();\n  renderRail();\n\n  var card = document.querySelector('.evcard[data-q=\"' + s.qi + '\"][data-e=\"' + er.id + '\"]');\n  if (card){\n    card.scrollIntoView({ block:'nearest', behavior:'smooth' });\n    var note = card.querySelector('textarea');\n    if (note) note.focus();\n  }\n  toast('Marked against ' + critName(cat) + ' — add your comment');\n}\n\nfunction critName(cls){\n  var c = CRIT.filter(function(x){ return x.cls === cls; })[0];\n  return c ? c.name : cls;\n}\n\nfunction dropError(qi, eid){\n  var q = part().questions[qi];\n  q.errors = q.errors.filter(function(er){ return er.id !== eid; });\n  if (state.focus && state.focus.e === eid) state.focus = null;\n  renderQuestions();\n  renderGrading();\n  renderRail();\n  toast('Removed');\n}\n\nfunction selectQuestion(qi){\n  state.selectedQ = (state.selectedQ === qi) ? null : qi;\n  state.focus = null;\n  renderQuestions(); renderRail();\n  if (state.selectedQ !== null && part().questions.length > 1){\n    var q = part().questions[qi], n = q.errors.length;\n    toast('Q' + q.n + ' · ' + (n ? 'showing ' + n + ' error' + (n>1?'s':'') : 'no errors flagged'));\n  }\n}\n\nfunction focusError(qi, eid, fromTranscript){\n  qi = +qi;\n  state.focus = { q:qi, e:eid };\n  if (state.selectedQ !== null) state.selectedQ = qi;\n  var q = part().questions[qi];\n  var er = q.errors.filter(function(x){ return x.id === eid; })[0];\n  if (er) seek(qi, Math.max(0, er.t - 1.5));\n  renderQuestions(); renderRail();\n  var target = fromTranscript\n    ? document.querySelector('.evcard[data-q=\"'+qi+'\"][data-e=\"'+eid+'\"]')\n    : document.getElementById('qcard-'+qi);\n  if (target) target.scrollIntoView({ block:'nearest', behavior:'smooth' });\n}\n\n/* ============================ fake playback ============================ */\nfunction seek(qi, t){\n  var key = qkey(state.part, qi), q = part().questions[qi];\n  state.pos[key] = Math.max(0, Math.min(q.dur, t));\n  paint(qi);\n}\nfunction paint(qi){\n  var key = qkey(state.part, qi), q = part().questions[qi], pos = state.pos[key] || 0;\n  var wave = document.querySelector('[data-wave=\"'+qi+'\"]');\n  var time = document.querySelector('[data-time=\"'+qi+'\"]');\n  if (wave) wave.innerHTML = waveSvg(qi, q, pos);\n  if (time) time.textContent = fmt(pos) + ' / ' + fmt(q.dur);\n  document.querySelectorAll('.qcard').forEach(function(c){\n    c.classList.toggle('active', state.playingKey === qkey(state.part, +c.dataset.q));\n  });\n}\nfunction stopAudio(){\n  clearInterval(state.timer); state.timer = null; state.playingKey = null; state.chain = false;\n}\nfunction togglePlay(qi){\n  var key = qkey(state.part, qi);\n  if (state.playingKey === key){ stopAudio(); renderQuestions(); return; }\n  stopAudio();\n  state.playingKey = key;\n  if ((state.pos[key] || 0) >= part().questions[qi].dur) state.pos[key] = 0;\n  state.timer = setInterval(function(){\n    var q = part().questions[qi];\n    state.pos[key] = (state.pos[key] || 0) + 0.5;\n    if (state.pos[key] >= q.dur){\n      state.pos[key] = q.dur;\n      var chaining = state.chain, next = qi + 1;\n      stopAudio(); renderQuestions();\n      if (chaining && next < part().questions.length){ state.chain = true; togglePlay(next); }\n      return;\n    }\n    paint(qi);\n  }, 220);\n  renderQuestions();\n}\n\n/* ============================ wiring ============================ */\ndocument.getElementById('playAll').addEventListener('click', function(){\n  stopAudio();\n  state.chain = true;\n  part().questions.forEach(function(q,qi){ state.pos[qkey(state.part,qi)] = 0; });\n  togglePlay(0);\n  toast('Playing all ' + part().questions.length + ' answer' + (part().questions.length>1?'s':'') + ' in order');\n});\ndocument.querySelectorAll('#speeds button').forEach(function(b){\n  b.addEventListener('click', function(){\n    document.querySelectorAll('#speeds button').forEach(function(x){ x.classList.remove('active'); });\n    b.classList.add('active');\n  });\n});\ndocument.querySelectorAll('.tabs button').forEach(function(btn){\n  btn.addEventListener('click', function(){\n    document.querySelectorAll('.tabs button').forEach(function(b){ b.classList.remove('active'); });\n    btn.classList.add('active');\n    document.querySelectorAll('.tabpanel').forEach(function(pn){ pn.hidden = pn.dataset.panel !== btn.dataset.tab; });\n  });\n});\ndocument.getElementById('finalScore').addEventListener('input', function(){\n  toast('Band is averaged from the four criteria below');\n});\ndocument.getElementById('regradeBtn').addEventListener('click', function(){ toast('Re-grading ' + part().name + ' with AI…'); });\ndocument.getElementById('sendBtn').addEventListener('click', function(){\n  var ungraded = PARTS.filter(function(p){ return bandOf(p) === null; });\n  if (ungraded.length){\n    toast(ungraded.map(function(p){ return p.name; }).join(', ') + ' still needs a band');\n    return;\n  }\n  document.getElementById('savedLbl').textContent = 'sent';\n  toast('Sent to student');\n});\n\n/* highlight a run of transcript text to mark it */\ndocument.addEventListener('mouseup', function(ev){\n  if (ev.target.closest('#markpop')) return;\n  setTimeout(openMarkPopover, 0);          /* let the selection settle first */\n});\ndocument.getElementById('popClose').addEventListener('click', function(){\n  closeMarkPopover();\n  window.getSelection().removeAllRanges();\n});\ndocument.addEventListener('keydown', function(ev){\n  if (ev.key === 'Escape' && !document.getElementById('markpop').hidden){\n    closeMarkPopover();\n    window.getSelection().removeAllRanges();\n  }\n});\ndocument.addEventListener('mousedown', function(ev){\n  if (!document.getElementById('markpop').hidden && !ev.target.closest('#markpop')) closeMarkPopover();\n});\n\nvar toastTimer;\nfunction toast(msg){\n  var t = document.getElementById('toast');\n  t.textContent = msg; t.classList.add('on');\n  clearTimeout(toastTimer);\n  toastTimer = setTimeout(function(){ t.classList.remove('on'); }, 1800);\n}\n\nfunction renderAll(){ renderParts(); renderHead(); renderQuestions(); renderGrading(); renderRollup(); renderRail(); }\nrenderAll();\nif (SCRATCH){\n  document.getElementById('regradeBtn').textContent = '↻ Show Ed’s draft';\n  toast('Grading from scratch · Ed’s draft is hidden');\n}\nif (AT === 'sent'){\n  document.getElementById('savedLbl').textContent = 'sent';\n  var sb = document.getElementById('sendBtn');\n  sb.textContent = 'Sent to student ✓';\n  sb.disabled = true;\n  var t = document.getElementById('toast');\n  t.textContent = 'Sent to Phạm Anh Thư · she has been notified';\n  t.classList.add('on');\n}\n})();\n<\/script>\n"};</script>


<div class="page">
  <section class="flowcol" aria-label="Workflow">
    <div class="title">
      <h1>IELTS Speaking Workflow</h1>
      <p>From picking a test to reading the grading. Click any step to see its screen at that moment.</p>
    </div>
    <div class="legend">
      <span class="who student"><i></i>Student</span>
      <span class="who ed"><i></i>Ed (AI)</span>
      <span class="who teacher"><i></i>Teacher</span>
      <span class="newtag">New screen</span>
    </div>
    <div class="flow" id="flow"></div>
  </section>

  <section class="viewer" aria-label="Screen for the selected step">
    <div class="vhead">
      <div class="vrow">
        <span class="vnum" id="vNum"></span>
        <span id="vWho"></span>
        <span id="vNew"></span>
        <span class="grow"></span>
        <div class="nav">
          <button id="prevBtn" aria-label="Previous step">← Prev</button>
          <button id="nextBtn" aria-label="Next step">Next →</button>
        </div>
      </div>
      <h2 id="vTitle"></h2>
      <p id="vText"></p>
      <div class="vrow">
        <div class="tabs" id="vTabs" role="tablist"></div>
        <span class="grow"></span>
        <span class="file" id="vFile"></span>
      </div>
    </div>
    <div class="stage" id="stage">
      <div class="loading" id="loading">Loading screen…</div>
    </div>
  </section>
</div>

<script>
(function(){
"use strict";

/* Each step names the screen(s) that show it. `at` opens a mockup at a given moment: the
   mockup fast-forwards the test with sample answers and stops there. */
var STEPS = [
  { id:'s1', n:'1', who:'student', title:'Choose what to practise',
    text:'The student picks one part on its own, or the full test with Parts 1, 2 and 3 in order.',
    screens:[{ label:'Chooser', file:'interview-choose-part.html' }] },
  { id:'s2', n:'2', who:'student', title:'Answer the questions',
    text:'The examiner asks each question and the student records an answer. Part 2 is a cue card with one minute to prepare. In the full test the next part starts straight away, with no feedback in between.',
    screens:[
      { label:'Full test', file:'interview-send-full.html' },
      { label:'Part 1', file:'interview-send-part-1.html' },
      { label:'Part 2', file:'interview-send-part-2.html' },
      { label:'Part 3', file:'interview-send-part-3.html' }
    ] },
  { id:'s3', n:'3', who:'student', title:'Press Finish',
    text:'The examiner closes the test and every recording is saved. Nothing is graded yet.',
    screens:[
      { label:'Full test', file:'interview-send-full.html', at:'finished' },
      { label:'Part 2', file:'interview-send-part-2.html', at:'finished' }
    ] },
  { id:'s4', n:'4', who:'student', decision:true, title:'Who should grade it?',
    text:'A popup asks the student to send the test to Ed for instant grading, or to their teacher.',
    screens:[
      { label:'Full test', file:'interview-send-full.html', at:'picker' },
      { label:'Single part', file:'interview-send-part-3.html', at:'picker' }
    ] },

  { id:'e1', n:'A1', branch:'ed', who:'ed', title:'Ed grades the test',
    text:'Ed listens to every answer and grades it in seconds.',
    screens:[{ label:'Ed grading', file:'interview-send-full.html', at:'ed-grading' }] },
  { id:'e2', n:'A2', branch:'ed', who:'student', title:'Student reads Ed’s grading',
    text:'Bands for each criterion and part, the mistakes in every answer with corrections, and Ed’s better version of each answer.',
    screens:[
      { label:'Full test', file:'interview-send-full.html', at:'ed' },
      { label:'Part 1', file:'interview-send-part-1.html', at:'ed' }
    ] },

  { id:'t1', n:'B1', branch:'teacher', who:'student', title:'“Teacher has received your submission”',
    text:'A status tracker shows Submitted, Being graded and Returned. The student can close the page.',
    screens:[
      { label:'Full test', file:'interview-send-full.html', at:'sent' },
      { label:'Part 2', file:'interview-send-part-2.html', at:'sent' }
    ] },
  { id:'t2', n:'B2', branch:'teacher', who:'teacher', isNew:true, title:'Submission reaches the teacher’s queue',
    text:'The teacher’s list of speaking tests to grade, oldest first, with Ed’s draft already prepared and the 48-hour deadline.',
    screens:[{ label:'Queue', file:'teacher-queue.html', isNew:true }] },
  { id:'t3', n:'B3', branch:'teacher', who:'teacher', decision:true, isNew:true, title:'Review Ed’s draft, or grade from scratch?',
    text:'When the teacher opens a submission, they choose to start from Ed’s grading or mark it themselves. Choosing one jumps to the next step.',
    screens:[{ label:'Grading choice', file:'teacher-queue.html', at:'choose', isNew:true }] },
  { id:'t4', n:'B4', branch:'teacher', who:'teacher', title:'Teacher grades',
    text:'The teacher listens to the recordings, marks errors in the transcript and sets bands for each part.',
    screens:[
      { label:'Reviewing Ed’s draft', file:'speaking-grading-screen.html' },
      { label:'From scratch', file:'speaking-grading-screen.html', at:'scratch', isNew:true }
    ] },
  { id:'t5', n:'B5', branch:'teacher', who:'teacher', title:'Send to student',
    text:'Once every part has a band, the teacher sends the grading back.',
    screens:[{ label:'Sent', file:'speaking-grading-screen.html', at:'sent' }] },
  { id:'t6', n:'B6', branch:'teacher', who:'student', title:'Student is notified',
    text:'A notification says the teacher has graded the test.',
    screens:[
      { label:'Full test', file:'interview-send-full.html', at:'returned' },
      { label:'Part 2', file:'interview-send-part-2.html', at:'returned' }
    ] },
  { id:'t7', n:'B7', branch:'teacher', who:'student', title:'Student reads the teacher’s grading',
    text:'The teacher’s bands, comments and corrections on every answer.',
    screens:[
      { label:'Full test', file:'interview-send-full.html', at:'teacher' },
      { label:'Part 2', file:'interview-send-part-2.html', at:'teacher' }
    ] }
];
var WHO = { student:'Student', ed:'Ed (AI)', teacher:'Teacher' };
var byId = {};
STEPS.forEach(function(s, i){ s.i = i; byId[s.id] = s; });

function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function whoChip(w){ return '<span class="who ' + w + '"><i></i>' + WHO[w] + '</span>'; }

/* ---------------- draw the flow ---------------- */
function stepHtml(s){
  return '<button class="step ' + s.who + (s.decision ? ' decision' : '') + '" data-step="' + s.id + '" aria-current="false">'
    + '<span class="top"><span class="num">' + s.n + '</span>' + whoChip(s.who)
    + (s.isNew ? '<span class="newtag">New</span>' : '') + '</span>'
    + '<span class="nm">' + esc(s.title) + '</span></button>';
}
function column(list){
  return list.map(stepHtml).join('<div class="arrow" aria-hidden="true"></div>');
}
var trunk = STEPS.filter(function(s){ return !s.branch; });
var edPath = STEPS.filter(function(s){ return s.branch === 'ed'; });
var tPath = STEPS.filter(function(s){ return s.branch === 'teacher'; });
document.getElementById('flow').innerHTML =
  '<div class="col">' + column(trunk) + '</div>'
  + '<div class="fork" aria-hidden="true"><span class="l"></span><span class="r"></span></div>'
  + '<div class="branches">'
    + '<div class="col"><span class="blabel ed">Send to Ed</span>' + column(edPath)
      + '<div class="joinnote"><b>Also send to your teacher.</b> After reading Ed’s grading, the student can send the same test to the teacher. It joins the teacher path at B1.</div></div>'
    + '<div class="col"><span class="blabel teacher">Send to teacher</span>' + column(tPath) + '</div>'
  + '</div>';

/* ---------------- the screen viewer ---------------- */
var stage = document.getElementById('stage');
var loading = document.getElementById('loading');
var cache = {};
var current = null, tab = 0, frame = null, loadSeq = 0;
var VIRTUAL_W = 1280;

/* Load a mockup with its preset. Fetching the file and writing it into srcdoc lets us hand the
   page its moment (window.__AT). If fetching is not possible (opened from disk), fall back to a
   normal src with #at=... in the URL, which the mockups also read. */
function getSource(file){
  if (cache[file]) return Promise.resolve(cache[file]);
  /* The single-file build (build-workflow-file.js) embeds every screen in window.SCREENS. */
  if (window.SCREENS && window.SCREENS[file]) return Promise.resolve(window.SCREENS[file]);
  return fetch(file).then(function(r){
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return r.text();
  }).then(function(t){ cache[file] = t; return t; });
}
function withPreset(html, at){
  var inject = '<script>window.__AT=' + JSON.stringify(at || '') + ';<\/script>';
  if (!/^\s*<!doctype/i.test(html)){
    html = '<!doctype html><html lang="en"><head><meta charset="utf-8">'
      + '<meta name="viewport" content="width=device-width, initial-scale=1">'
      + '<style>body{margin:0;font-size:14px}[hidden]{display:none!important}</style>'
      + html.replace(/<\/style>/, '</style></head><body>') + '</body></html>';
  }
  return html.replace(/<head>/i, '<head>' + inject);
}

function fit(){
  if (!frame) return;
  var w = stage.clientWidth, h = stage.clientHeight;
  var vw = w < 640 ? w : VIRTUAL_W;
  var scale = w / vw;
  frame.style.width = vw + 'px';
  frame.style.height = Math.ceil(h / scale) + 'px';
  frame.style.transform = 'scale(' + scale + ')';
}
window.addEventListener('resize', fit);

function loadScreen(scr){
  var seq = ++loadSeq;
  loading.hidden = false;
  if (frame) frame.remove();
  frame = document.createElement('iframe');
  frame.title = current.title + ' · ' + scr.label;
  frame.addEventListener('load', function(){ if (seq === loadSeq) loading.hidden = true; });
  stage.appendChild(frame);
  fit();
  getSource(scr.file).then(function(html){
    if (seq !== loadSeq) return;
    frame.srcdoc = withPreset(html, scr.at);
  }).catch(function(){
    if (seq !== loadSeq) return;
    frame.src = scr.file + (scr.at ? '#at=' + scr.at : '');
  });
}

function select(id, t){
  var s = byId[id] || STEPS[0];
  current = s;
  tab = Math.min(t || 0, s.screens.length - 1);
  document.querySelectorAll('[data-step]').forEach(function(b){
    b.setAttribute('aria-current', String(b.dataset.step === s.id));
  });
  document.getElementById('vNum').textContent = 'Step ' + s.n;
  document.getElementById('vWho').innerHTML = whoChip(s.who);
  document.getElementById('vNew').innerHTML = s.isNew ? '<span class="newtag">New screen</span>' : '';
  document.getElementById('vTitle').textContent = s.title;
  document.getElementById('vText').textContent = s.text;
  document.getElementById('prevBtn').disabled = s.i === 0;
  document.getElementById('nextBtn').disabled = s.i === STEPS.length - 1;
  renderTabs();
  try { history.replaceState(null, '', '#' + s.id); } catch(e){}
}

function renderTabs(){
  var s = current;
  document.getElementById('vTabs').innerHTML = s.screens.length > 1
    ? s.screens.map(function(scr, i){
        return '<button role="tab" aria-selected="' + (i === tab) + '" data-tab="' + i + '">' + esc(scr.label)
          + (scr.isNew && !s.isNew ? ' ·&nbsp;new' : '') + '</button>';
      }).join('')
    : '';
  document.querySelectorAll('[data-tab]').forEach(function(b){
    b.addEventListener('click', function(){ tab = +b.dataset.tab; renderTabs(); });
  });
  var scr = s.screens[tab];
  document.getElementById('vFile').innerHTML = 'Screen: <code>' + esc(scr.file) + '</code>'
    + (scr.at ? ' at <code>' + esc(scr.at) + '</code>' : '');
  loadScreen(scr);
}

document.getElementById('flow').addEventListener('click', function(e){
  var b = e.target.closest('[data-step]');
  if (!b) return;
  select(b.dataset.step, 0);
  if (window.matchMedia('(max-width:900px)').matches)
    document.querySelector('.viewer').scrollIntoView({ behavior:'smooth', block:'start' });
});
document.getElementById('prevBtn').addEventListener('click', function(){ select(STEPS[current.i - 1].id, 0); });
document.getElementById('nextBtn').addEventListener('click', function(){ select(STEPS[current.i + 1].id, 0); });

/* The teacher queue asks to jump to step B4 when a grading mode is chosen. */
window.addEventListener('message', function(e){
  var d = e.data;
  if (d && d.workflow === 'goto' && byId[d.step]) select(d.step, d.tab || 0);
});

var start = (location.hash || '').replace('#', '');
select(byId[start] ? start : 's1', 0);
})();
</script>

</body>
</html>
