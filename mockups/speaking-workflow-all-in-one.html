(--ink)}\n\n@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}\n@media (max-width:620px){\n  .brand h1{font-size:16px}\n  .voicewrap{order:5;width:100%;align-items:flex-start}\n  .voicewrap .cap{display:none}\n  .voicerow{justify-content:flex-start}\n  .micwrap,.donewrap,.prepwrap{width:84px}\n  .mic,.donebtn,.prepdial{width:56px;height:56px}\n  .prepdial{font-size:16px}\n}\n<\/style>\n\n<div class=\"shell\">\n\n  <header class=\"topbar\">\n    <button class=\"iconbtn\" aria-label=\"Back\">\n      <svg viewBox=\"0 0 24 24\"><path d=\"M19 12H5M11 6l-6 6 6 6\"/><\/svg>\n    <\/button>\n    <button class=\"iconbtn\" aria-label=\"Microphone settings\">\n      <svg viewBox=\"0 0 24 24\"><rect x=\"9\" y=\"3\" width=\"6\" height=\"11\" rx=\"3\"/><path d=\"M5 11a7 7 0 0 0 14 0M12 18v3\"/><\/svg>\n    <\/button>\n\n    <div class=\"brand\">\n      <h1>IELTS Mock Interview<\/h1>\n      <div class=\"status\"><span class=\"live\"><\/span> <span id=\"brandSub\">Practising Part 1<\/span><\/div>\n    <\/div>\n\n    <div class=\"grow\"><\/div>\n\n    <div class=\"voicewrap\">\n      <span class=\"cap\">Examiner voice<\/span>\n      <div class=\"voicerow\">\n        <button class=\"playbtn\" id=\"replayBtn\" aria-label=\"Replay the question\">\n          <svg viewBox=\"0 0 24 24\"><path d=\"M8 5v14l11-7z\"/><\/svg>\n        <\/button>\n        <select class=\"voicesel\" id=\"voice\" aria-label=\"Examiner accent\">\n          <option>British (UK)<\/option>\n          <option>American (US)<\/option>\n          <option>Australian (AU)<\/option>\n        <\/select>\n        <button class=\"iconbtn\" aria-label=\"Mute examiner\">\n          <svg viewBox=\"0 0 24 24\"><path d=\"M4 9v6h4l5 4V5L8 9H4zM17 9.5a4 4 0 0 1 0 5M19.5 7a7 7 0 0 1 0 10\"/><\/svg>\n        <\/button>\n        <span class=\"chip\"><svg viewBox=\"0 0 24 24\"><path d=\"M4 6h16M4 12h16M4 18h10\"/><\/svg>\n          <span id=\"posText\">Part 1 · 1/10<\/span><\/span>\n        <span class=\"chip counter\">\n          <svg viewBox=\"0 0 24 24\"><circle cx=\"12\" cy=\"12\" r=\"8\"/><path d=\"M12 8v4l3 2\"/><\/svg>\n          3/3 free credits / 24h\n        <\/span>\n        <button class=\"endbtn\" id=\"endBtn\">End test<\/button>\n      <\/div>\n    <\/div>\n  <\/header>\n\n  <div class=\"rail\" id=\"rail\"><\/div>\n\n  <main class=\"thread\" id=\"thread\" tabindex=\"-1\"><\/main>\n\n  <footer class=\"composer\" id=\"composer\"><\/footer>\n<\/div>\n\n<\u0021-- Finish -> who grades this test? -->\n<div class=\"overlay\" id=\"picker\" hidden>\n  <div class=\"picker\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"pickTitle\">\n    <div class=\"eyebrow\" id=\"pickEyebrow\">Test finished<\/div>\n    <h2 id=\"pickTitle\">Who should grade your test?<\/h2>\n    <p class=\"lede\" id=\"pickLede\"><\/p>\n    <div class=\"choices\">\n      <button class=\"choice ed\" id=\"pickEd\">\n        <span class=\"face\" id=\"pickEdFace\"><\/span>\n        <span class=\"nm\">Send to Ed<\/span>\n        <p class=\"d\">Ed, our AI coach, grades it now: a band for each criterion, the mistakes in every answer, and a better way to say each one.<\/p>\n        <span class=\"when\">Results in seconds<\/span>\n      <\/button>\n      <button class=\"choice teacher\" id=\"pickTeacher\">\n        <span class=\"face\">MH<\/span>\n        <span class=\"nm\">Send to your teacher<\/span>\n        <p class=\"d\">Ms. Hạnh listens to every recording and grades it by hand, with her own comments and corrections.<\/p>\n        <span class=\"when\">Usually within 48 hours<\/span>\n      <\/button>\n    <\/div>\n    <div class=\"foot\"><button class=\"linkbtn\" id=\"pickCancel\">Not now<\/button><\/div>\n  <\/div>\n<\/div>\n\n<\u0021-- teacher has returned the grading -->\n<div class=\"notice\" id=\"notice\" role=\"status\" hidden>\n  <span class=\"av\">MH<\/span>\n  <div class=\"t\"><b>Ms. Hạnh has graded your test<\/b><span>Bands, comments and every correction are ready.<\/span><\/div>\n  <button class=\"act\" id=\"noticeBtn\">View grading<\/button>\n<\/div>\n\n<script>\n(function(){\n\"use strict\";\n\n/* Which part this page runs. null = the full test, Part 1 -> 2 -> 3.\n   The interview-send-part-N files are this file with ONLY set to 0, 1 or 2. */\nvar ONLY = 0;\n\n/* ============================ test content ============================ */\nvar ALL_PARTS = [\n  {\n    name:'Part 1', desc:'Introduction and interview', kind:'questions', minutes:'4–5 minutes',\n    brief:'The examiner asks about you, your home, your work or studies, and other familiar topics. Answer naturally — two or three sentences, always with a reason.',\n    questions:[\n      { set:'Hometown', q:'Where is your hometown?',\n        sample:'My hometown is Hải Phòng, a port city in the north, about two hour from Hanoi by car. It is quite big but not so crowded like Hanoi.' },\n      { set:'Hometown', q:'What do you like most about your hometown?',\n        sample:'The food, especially the seafood. There are many small restaurant near the sea and the price is very reasonable.' },\n      { set:'Hometown', q:'Is it a good place for young people to live?',\n        sample:'Yes and no. It is comfortable and cheap to live, but there are not many opportunity for career, so a lot of my friend moved to Hanoi.' },\n      { set:'Work', q:'Do you work, or are you a student?',\n        sample:'I am working now. I am a marketing assistant for a company make cosmetics, and I have done this job for about one year and a half.' },\n      { set:'Work', q:'What do you enjoy most about your job?',\n        sample:'I enjoy working with my team because they are young and friendly. Also I can learn a lot of thing about design and social media.' },\n      { set:'Work', q:'Would you like to change your job in the future?',\n        sample:'Maybe in two or three years. I want to try a bigger company, or, um, maybe study abroad if I can save enough money.' },\n      { set:'Weather', q:'What kind of weather do you like most?',\n        sample:'I like sunny weather but not too hot. In my city it is very humid in summer, so I prefer autumn when the air is cool and dry.' },\n      { set:'Weather', q:'Does the weather affect how you feel?',\n        sample:'Yes, definitely. When it rain many days I feel tired and lazy, but on a sunny morning I have more energy to go out.' },\n      { set:'Weather', q:'Is the weather in your hometown similar to other parts of your country?',\n        sample:'Not really. My hometown is in the north so we have four season, but in the south it is hot all year with only rainy and dry season.' },\n      { set:'Weather', q:'Has the weather in your country changed in recent years?',\n        sample:'Yes, I think it changed a lot. The summer is hotter than before and the rain come at strange time, not like when I was a child.' }\n    ],\n    tip:'Phản xạ tốt, bạn trả lời ngay và không im lặng lâu. Lỗi lặp lại nhiều nhất là danh từ số nhiều sau số đếm và từ chỉ lượng: \"two hours\", \"four seasons\", \"many restaurants\", \"a lot of things\". Những câu dưới 20 từ nên kéo dài thêm một lý do hoặc ví dụ.'\n  },\n  {\n    name:'Part 2', desc:'Individual long turn', kind:'cue', minutes:'3–4 minutes',\n    brief:'You get a task card, one minute to prepare with notes, then you speak on your own for one to two minutes.',\n    cue:{\n      title:'Describe a skill you would like to learn.',\n      bullets:['what the skill is','how you would learn it','how long it would take to learn'],\n      explain:'And explain why you want to learn this skill.'\n    },\n    sample:'I would like to talk about playing the guitar, because it is a skill I have wanted for a long time but I never had enough time to learn it properly. I think I would learn it by watching video on YouTube first, and maybe later I will join a small class near my house, because practicing with a teacher is more effective than practicing alone. I think it would take about one year to play some simple song, but to play really well it will take much longer, maybe three or four year. The reason I want to learn it is because music make me relax after a stressful day at work, and I also think it would be a good skill to have at parties with my friends.',\n    tip:'Bạn nói gần đủ hai phút và bao quát cả bốn ý trên cue card — đây là điều giám khảo nhìn vào đầu tiên. Cần chú ý thì khi nói về dự định: \"I would join\" chứ không phải \"I will join\", và \"three or four years\".'\n  },\n  {\n    name:'Part 3', desc:'Two-way discussion', kind:'questions', minutes:'4–5 minutes',\n    brief:'Broader questions linked to your Part 2 topic. Give reasons, examples and more than one point of view.',\n    questions:[\n      { set:'Learning & technology', q:'Do you think people learn new skills differently now compared to the past?',\n        sample:'Definitely, it is very different now. In the past you must go to a class or find a teacher, but now you can learn almost everything on the internet. My father learned to repair his motorbike just from watching video. But the problem is people give up more easy now, because nobody is checking on them.' },\n      { set:'Learning & technology', q:\"What kinds of skills should schools teach that they don't teach now?\",\n        sample:'I think schools should teach more practical thing like managing money, or how to speak in front of people. When I left school I did not know anything about tax or saving and I had to learn it myself, which was quite stressful.' },\n      { set:'Learning & technology', q:'Is it ever too late for someone to learn a new skill?',\n        sample:'No, I do not think so. My mother started to learn English when she was fifty and now she can talk with foreign customer quite confident. Maybe it takes more time when you are older, but it is never impossible.' },\n      { set:'Learning & technology', q:'Should employers pay for their staff to learn new skills?',\n        sample:'Yes, I think it is good for both side. If the company pay for training, the staff will be more loyal and also more skillful, so the company get benefit too. But some employer worry that people will leave after they finish the course.' },\n      { set:'Learning & technology', q:'Which is more useful, learning from a teacher or learning on your own?',\n        sample:'It depend on the skill. For language I think a teacher is better because they correct your mistake immediately, but for computer skill you can learn alone with video and a lot of practice.' }\n    ],\n    tip:'Ý tưởng tốt và luôn có ví dụ thật — đây là điểm mạnh của bạn ở Part 3. Hãy dùng trạng từ thay cho tính từ: \"quite confidently\", \"more easily\", và mở rộng câu trả lời bằng \"on the other hand\" hoặc \"that said\".'\n  }\n];\nvar PARTS = ONLY === null ? ALL_PARTS : [ALL_PARTS[ONLY]];\n\nvar FILLERS = ['um','uh','er','ah','like','you know','i mean','sort of','kind of','actually','basically','well'];\nvar PREP_SECONDS = 60, SHORT_ANSWER = 20;\n\n/* What the examiner says when moving on. The test runs as one unbroken conversation:\n   nothing from Ed or the teacher appears until every part is finished. */\nvar SCRIPT = {\n  toPart2:'Thank you. Now I’m going to give you a topic, and I’d like you to talk about it for one to two minutes. '\n        + 'Before you talk, you’ll have one minute to think about what you’re going to say, and you can make notes if you wish.',\n  toPart3:'Thank you. We’ve been talking about a skill you would like to learn, and I’d like to discuss with you '\n        + 'one or two more general questions related to this.',\n  closing:ONLY === null ? 'Thank you. That is the end of the speaking test.'\n                        : 'Thank you. That is the end of this part of the test.'\n};\n\nvar state = {\n  p:0, q:0, stage:'asking',\n  recording:false, seconds:0, timer:null, prepTimer:null, prepLeft:PREP_SECONDS,\n  draft:'', notes:'', log:PARTS.map(function(){ return []; }), finished:false,\n  playing:null, playTimer:null, playPos:0,\n  graders:[]          /* who has been asked to grade: 'ed', 'teacher' */\n};\nvar teacherStatus = null;   /* null | 'waiting' | 'returned' | 'shown' */\n\nvar thread = document.getElementById('thread');\nvar composer = document.getElementById('composer');\n\nfunction part(){ return PARTS[state.p]; }\nfunction qCount(p){ return p.kind === 'cue' ? 1 : p.questions.length; }\nfunction words(t){ return t.trim().split(/\\s+/).filter(Boolean); }\nfunction clock(s){ return Math.floor(s/60) + ':' + String(Math.floor(s%60)).padStart(2,'0'); }\nfunction esc(s){ return String(s).replace(/&/g,'&amp;').replace(/<\/g,'&lt;').replace(/>/g,'&gt;'); }\nfunction scrollDown(){ requestAnimationFrame(function(){ thread.scrollTop = thread.scrollHeight; }); }\nfunction countFillers(text){\n  var low = ' ' + text.toLowerCase().replace(/[.,!?;:]/g,' ') + ' ', n = 0;\n  FILLERS.forEach(function(f){\n    var m = low.match(new RegExp('\\\\s' + f.replace(/ /g,'\\\\s+') + '\\\\s','g'));\n    if (m) n += m.length;\n  });\n  return n;\n}\n\n/* ============================ rail ============================ */\nfunction renderRail(){\n  document.getElementById('rail').innerHTML = PARTS.map(function(p,i){\n    var total = qCount(p), done = state.log[i].length;\n    var locked = i > state.p;\n    var cls = (i === state.p && !state.finished ? 'now' : '') + (locked ? ' locked' : '');\n    var segs = '';\n    for (var k = 0; k < total; k++){\n      segs += '<span class=\"seg ' + (k < done ? 'done' : (i === state.p && k === state.q && !state.finished ? 'now' : '')) + '\"><\/span>';\n    }\n    return '<div class=\"part ' + cls + '\">'\n      + '<div class=\"pt\"><span class=\"tick' + (done === total ? ' on' : '') + '\">'\n        + (done === total ? '<svg viewBox=\"0 0 24 24\"><path d=\"M5 13l4 4L19 7\"/><\/svg>' : '') + '<\/span>'\n      + '<span class=\"pn\">' + p.name + '<\/span>'\n      + '<span class=\"pk\">' + (locked\n          ? '<svg viewBox=\"0 0 24 24\"><rect x=\"5\" y=\"11\" width=\"14\" height=\"10\" rx=\"2\"/><path d=\"M8 11V7a4 4 0 0 1 8 0v4\"/><\/svg> Locked'\n          : done + '/' + total) + '<\/span><\/div>'\n      + '<div class=\"segs\">' + segs + '<\/div>'\n      + '<div class=\"pd\">' + p.desc + '<\/div><\/div>';\n  }).join('');\n\n  var p = part(), txt;\n  if (state.finished) txt = 'Test complete';\n  else if (state.stage === 'ended') txt = 'Test over';\n  else if (state.stage === 'moving' || state.stage === 'closing') txt = 'Examiner speaking';\n  else if (p.kind === 'cue') txt = p.name + ' · long turn';\n  else txt = p.name + ' · ' + Math.min(state.q + 1, p.questions.length) + '/' + p.questions.length;\n  document.getElementById('posText').textContent = txt;\n  document.getElementById('brandSub').textContent = state.finished\n    ? (ONLY === null ? 'Full test' : p.name) + ' · ' + (teacherStatus === 'waiting' ? 'with your teacher' : 'complete')\n    : (ONLY === null ? '' : 'Practising ') + p.name + ' · ' + p.desc + ' · ' + p.minutes;\n}\n\n/* ============================ thread blocks ============================ */\nfunction divider(label, big){\n  var d = document.createElement('div');\n  d.className = 'divider' + (big ? ' part' : '');\n  d.innerHTML = '<span>' + esc(label) + '<\/span>';\n  thread.appendChild(d);\n}\n\nfunction askQuestion(){\n  var p = part(), q = p.questions[state.q], n = state.q + 1;\n  if (state.q === 0 || p.questions[state.q - 1].set !== q.set) divider(p.name + ' · ' + q.set);\n\n  var turn = document.createElement('div');\n  turn.className = 'turn';\n  turn.innerHTML = '<div class=\"ask\"><div class=\"quotemark\">&rdquo;<\/div><div class=\"bubble\">'\n    + '<div class=\"tag\">Examiner · ' + p.name + ' · Question ' + n + ' of ' + p.questions.length + '<\/div>'\n    + '<div class=\"dots\" aria-label=\"The examiner is speaking\"><i><\/i><i><\/i><i><\/i><\/div>'\n    + '<\/div><\/div>';\n  thread.appendChild(turn);\n  scrollDown();\n\n  setTimeout(function(){\n    turn.querySelector('.bubble').innerHTML =\n      '<div class=\"tag\">Examiner · ' + p.name + ' · Question ' + n + ' of ' + p.questions.length + '<\/div>'\n      + '<div class=\"askrow\">'\n      + '<button class=\"hearbtn\" aria-label=\"Hear the question again\"><svg viewBox=\"0 0 24 24\"><path d=\"M8 5v14l11-7z\"/><\/svg><\/button>'\n      + '<p class=\"say\">' + esc(q.q) + '<\/p><\/div>';\n    state.stage = 'answering';\n    renderComposer();\n    scrollDown();\n  }, 950);\n}\n\nfunction showCue(){\n  var p = part(), c = p.cue;\n  var el = document.createElement('div');\n  el.className = 'turn cue';\n  el.innerHTML = '<div class=\"tag\">Examiner · Candidate task card<\/div>'\n    + '<h2>' + esc(c.title) + '<\/h2>'\n    + '<div class=\"lead\">You should say:<\/div>'\n    + '<ul>' + c.bullets.map(function(b){ return '<li>' + esc(b) + '<\/li>'; }).join('') + '<\/ul>'\n    + '<p class=\"explain\">' + esc(c.explain) + '<\/p>'\n    + '<div class=\"rules\"><span>1 minute to prepare<\/span><span>Speak for 1–2 minutes<\/span><span>Notes allowed<\/span><\/div>';\n  thread.appendChild(el);\n  scrollDown();\n  startPrep();\n}\n\nfunction addAnswer(text, secs, label){\n  var el = document.createElement('div');\n  el.className = 'turn said';\n  el.innerHTML = '<div class=\"bubble\"><div class=\"head\">'\n    + '<div class=\"tag\">You · ' + esc(label) + '<\/div>'\n    + '<span class=\"stamp\">' + clock(secs) + '<\/span><\/div>'\n    + '<p class=\"say\">' + esc(text) + '<\/p><\/div>';\n  thread.appendChild(el);\n  scrollDown();\n}\n\n/* ============================ the two graders ============================\n   Ed grades instantly (the AI). The teacher grades by hand on the grading screen and returns it\n   later. Both are shown the same way: four criteria with bands and comments, then every answer\n   with the errors marked on it. Ed also rewrites each answer. */\nvar CRIT = [\n  { key:'fluency', cls:'fluency', name:'Fluency & Coherence' },\n  { key:'pron',    cls:'pron',    name:'Pronunciation' },\n  { key:'lexical', cls:'lexical', name:'Lexical Resource' },\n  { key:'grammar', cls:'grammar', name:'Grammatical Range & Accuracy' }\n];\n\n\nvar ED = {\n  key:'ed', name:'Ed', role:'LearnED AI coach · instant grading', graded:'just now',\n  parts:[\n    {\n      bands:{ fluency:6.0, pron:5.5, lexical:6.0, grammar:5.5 },\n      overview:'Bạn trả lời nhanh và luôn có lý do — rất tốt cho Part 1. Ed thấy lỗi lặp lại nhiều nhất là danh từ số nhiều '\n             + 'sau số đếm và từ chỉ lượng. Mỗi câu nên dài thêm một ví dụ.',\n      notes:{\n        fluency:'Không có khoảng lặng dài. Có một từ đệm \"um\" ở câu 6.',\n        pron:'Ước tính từ tốc độ nói và transcript — Ed chưa phân tích âm vị, nên hãy coi đây là gợi ý.',\n        lexical:'Đủ từ cho chủ đề quen thuộc. Có thể dùng \"affordable\", \"career opportunities\".',\n        grammar:'4 lỗi số nhiều và 1 lỗi so sánh. Sửa nhóm lỗi này là lên band nhanh nhất.'\n      },\n      errors:[\n        { q:0, cat:'grammar', quote:'two hour', fix:'two hours', note:'Sau số đếm lớn hơn 1, danh từ phải ở số nhiều.' },\n        { q:0, cat:'grammar', quote:'not so crowded like', fix:'not as crowded as', note:'So sánh bằng: as + tính từ + as.' },\n        { q:1, cat:'grammar', quote:'many small restaurant', fix:'many small restaurants', note:'\"many\" đi với danh từ số nhiều.' },\n        { q:3, cat:'grammar', quote:'a company make cosmetics', fix:'a company that makes cosmetics', note:'Thiếu mệnh đề quan hệ \"that makes\".' },\n        { q:5, cat:'fluency', quote:'or, um, maybe', fix:'or perhaps', note:'Thay từ đệm bằng một từ nối.' }\n      ],\n      improved:[\n        'My hometown is Hải Phòng, a port city in the north, about two hours from Hanoi by car. It’s quite big, but not as crowded as Hanoi.',\n        'Definitely the food, especially the seafood. There are lots of small restaurants by the sea, and the prices are very affordable.',\n        'Yes and no. It’s comfortable and cheap to live in, but there aren’t many career opportunities, so a lot of my friends have moved to Hanoi.',\n        'I’m working at the moment. I’m a marketing assistant for a company that makes cosmetics, and I’ve been doing this job for about a year and a half.',\n        'I enjoy working with my team because they’re young and friendly. I’m also learning a lot about design and social media.',\n        'Maybe in two or three years. I’d like to try a bigger company, or perhaps study abroad if I can save enough money.',\n        'I like sunny weather, but not when it’s too hot. My city is very humid in summer, so I prefer autumn, when the air is cool and dry.',\n        'Yes, definitely. When it rains for several days I feel tired and lazy, but on a sunny morning I have much more energy to go out.',\n        'Not really. My hometown is in the north, so we have four seasons, but in the south it’s hot all year round, with just a rainy season and a dry season.',\n        'Yes, I think it has changed a lot. Summers are hotter than before, and the rain comes at unexpected times, which wasn’t the case when I was a child.'\n      ]\n    },\n    {\n      bands:{ fluency:6.5, pron:6.0, lexical:6.5, grammar:6.0 },\n      overview:'Bạn nói gần đủ hai phút và trả lời đủ bốn ý trên cue card. Ý mạch lạc. '\n             + 'Khi nói về dự định giả định, hãy dùng \"would\" thay cho \"will\".',\n      notes:{\n        fluency:'Nói liền mạch, ít ngắt quãng. Các ý được nối bằng \"because\", \"and also\".',\n        pron:'Ước tính từ tốc độ nói và transcript — Ed chưa phân tích âm vị, nên hãy coi đây là gợi ý.',\n        lexical:'Dùng đúng \"properly\", \"effective\", \"stressful\".',\n        grammar:'Lẫn \"will\" và \"would\"; còn hai lỗi số nhiều và một lỗi chia động từ.'\n      },\n      errors:[\n        { q:0, cat:'grammar', quote:'will join', fix:'would join', note:'Dự định giả định nên dùng \"would\".' },\n        { q:0, cat:'grammar', quote:'some simple song', fix:'some simple songs', note:'\"some\" ar:'Lỗi số nhiều lặp lại nhiều lần — đây là việc cần sửa trước tiên.'\n      },\n      errors:[\n        { q:0, cat:'grammar', quote:'two hour', fix:'two hours',\n          note:'Sau số đếm phải dùng số nhiều. Luyện: two hours, three days, four seasons.' },\n        { q:0, cat:'grammar', quote:'not so crowded like', fix:'not as crowded as',\n          note:'Cấu trúc so sánh bằng: as + adjective + as.' },\n        { q:1, cat:'grammar', quote:'many small restaurant', fix:'many small restaurants',\n          note:'\"many\" luôn đi với danh từ số nhiều.' },\n        { q:1, cat:'lexical', quote:'the price is very reasonable', fix:'the prices are very affordable',\n          note:'\"affordable\" tự nhiên hơn khi nói về giá đồ ăn.' },\n        { q:3, cat:'grammar', quote:'a company make cosmetics', fix:'a company that makes cosmetics',\n          note:'Cần mệnh đề quan hệ: a company that makes / a company making.' },\n        { q:5, cat:'fluency', quote:'or, um, maybe study abroad', fix:'or perhaps study abroad',\n          note:'Thay \"um\" bằng một từ nối thật: \"or perhaps\", \"or possibly\".' }\n      ]\n    },\n    {\n      bands:{ fluency:7.0, pron:6.0, lexical:6.5, grammar:6.5 },\n      overview:'Bạn nói gần đủ hai phút và bao quát cả bốn ý trên cue card — giám khảo chấm điều này đầu tiên. '\n             + 'Ý tưởng mạch lạc. Cần chú ý thì của động từ khi nói về dự định.',\n      notes:{\n        fluency:'Nói liền mạch gần hai phút, không bị tắc. Đây là band 7 thật sự.',\n        pron:'Rõ ràng, nhưng trọng âm từ dài còn chưa chắc: \"effective\", \"properly\".',\n        lexical:'Có cố gắng dùng từ khó. \"practising with a teacher\" dùng đúng.',\n        grammar:'Thì tương lai giả định còn lẫn: \"will join\" nên là \"would join\".'\n      },\n      errors:[\n        { q:0, cat:'grammar', quote:'will join', fix:'would join',\n          note:'Đang nói về dự định giả định nên dùng \"would\", không phải \"will\".' },\n        { q:0, cat:'grammar', quote:'three or four year', fix:'three or four years',\n          note:'Lại là lỗi số nhiều — giống Part 1.' },\n        { q:0, cat:'grammar', quote:'music make me relax', fix:'music helps me relax',\n          note:'\"music\" số ít nên động từ phải là \"makes\"; \"helps me relax\" tự nhiên hơn.' },\n        { q:0, cat:'pron', quote:'some simple song', fix:'some simple songs',\n          note:'Âm cuối /s/ bị nuốt. Luyện đọc to: songs, years, friends.' }\n      ]\n    },\n    {\n      bands:{ fluency:6.0, pron:6.0, lexical:6.5, grammar:6.0 },\n      overview:'Ý tưởng tốt và luôn có ví dụ thật — điểm mạnh của bạn ở Part 3. '\n             + 'Hãy dùng trạng từ thay cho tính từ, và mở rộng bằng \"on the other hand\".',\n      notes:{\n        fluency:'Trả lời dài hơn Part 1, đúng yêu cầu. Thỉnh thoảng lặp ý.',\n        pron:'Ổn định. Ngữ điệu còn hơi phẳng khi nêu quan điểm.',\n        lexical:'Dùng được \"give up\", \"practical\". Thiếu từ nối học thuật.',\n        grammar:'Nhầm tính từ/trạng từ: \"more easy\", \"quite confident\".'\n      },\n      errors:[\n        { q:0, cat:'grammar', quote:'you must go', fix:'you had to go',\n          note:'Nói về quá khứ nên dùng \"had to\", không phải \"must\".' },\n        { q:0, cat:'lexical', quote:'more easy', fix:'more easily',\n          note:'Bổ nghĩa cho động từ \"give up\" nên cần trạng từ.' },\n        { q:1, cat:'grammar', quote:'practical thing', fix:'practical things',\n          note:'Lỗi số nhiều lần thứ tư trong bài — ưu tiên sửa.' },\n        { q:2, cat:'lexical', quote:'quite confident', fix:'quite confidently',\n          note:'\"talk ... confidently\" — trạng từ bổ nghĩa cho \"talk\".' },\n        { q:3, cat:'fluency', quote:'both side', fix:'both sides',\n          note:'Thêm \"On the other hand,\" trước ý phản biện để câu trả lời mạch lạc hơn.' }\n      ]\n    }\n  ]\n};\n\n/* A single-part page keeps only that part's grading. */\nif (ONLY !== null){\n  ED.parts = [ED.parts[ONLY]];\n  TEACHER.parts = [TEACHER.parts[ONLY]];\n}\n\n/* Ed, drawn from the LearnED logo: blue body, white face, lime tuft. */\nfunction edSvg(size){\n  return '<svg class=\"edmark\" width=\"' + size + '\" height=\"' + size + '\" viewBox=\"0 0 100 100\" aria-hidden=\"true\">'\n    + '<path d=\"M30 93C13 93 7 80 11 63 17 39 34 13 58 9c19-3 29 10 25 31-3 16-10 32-16 44-5 8-17 9-37 9z\" fill=\"#4A63E7\"/>'\n    + '<path d=\"M70 6c9-2 17 0 17 6 0 7-3 13-6 17-3-8-6-15-11-23z\" fill=\"#DFF77A\" stroke=\"#1C1508\" stroke-width=\"0\"/>'\n    + '<ellipse cx=\"60\" cy=\"33\" rx=\"18\" ry=\"13\" transform=\"rotate(-14 60 33)\" fill=\"#fff\"/>'\n    + '<ellipse cx=\"56\" cy=\"37\" rx=\"2.8\" ry=\"3.6\" fill=\"#1C1508\"/>'\n    + '<ellipse cx=\"68\" cy=\"27\" rx=\"2.8\" ry=\"3.6\" fill=\"#1C1508\"/>'\n    + '<\/svg>';\n}\n\nfunction round5(v){ return Math.round(v * 2) / 2; }\nfunction partBand(pi, G){\n  var b = G.parts[pi].bands;\n  var vals = CRIT.map(function(c){ return b[c.key]; });\n  return round5(vals.reduce(function(a,x){ return a + x; }, 0) / vals.length);\n}\nfunction overallBand(G){\n  var vals = PARTS.map(function(p,i){ return partBand(i, G); });\n  return round5(vals.reduce(function(a,x){ return a + x; }, 0) / vals.length);\n}\nfunction critName(cls){\n  var c = CRIT.filter(function(x){ return x.cls === cls; })[0];\n  return c ? c.name : cls;\n}\n\n/* The grader's marks for one answer, shown under that answer. */\nfunction marksFor(pi, ai, G){\n  var list = G.parts[pi].errors.filter(function(e){ return e.q === ai; });\n  if (!list.length) return '<p class=\"noerr\">No errors marked in this answer.<\/p>';\n  return '<div class=\"marks\">' + list.map(function(e){\n    return '<div class=\"mark ' + e.cat + '\">'\n      + '<div class=\"marktop\"><span class=\"mtag ' + e.cat + '\">' + critName(e.cat) + '<\/span><\/div>'\n      + '<div class=\"mquote\">“' + esc(e.quote) + '”<\/div>'\n      + '<div class=\"mfix\"><b>Say it as<\/b>' + esc(e.fix) + '<\/div>'\n      + '<div class=\"mnote\"><b>' + esc(G.name) + '<\/b>' + esc(e.note) + '<\/div>'\n      + '<\/div>';\n  }).join('') + '<\/div>';\n}\n\n/* One part of the grading: bands, comments, then every answer with its marks.\n   Ed also gives a rewritten version of each answer (shown when the answer is the sample one,\n   since the rewrite in this mockup is written for the sample). */\nfunction addPartFeedback(pi, G){\n  var p = PARTS[pi], answers = state.log[pi], t = G.parts[pi], isEd = G.key === 'ed';\n  var el = document.createElement('div');\n  el.className = 'turn coach ' + G.key;\n\n  el.innerHTML =\n    '<div class=\"coachhead\"><span class=\"tag\">' + p.name + ' · ' + esc(p.desc) + '<\/span>'\n    + '<span class=\"pill ' + (isEd ? 'edband' : 'band') + '\">Band ' + partBand(pi, G).toFixed(1) + '<\/span><\/div>'\n    + '<p class=\"note\">' + esc(t.overview) + '<\/p>'\n    + '<div class=\"critgrid\">' + CRIT.map(function(c){\n        return '<div class=\"critcard ' + c.cls + '\">'\n          + '<div class=\"critrow\"><span class=\"critname\">' + c.name + '<\/span>'\n          + '<span class=\"critband\">' + t.bands[c.key].toFixed(1) + '<\/span><\/div>'\n          + '<p class=\"critnote\">' + esc(t.notes[c.key]) + '<\/p><\/div>';\n      }).join('') + '<\/div>'\n    + '<div class=\"recs\"><div class=\"k\">Your answers · ' + p.name + '<\/div>'\n    + answers.map(function(a, ai){\n        var key = pi + '-' + ai;\n        var label = p.kind === 'cue' ? 'LT' : 'Q' + (ai + 1);\n        var qtext = p.kind === 'cue' ? p.cue.title : p.questions[ai].q;\n        var sample = p.kind === 'cue' ? p.sample : p.questions[ai].sample;\n        var better = isEd && t.improved && t.improved[ai] && a.text === sample.trim()\n          ? '<div class=\"improved\"><div class=\"k\">Ed’s version · say it like this<\/div><p>' + esc(t.improved[ai]) + '<\/p><\/div>'\n          : '';\n        return '<div class=\"qblock\">'\n          + '<div class=\"qbhead\"><span class=\"reclab\">' + label + '<\/span>'\n            + '<span class=\"qbq\">' + esc(qtext) + '<\/span>'\n            + '<span class=\"qbw\">' + a.words + 'w<\/span><\/div>'\n          + '<div class=\"recrow\">'\n            + '<button class=\"miniplay\" data-play=\"' + key + '\" aria-label=\"Play your answer\">'\n              + '<svg viewBox=\"0 0 24 24\"><path d=\"M8 5v14l11-7z\"/><\/svg><\/button>'\n            + '<span class=\"bar\"><span class=\"barfill\" data-bar=\"' + key + '\"><\/span><\/span>'\n            + '<span class=\"ptime\" data-ptime=\"' + key + '\">' + clock(a.secs) + '<\/span>'\n          + '<\/div>'\n          + '<p class=\"qbscript\">' + esc(a.text) + '<\/p>'\n          + marksFor(pi, ai, G)\n          + better\n          + '<\/div>';\n      }).join('')\n    + '<\/div>';\n\n  thread.appendChild(el);\n}\n\n/* The examiner speaking between parts — still the test, not the coach. */\nfunction examinerSays(text, then){\n  var turn = document.createElement('div');\n  turn.className = 'turn';\n  turn.innerHTML = '<div class=\"ask\"><div class=\"quotemark\">&rdquo;<\/div><div class=\"bubble\">'\n    + '<div class=\"tag\">Examiner<\/div>'\n    + '<div class=\"dots\" aria-label=\"The examiner is speaking\"><i><\/i><i><\/i><i><\/i><\/div>'\n    + '<\/div><\/div>';\n  thread.appendChild(turn);\n  scrollDown();\n\n  setTimeout(function(){\n    turn.querySelector('.bubble').innerHTML =\n      '<div class=\"tag\">Examiner<\/div>'\n      + '<div class=\"askrow\">'\n      + '<button class=\"hearbtn\" aria-label=\"Hear this again\"><svg viewBox=\"0 0 24 24\"><path d=\"M8 5v14l11-7z\"/><\/svg><\/button>'\n      + '<p class=\"say\">' + esc(text) + '<\/p><\/div>';\n    scrollDown();\n    if (then) setTimeout(then, 700);\n  }, 1000);\n}\n\n/* The test ends with the examiner's closing line and nothing else. The student sees only the\n   conversation they just had. Finish opens the \"who grades it?\" popup. */\nfunction endTest(){\n  state.stage = 'closing';\n  renderRail();\n  renderComposer();\n  examinerSays(SCRIPT.closing, function(){\n    state.stage = 'ended';\n    renderRail();\n    renderComposer();\n    scrollDown();\n  });\n}\n\n/* ============================ who grades it? ============================ */\nvar picker = document.getElementById('picker');\nvar lastFocus = null;\n\nfunction answerCount(){\n  return state.log.reduce(function(n, ans){ return n + ans.length; }, 0);\n}\n\nfunction openPicker(){\n  var n = answerCount();\n  document.getElementById('pickEyebrow').textContent = (ONLY === null ? 'Full test' : PARTS[0].name) + ' finished';\n  document.getElementById('pickLede').textContent = 'Your ' + n + ' answer' + (n === 1 ? ' is' : 's are')\n    + ' saved. Choose who grades ' + (ONLY === null ? 'this test' : 'this part') + '.';\n  document.getElementById('pickEdFace').innerHTML = edSvg(46);\n  lastFocus = document.activeElement;\n  picker.hidden = false;\n  document.getElementById('pickEd').focus();\n}\nfunction closePicker(){\n  picker.hidden = true;\n  if (lastFocus && lastFocus.focus) lastFocus.focus();\n}\n\ndocument.getElementById('pickEd').addEventListener('click', function(){ closePicker(); sendToEd(); });\ndocument.getElementById('pickTeacher').addEventListener('click', function(){ closePicker(); sendToTeacher(); });\ndocument.getElementById('pickCancel').addEventListener('click', closePicker);\npicker.addEventListener('click', function(e){ if (e.target === picker) closePicker(); });\ndocument.addEventListener('keydown', function(e){ if (e.key === 'Escape' && !picker.hidden) closePicker(); });\n\n/* ---------------- path 1: Ed grades it now ---------------- */\nfunction sendToEd(hold){\n  state.graders.push('ed');\n  state.stage = 'analysing';\n  renderComposer();\n\n  var el = document.createElement('div');\n  el.className = 'turn coach ed';\n  el.innerHTML = '<div class=\"edgrading\"><span class=\"edtile\" style=\"width:68px;height:68px\">' + edSvg(52) + '<\/span>'\n    + '<div><div class=\"coachhead\" style=\"margin:0 0 4px\"><span class=\"tag\">Ed is grading<\/span>'\n    + '<span class=\"pill\">Listening to ' + answerCount() + ' answers…<\/span><\/div>'\n    + '<div class=\"dots\"><i><\/i><i><\/i><i><\/i><\/div><\/div><\/div>';\n  thread.appendChild(el);\n  scrollDown();\n\n  if (hold) return;      /* preset: keep Ed mid-grading */\n  setTimeout(function(){\n    el.remove();\n    showGrading(ED);\n  }, 1800);\n}\n\n/* ---------------- path 2: the teacher grades it later ---------------- */\nfunction sendToTeacher(){\n  state.graders.push('teacher');\n  teacherStatus = 'waiting';\n\n  var el = document.createElement('div');\n  el.className = 'turn sentcard';\n  el.id = 'sentCard';\n  el.innerHTML = '<span class=\"av\">MH<\/span><div class=\"body\">'\n    + '<h2>Ms. Hạnh has received your submission<\/h2>'\n    + '<p>' + (ONLY === null ? 'Your full test' : 'Your ' + PARTS[0].name) + ' — ' + answerCount()\n    + (answerCount() === 1 ? ' recording' : ' recordings') + ' — is with your teacher. '\n    + 'You’ll get a notification when the grading is ready, usually within 48 hours. You can close this page; nothing will be lost.<\/p>'\n    + '<div class=\"steps\" id=\"sentSteps\">' + stepsHtml() + '<\/div><\/div>';\n  thread.appendChild(el);\n\n  state.finished = true;\n  state.stage = 'waiting';\n  renderRail();\n  renderComposer();\n  scrollDown();\n}\n\nfunction stepsHtml(){\n  var returned = teacherStatus === 'returned' || teacherStatus === 'shown';\n  return '<span class=\"step done\"><i><\/i>Submitted · just now<\/span>'\n    + '<span class=\"step ' + (returned ? 'done' : 'now') + '\"><i><\/i>' + (returned ? 'Graded' : 'Being graded') + '<\/span>'\n    + '<span class=\"step ' + (returned ? 'done' : '') + '\"><i><\/i>Returned to you<\/span>';\n}\n\n/* Demo only: stands in for the teacher pressing \"Send to student\" on the grading screen. */\nfunction teacherReturns(){\n  teacherStatus = 'returned';\n  var steps = document.getElementById('sentSteps');\n  if (steps) steps.innerHTML = stepsHtml();\n  var card = document.getElementById('sentCard');\n  if (card){\n    card.querySelector('h2').textContent = 'Ms. Hạnh has graded your submission';\n    card.querySelector('p').textContent = 'Your bands, her comments and every correction are ready to view.';\n  }\n  renderComposer();\n  document.getElementById('notice').hidden = false;\n  document.getElementById('noticeBtn').focus();\n}\n\nfunction openTeacherGrading(instant){\n  document.getElementById('notice').hidden = true;\n  if (teacherStatus !== 'returned') return;\n  teacherStatus = 'shown';\n  var steps = document.getElementById('sentSteps');\n  if (steps) steps.innerHTML = stepsHtml();\n  state.stage = 'analysing';\n  renderComposer();\n\n  var el = document.createElement('div');\n  el.className = 'turn coach';\n  el.innerHTML = '<div class=\"coachhead\"><span class=\"tag\">Teacher feedback<\/span>'\n    + '<span class=\"pill\">Opening your teacher’s notes…<\/span><\/div>'\n    + '<div class=\"dots\"><i><\/i><i><\/i><i><\/i><\/div>';\n  thread.appendChild(el);\n  scrollDown();\n\n  setTimeout(function(){\n    el.remove();\n    showGrading(TEACHER, instant);\n  }, instant ? 0 : 1100);\n}\ndocument.getElementById('noticeBtn').addEventListener('click', function(){ openTeacherGrading(); });\n\n/* ---------------- the graded view, same for both ---------------- */\nfunction showGrading(G, instant){\n  var mark = document.createElement('div');\n  mark.id = 'grading-' + G.key;\n  thread.appendChild(mark);\n  divider((G.key === 'ed' ? 'Graded by Ed' : 'Teacher feedback · ' + G.name), true);\n  addWrapUp(G);\n  PARTS.forEach(function(p,i){ addPartFeedback(i, G); });\n  wirePlayback();\n  state.finished = true;\n  state.stage = 'done';\n  renderRail();\n  renderComposer();\n  mark.scrollIntoView({ behavior: instant ? 'auto' : 'smooth', block:'start' });\n}\n\n/* ---------------- playback, inside the feedback panel only ----------------\n   The conversation above stays text. Every recording is replayed from here. */\n/* Question on top, its recording under it, then what the student actually said. */\nfunction recordingsHtml(pi){\n  var p = PARTS[pi], answers = state.log[pi];\n  if (!answers.length) return '';\n  return '<div class=\"recs\"><div class=\"k\">Your answers · ' + p.name + '<\/div>'\n    + answers.map(function(a, ai){\n        var key = pi + '-' + ai;\n        var label = p.kind === 'cue' ? 'LT' : 'Q' + (ai + 1);\n        var qtext = p.kind === 'cue' ? p.cue.title : p.questions[ai].q;\n        return '<div class=\"qblock\">'\n          + '<div class=\"qbhead\"><span class=\"reclab\">' + label + '<\/span>'\n            + '<span class=\"qbq\">' + esc(qtext) + '<\/span>'\n            + '<span class=\"qbw\">' + a.words + 'w<\/span>'\n            + (a.words < SHORT_ANSWER ? '<span class=\"flag\">Too short<\/span>' : '')\n          + '<\/div>'\n          + '<div class=\"recrow\">'\n            + '<button class=\"miniplay\" data-play=\"' + key + '\" aria-label=\"Play your answer\">'\n              + '<svg viewBox=\"0 0 24 24\"><path d=\"M8 5v14l11-7z\"/><\/svg><\/button>'\n            + '<span class=\"bar\"><span class=\"barfill\" data-bar=\"' + key + '\"><\/span><\/span>'\n            + '<span class=\"ptime\" data-ptime=\"' + key + '\">' + clock(a.secs) + '<\/span>'\n          + '<\/div>'\n          + '<p class=\"qbscript\">' + esc(a.text) + '<\/p>'\n          + '<\/div>';\n      }).join('')\n    + '<\/div>';\n}\n\nfunction wirePlayback(){\n  thread.querySelectorAll('[data-play]').forEach(function(btn){\n    if (btn.dataset.wired) return;\n    btn.dataset.wired = '1';\n    btn.addEventListener('click', function(){ playAnswer(btn.dataset.play); });\n  });\n}\n\nfunction playAnswer(key){\n  var bits = key.split('-'), a = state.log[+bits[0]][+bits[1]];\n  if (!a) return;\n\n  if (state.playing === key){ stopPlayback(); return; }\n  stopPlayback();\n\n  state.playing = key;\n  state.playPos = 0;\n  setPlayIcon(key, true);\n\n  state.playTimer = setInterval(function(){\n    state.playPos += 0.25;\n    var fill = thread.querySelector('[data-bar=\"' + key + '\"]');\n    var t = thread.querySelector('[data-ptime=\"' + key + '\"]');\n    if (fill) fill.style.width = Math.min(100, (state.playPos / Math.max(1, a.secs)) * 100) + '%';\n    if (t) t.textContent = clock(Math.min(a.secs, state.playPos)) + ' / ' + clock(a.secs);\n    if (state.playPos >= a.secs) stopPlayback(true);\n  }, 250);\n}\n\nfunction stopPlayback(ended){\n  clearInterval(state.playTimer);\n  state.playTimer = null;\n  var key = state.playing;\n  if (key){\n    setPlayIcon(key, false);\n    if (ended){\n      var bits = key.split('-'), a = state.log[+bits[0]][+bits[1]];\n      var fill = thread.querySelector('[data-bar=\"' + key + '\"]');\n      var t = thread.querySelector('[data-ptime=\"' + key + '\"]');\n      if (fill) fill.style.width = '0%';\n      if (t && a) t.textContent = clock(a.secs);\n    }\n  }\n  state.playing = null;\n}\n\nfunction setPlayIcon(key, playing){\n  var btn = thread.querySelector('[data-play=\"' + key + '\"]');\n  if (!btn) return;\n  btn.innerHTML = playing\n    ? '<svg viewBox=\"0 0 24 24\"><path d=\"M6 5h4v14H6zM14 5h4v14h-4z\"/><\/svg>'\n    : '<svg viewBox=\"0 0 24 24\"><path d=\"M8 5v14l11-7z\"/><\/svg>';\n}\n\nfunction addWrapUp(G){\n  var tw = 0, ts = 0, tf = 0, answered = 0, total = 0, parts = 0;\n  PARTS.forEach(function(p,i){\n    total += qCount(p);\n    if (state.log[i].length === qCount(p)) parts++;\n    state.log[i].forEach(function(a){ tw += a.words; ts += a.secs; tf += countFillers(a.text); answered++; });\n  });\n  var el = document.createElement('div');\n  var isEd = G.key === 'ed';\n  el.className = 'turn gradehead' + (isEd ? ' ed' : '');\n  el.innerHTML =\n    '<div class=\"who\">' + (isEd ? '<span class=\"edtile\">' + edSvg(52) + '<\/span>' : '') + '<div>'\n      + '<div class=\"lbl\">' + (isEd ? 'Graded by Ed' : 'Graded by your teacher') + '<\/div>'\n      + '<h2>' + esc(G.name) + '<\/h2>'\n      + '<p class=\"sub\">' + esc(G.role) + ' · marked ' + esc(G.graded) + '<br>'\n      + answered + ' answers · ' + clock(ts) + ' of speaking · ' + tw + ' words<\/p><\/div><\/div>'\n    + (PARTS.length > 1 ? '<div class=\"bands\">' + PARTS.map(function(p,i){\n        return '<div class=\"pb\"><span class=\"n\">' + p.name + '<\/span>'\n          + '<span class=\"v\">' + partBand(i, G).toFixed(1) + '<\/span><\/div>';\n      }).join('') + '<\/div>' : '')\n    + '<div class=\"overall\"><div class=\"n\">' + (PARTS.length > 1 ? 'Overall band' : PARTS[0].name + ' band') + '<\/div>'\n      + '<div class=\"v\">' + overallBand(G).toFixed(1) + '<\/div><\/div>';\n  thread.appendChild(el);\n}\n\n/* ============================ composer ============================ */\nfunction renderComposer(){\n  if (state.stage === 'analysing') return renderWaitBar();\n  if (state.finished) return renderComplete();\n  if (state.stage === 'ended') return renderEndedBar();\n  if (state.stage === 'moving' || state.stage === 'closing' || state.stage === 'analysing') return renderWaitBar();\n  if (state.stage === 'prep') return renderPrep();\n\n  var p = part(), answering = state.stage === 'answering', isCue = p.kind === 'cue';\n  var hint = state.recording ? clock(state.seconds) + (isCue ? ' / 2:00' : ' · tap to stop')\n            : (state.seconds > 0 ? clock(state.seconds) + ' saved' : 'Tap to answer');\n\n  composer.innerHTML =\n    '<div class=\"micwrap\">'\n      + '<button class=\"mic' + (state.recording ? ' live' : '') + '\" id=\"micBtn\"' + (answering ? '' : ' disabled') + ' aria-label=\"Record your answer\">'\n        + '<svg viewBox=\"0 0 24 24\"><rect x=\"9\" y=\"3\" width=\"6\" height=\"11\" rx=\"3\"/><path d=\"M5 11a7 7 0 0 0 14 0M12 18v3\"/><\/svg><\/button>'\n      + '<span class=\"miclab\" id=\"micLab\">' + (state.recording ? 'Recording' : (state.seconds > 0 ? 'Recorded' : 'Ready')) + '<\/span>'\n      + '<span class=\"michint\" id=\"micHint\">' + hint + '<\/span>'\n    + '<\/div>'\n    + '<div class=\"writer\">'\n      + '<textarea class=\"answerbox\" id=\"answer\" ' + (answering ? '' : 'disabled ')\n        + 'placeholder=\"' + (isCue ? 'Speak for one to two minutes. Your speech appears here as you talk.'\n                                   : 'Your speech appears here as you talk. You can correct it before sending.') + '\"><\/textarea>'\n      + '<div class=\"writerbar\">'\n        + '<span class=\"count\" id=\"count\">0 words<\/span>'\n        + '<button class=\"linkbtn\" id=\"sampleBtn\">Load sample answer<\/button>'\n        + '<button class=\"act\" id=\"sendBtn\" disabled>'\n        + (isCue ? 'Finish long turn' : (state.q + 1 < p.questions.length ? 'Next question' : 'Finish ' + p.name))\n        + ' <svg viewBox=\"0 0 24 24\"><path d=\"M5 12h14M13 6l6 6-6 6\"/><\/svg><\/button>'\n      + '<\/div>'\n    + '<\/div>';\n\n  var box = document.getElementById('answer');\n  box.value = state.draft || '';\n  updateCount();\n  box.addEventListener('input', function(){ state.draft = box.value; updateCount(); });\n  document.getElementById('micBtn').addEventListener('click', toggleRecord);\n  document.getElementById('sampleBtn').addEventListener('click', loadSample);\n  document.getElementById('sendBtn').addEventListener('click', send);\n}\n\nfunction renderPrep(){\n  composer.innerHTML =\n    '<div class=\"prepwrap\">'\n      + '<div class=\"prepdial' + (state.prepLeft <= 15 ? ' low' : '') + '\" id=\"prepDial\">' + clock(state.prepLeft) + '<\/div>'\n      + '<span class=\"miclab\">Preparing<\/span><span class=\"michint\">1 minute<\/span><\/div>'\n    + '<div class=\"writer\">'\n      + '<textarea class=\"answerbox\" id=\"notes\" placeholder=\"Make notes here, as you would on the paper the examiner gives you. Notes are not graded.\"><\/textarea>'\n      + '<div class=\"writerbar\"><span class=\"count\">Notes are private<\/span>'\n        + '<button class=\"act\" id=\"startBtn\">Start speaking now'\n        + ' <svg viewBox=\"0 0 24 24\"><path d=\"M5 12h14M13 6l6 6-6 6\"/><\/svg><\/button><\/div>'\n    + '<\/div>';\n  var n = document.getElementById('notes');\n  n.value = state.notes;\n  n.addEventListener('input', function(){ state.notes = n.value; });\n  document.getElementById('startBtn').addEventListener('click', endPrep);\n}\n\n/* While the examiner is moving between parts, or closing the test. */\nfunction renderWaitBar(){\n  var msg = state.stage === 'analysing'\n    ? (teacherStatus === 'shown' ? 'Loading your teacher’s feedback…' : 'Ed is grading your answers…')\n    : state.stage === 'closing' ? 'The examiner is finishing the test…'\n    : 'The examiner is moving on to the next part…';\n  composer.innerHTML =\n    '<div class=\"prepwrap\">'\n      + '<div class=\"prepdial\"><svg viewBox=\"0 0 24 24\"><path d=\"M12 6v6l4 2\"/><circle cx=\"12\" cy=\"12\" r=\"9\"/><\/svg><\/div>'\n      + '<span class=\"miclab\">Listening<\/span><span class=\"michint\">Please wait<\/span><\/div>'\n    + '<div class=\"writer\">'\n      + '<div class=\"saved\"><span>' + msg + '<\/span><\/div>'\n      + '<div class=\"writerbar\"><span class=\"count\">Your microphone is off while the examiner speaks<\/span><\/div>'\n    + '<\/div>';\n}\n\n/* The test is over. Nothing graded yet — Finish asks who should grade it. */\nfunction renderEndedBar(){\n  var tw = 0, ts = 0, n = 0;\n  state.log.forEach(function(ans){ ans.forEach(function(a){ tw += a.words; ts += a.secs; n++; }); });\n  composer.innerHTML =\n    '<div class=\"donewrap\">'\n      + '<div class=\"prepdial\"><svg viewBox=\"0 0 24 24\"><path d=\"M5 13l4 4L19 7\"/><\/svg><\/div>'\n      + '<span class=\"miclab\">Test over<\/span><span class=\"michint\">' + n + ' answers saved<\/span><\/div>'\n    + '<div class=\"writer\">'\n      + '<div class=\"saved\"><span>The interview is complete. All speaking files have been saved. '\n      + 'Press Finish to send it to Ed for instant grading, or to your teacher.<\/span>'\n        + '<button class=\"act\" id=\"finishBtn\">'\n        + '<svg viewBox=\"0 0 24 24\"><path d=\"M5 13l4 4L19 7\"/><\/svg> Finish<\/button><\/div>'\n      + '<div class=\"writerbar\"><span class=\"count\">' + tw + ' words · ' + clock(ts) + ' spoken<\/span>'\n        + '<button class=\"act ghost\" id=\"leaveBtn\">'\n        + '<svg viewBox=\"0 0 24 24\"><path d=\"M3 12a9 9 0 1 0 3-6.7M3 4v5h5\"/><\/svg> Take the test again<\/button><\/div>'\n    + '<\/div>';\n  document.getElementById('finishBtn').addEventListener('click', openPicker);\n  document.getElementById('leaveBtn').addEventListener('click', restart);\n}\n\n/* After Finish. Three cases: waiting on the teacher, teacher's grading ready to open,\n   or a grading on screen (Ed's, the teacher's, or both). */\nfunction renderComplete(){\n  var tw = 0;\n  state.log.forEach(function(ans){ ans.forEach(function(a){ tw += a.words; }); });\n  var hasEd = state.graders.indexOf('ed') > -1, hasTeacher = state.graders.indexOf('teacher') > -1;\n\n  var lab, hint, msg, main, extra = '';\n  if (teacherStatus === 'waiting'){\n    lab = 'Submitted'; hint = 'With Ms. Hạnh';\n    msg = 'Your teacher has your submission. We’ll notify you when the grading is ready.';\n    main = '<button class=\"act ghost\" id=\"topBtn\"><svg viewBox=\"0 0 24 24\"><path d=\"M12 19V5M6 11l6-6 6 6\"/><\/svg> Back to the top<\/button>';\n    extra = '<button class=\"demo\" id=\"demoBtn\">Demo: teacher sends the grading back<\/button>';\n  } else if (teacherStatus === 'returned'){\n    lab = 'Graded'; hint = 'Ready to view';\n    msg = 'Ms. Hạnh has graded your ' + (ONLY === null ? 'test' : PARTS[0].name) + '.';\n    main = '<button class=\"act\" id=\"viewBtn\">View teacher grading <svg viewBox=\"0 0 24 24\"><path d=\"M5 12h14M13 6l6 6-6 6\"/><\/svg><\/button>';\n  } else {\n    lab = 'Complete'; hint = 'Tap to practise again';\n    msg = (teacherStatus === 'shown' ? 'Your teacher’s grading is below.' : 'Ed’s grading is below.')\n      + ' Each answer shows what was marked on it.';\n    main = '<button class=\"act\" id=\"topBtn\"><svg viewBox=\"0 0 24 24\"><path d=\"M12 19V5M6 11l6-6 6 6\"/><\/svg> Back to the top<\/button>';\n    if (hasEd && !hasTeacher)\n      extra = '<button class=\"act ghost\" id=\"alsoTeacherBtn\" style=\"margin-left:0\">Also send to your teacher<\/button>';\n  }\n\n  composer.innerHTML =\n    '<div class=\"donewrap\">'\n      + (teacherStatus === 'waiting'\n          ? '<div class=\"prepdial\"><svg viewBox=\"0 0 24 24\"><path d=\"M12 6v6l4 2\"/><circle cx=\"12\" cy=\"12\" r=\"9\"/><\/svg><\/div>'\n          : '<button class=\"donebtn\" id=\"againBtn\" aria-label=\"Practise again\"><svg viewBox=\"0 0 24 24\"><path d=\"M5 13l4 4L19 7\"/><\/svg><\/button>')\n      + '<span class=\"miclab\">' + lab + '<\/span><span class=\"michint\">' + hint + '<\/span><\/div>'\n    + '<div class=\"writer\">'\n      + '<div class=\"saved\"><span>' + msg + '<\/span>' + main + '<\/div>'\n      + '<div class=\"writerbar\"><span class=\"count\">' + tw + ' words spoken<\/span>' + extra\n        + '<button class=\"act ghost\" id=\"restartBtn\">'\n        + '<svg viewBox=\"0 0 24 24\"><path d=\"M3 12a9 9 0 1 0 3-6.7M3 4v5h5\"/><\/svg> Practise from the beginning<\/button><\/div>'\n    + '<\/div>';\n\n  function on(id, fn){ var b = document.getElementById(id); if (b) b.addEventListener('click', fn); }\n  on('againBtn', restart);\n  on('restartBtn', restart);\n  on('topBtn', function(){ thread.scrollTo({ top:0, behavior:'smooth' }); });\n  on('demoBtn', teacherReturns);\n  on('viewBtn', function(){ openTeacherGrading(); });\n  on('alsoTeacherBtn', sendToTeacher);\n}\n\nfunction updateCount(){\n  var box = document.getElementById('answer');\n  if (!box) return;\n  var n = words(box.value).length;\n  document.getElementById('count').textContent = n + (n === 1 ? ' word' : ' words');\n  var b = document.getElementById('sendBtn');\n  if (b) b.disabled = n === 0;\n}\n\n/* ============================ actions ============================ */\nfunction toggleRecord(){\n  var isCue = part().kind === 'cue';\n  if (state.recording){\n    state.recording = false;\n    clearInterval(state.timer); state.timer = null;\n    var b = document.getElementById('micBtn');\n    if (b){\n      b.className = 'mic';\n      document.getElementById('micLab').textContent = 'Recorded';\n      document.getElementById('micHint').textContent = clock(state.seconds) + ' saved';\n    }\n  } else {\n    state.recording = true;\n    state.seconds = 0;\n    document.getElementById('micBtn').className = 'mic live';\n    document.getElementById('micLab').textContent = 'Recording';\n    state.timer = setInterval(function(){\n      state.seconds++;\n      var h = document.getElementById('micHint');\n      if (h) h.textContent = clock(state.seconds) + (isCue ? ' / 2:00' : ' · tap to stop');\n      if (isCue && state.seconds >= 120) toggleRecord();\n    }, 1000);\n  }\n}\n\nfunction startPrep(){\n  state.stage = 'prep';\n  state.prepLeft = PREP_SECONDS;\n  renderRail();\n  renderComposer();\n  state.prepTimer = setInterval(function(){\n    state.prepLeft--;\n    var d = document.getElementById('prepDial');\n    if (d){\n      d.textContent = clock(state.prepLeft);\n      d.className = 'prepdial' + (state.prepLeft <= 15 ? ' low' : '');\n    }\n    if (state.prepLeft <= 0) endPrep();\n  }, 1000);\n}\n\nfunction endPrep(){\n  clearInterval(state.prepTimer); state.prepTimer = null;\n  state.stage = 'answering';\n  renderRail();\n  renderComposer();\n}\n\nfunction loadSample(){\n  var p = part(), box = document.getElementById('answer');\n  box.value = p.kind === 'cue' ? p.sample : p.questions[state.q].sample;\n  state.draft = box.value;\n  if (state.seconds === 0){\n    state.seconds = Math.round(words(box.value).length / (p.kind === 'cue' ? 1.3 : 2.1));\n    document.getElementById('micLab').textContent = 'Recorded';\n    document.getElementById('micHint').textContent = clock(state.seconds) + ' saved';\n  }\n  updateCount();\n  box.focus();\n}\n\nfunction send(){\n  var p = part(), box = document.getElementById('answer');\n  var text = box.value.trim();\n  if (!text) return;\n  if (state.recording) toggleRecord();\n\n  state.log[state.p].push({ text:text, words:words(text).length, secs:state.seconds });\n  addAnswer(text, state.seconds, p.kind === 'cue' ? p.name + ' · Long turn' : p.name + ' · Question ' + (state.q + 1));\n  state.draft = '';\n  state.seconds = 0;\n\n  if (p.kind === 'questions' && state.q + 1 < p.questions.length){\n    state.q++;\n    state.stage = 'asking';\n    renderRail();\n    renderComposer();\n    setTimeout(askQuestion, 450);\n  } else if (state.p + 1 < PARTS.length){\n    nextPart();\n  } else {\n    endTest();\n  }\n}\n\n/* The examiner introduces the next part and carries straight on — no pause, no coach. */\nfunction nextPart(){\n  state.stage = 'moving';\n  renderRail();\n  renderComposer();\n\n  examinerSays(state.p === 0 ? SCRIPT.toPart2 : SCRIPT.toPart3, function(){\n    state.p++;\n    state.q = 0;\n    state.seconds = 0;\n    state.notes = '';\n    state.stage = 'asking';\n    renderRail();\n    renderComposer();\n    divider(PARTS[state.p].name + ' · ' + PARTS[state.p].desc, true);\n    if (part().kind === 'cue') setTimeout(showCue, 350);\n    else setTimeout(askQuestion, 350);\n  });\n}\n\nfunction restart(){\n  clearInterval(state.timer); clearInterval(state.prepTimer); clearInterval(state.playTimer);\n  state = { p:0, q:0, stage:'asking', recording:false, seconds:0, timer:null, prepTimer:null,\n            prepLeft:PREP_SECONDS, draft:'', notes:'', log:PARTS.map(function(){ return []; }), finished:false,\n            playing:null, playTimer:null, playPos:0, graders:[] };\n  teacherStatus = null;\n  picker.hidden = true;\n  document.getElementById('notice').hidden = true;\n  thread.innerHTML = '';\n  start();\n}\n\n/* Opens on the first part. Part 2 starts with the task card, not a question. */\nfunction start(){\n  renderRail();\n  renderComposer();\n  divider(PARTS[0].name + ' · ' + PARTS[0].desc, true);\n  if (part().kind === 'cue') setTimeout(showCue, 350);\n  else askQuestion();\n}\n\ndocument.getElementById('endBtn').addEventListener('click', restart);\ndocument.getElementById('replayBtn').addEventListener('click', scrollDown);\n\n/* ============================ preset (workflow explorer) ============================\n   The workflow page opens this screen at one moment by setting window.__AT (or #at=... in the\n   URL). The test is fast-forwarded with the sample answers, then moved to that moment:\n   finished · picker · ed-grading · ed · sent · returned · teacher. */\nvar AT = window.__AT || (location.hash.match(/at=([\\w-]+)/) || [])[1] || '';\n\nfunction staticExaminer(tag, text){\n  var turn = document.createElement('div');\n  turn.className = 'turn';\n  turn.innerHTML = '<div class=\"ask\"><div class=\"quotemark\">&rdquo;<\/div><div class=\"bubble\">'\n    + '<div class=\"tag\">' + esc(tag) + '<\/div><div class=\"askrow\">'\n    + '<button class=\"hearbtn\" aria-label=\"Hear this again\"><svg viewBox=\"0 0 24 24\"><path d=\"M8 5v14l11-7z\"/><\/svg><\/button>'\n    + '<p class=\"say\">' + esc(text) + '<\/p><\/div><\/div><\/div>';\n  thread.appendChild(turn);\n}\n\nfunction fastForward(){\n  thread.innerHTML = '';\n  PARTS.forEach(function(p, pi){\n    state.p = pi;\n    if (pi > 0) staticExaminer('Examiner', pi === 1 ? SCRIPT.toPart2 : SCRIPT.toPart3);\n    divider(p.name + ' · ' + p.desc, true);\n    if (p.kind === 'cue'){\n      var c = p.cue, el = document.createElement('div');\n      el.className = 'turn cue';\n      el.innerHTML = '<div class=\"tag\">Examiner · Candidate task card<\/div>'\n        + '<h2>' + esc(c.title) + '<\/h2><div class=\"lead\">You should say:<\/div>'\n        + '<ul>' + c.bullets.map(function(b){ return '<li>' + esc(b) + '<\/li>'; }).join('') + '<\/ul>'\n        + '<p class=\"explain\">' + esc(c.explain) + '<\/p>';\n      thread.appendChild(el);\n      var secs = Math.round(words(p.sample).length / 1.3);\n      state.log[pi].push({ text:p.sample, words:words(p.sample).length, secs:secs });\n      addAnswer(p.sample, secs, p.name + ' · Long turn');\n    } else {\n      p.questions.forEach(function(q, qi){\n        if (qi === 0 || p.questions[qi - 1].set !== q.set) divider(p.name + ' · ' + q.set);\n        staticExaminer('Examiner · ' + p.name + ' · Question ' + (qi + 1) + ' of ' + p.questions.length, q.q);\n        var secs = Math.round(words(q.sample).length / 2.1);\n        state.log[pi].push({ text:q.sample, words:words(q.sample).length, secs:secs });\n        addAnswer(q.sample, secs, p.name + ' · Question ' + (qi + 1));\n      });\n      state.q = p.questions.length - 1;\n    }\n  });\n  staticExaminer('Examiner', SCRIPT.closing);\n  state.stage = 'ended';\n  renderRail();\n  renderComposer();\n  scrollDown();\n}\n\nif (!AT) start();\nelse {\n  fastForward();\n  if (AT === 'picker') openPicker();\n  else if (AT === 'ed-grading') sendToEd(true);\n  else if (AT === 'ed'){ state.graders.push('ed'); showGrading(ED, true); }\n  else if (AT === 'sent' || AT === 'returned' || AT === 'teacher'){\n    sendToTeacher();\n    if (AT !== 'sent') teacherReturns();\n    if (AT === 'teacher') openTeacherGrading(true);\n  }\n}\n})();\n<\/script>\n","interview-send-part-2.html":"<title>IELTS mock interview send part 2<\/title>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n<link href=\"https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;1,9..40,400&display=swap\" rel=\"stylesheet\">\n\n<style>\n/* Layout: one continuous test. A fixed examiner bar, a read-only part rail, a single thread\n   that runs Part 1 -> 2 -> 3 in order, and a composer that changes role as the test moves on.\n   Pressing Finish asks who grades the test: Ed (the AI coach, instant) or the teacher\n   (submitted, then returned later). Both end in the same graded view. */\n:root{\n  color-scheme:light;\n\n  --gold:#C9A33E; --grid:rgba(28,21,8,.085);\n  --ink:#1C1508; --ink-2:#4A3D1E; --olive:#7A6A2E;\n  --cream:#F8F5EA; --cream-2:#FFFDF6; --paper:#FEFCF2;\n  --yellow:#F7DC5E; --yellow-deep:#E9C935; --yellow-soft:#FBF1B5;\n  --mint:#E3F0E0; --mint-ink:#3F6B3C;\n  --pink:#FBDDDC; --pink-ink:#A2453C;\n  --lilac:#E7E3F8; --lilac-ink:#5546A0;\n  --red:#B4443A; --red-soft:#FADFDC;\n\n  --line:2.5px solid var(--ink);\n  --line-thin:2px solid var(--ink);\n  --r-lg:20px; --r-md:14px; --r-sm:10px;\n  --shadow:0 3px 0 rgba(28,21,8,.18);\n\n  --font-ui:'Outfit',system-ui,-apple-system,sans-serif;\n  --font-read:'DM Sans',Georgia,serif;\n}\n*{box-sizing:border-box}\nhtml,body{height:100%}\nbody{\n  margin:0;font-family:var(--font-ui);color:var(--ink);\n  background-color:var(--gold);\n  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);\n  background-size:46px 46px;\n}\nbutton{font-family:inherit;color:inherit;cursor:pointer}\ntextarea{font-family:inherit}\n:focus-visible{outline:3px solid var(--ink);outline-offset:2px}\n::selection{background:var(--yellow)}\n\n.shell{\n  height:100%;max-width:1180px;margin:0 auto;\n  display:flex;flex-direction:column;gap:12px;\n  padding-inline:16px;padding-block:16px 0;\n}\n\n/* ---------------- top bar ---------------- */\n.topbar{\n  flex:none;background:var(--cream);border:var(--line);border-radius:var(--r-lg);\n  box-shadow:var(--shadow);padding:12px 14px;\n  display:flex;align-items:center;gap:12px;flex-wrap:wrap;\n}\n.iconbtn{\n  width:40px;height:40px;flex:none;border:var(--line-thin);border-radius:12px;\n  background:var(--cream-2);display:grid;place-items:center;\n}\n.iconbtn:hover{background:var(--yellow-soft)}\n.iconbtn svg{width:17px;height:17px;fill:none;stroke:var(--ink);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}\n.brand{display:flex;flex-direction:column;gap:3px;min-width:0}\n.brand h1{margin:0;font-size:19px;font-weight:800;letter-spacing:.01em;text-transform:uppercase;line-height:1}\n.brand .status{display:flex;align-items:center;gap:7px;font-size:10.5px;font-weight:700;letter-spacing:.11em;text-transform:uppercase;color:var(--olive)}\n.live{width:8px;height:8px;border-radius:999px;background:#4E9A5A;flex:none}\n.grow{flex:1;min-width:8px}\n\n.voicewrap{display:flex;flex-direction:column;align-items:center;gap:5px}\n.voicewrap .cap{font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--olive)}\n.voicerow{display:flex;align-items:center;gap:9px;flex-wrap:wrap;justify-content:center}\n.playbtn{\n  width:42px;height:38px;flex:none;border:var(--line-thin);border-radius:11px;\n  background:var(--yellow);display:grid;place-items:center;box-shadow:var(--shadow);\n}\n.playbtn:hover{background:var(--yellow-deep)}\n.playbtn svg{width:14px;height:14px;fill:var(--ink)}\n.voicesel{\n  appearance:none;font-family:var(--font-ui);font-size:14px;font-weight:600;color:var(--ink);\n  background:var(--cream-2);border:var(--line-thin);border-radius:12px;padding:9px 34px 9px 14px;\n  background-image:url(\"data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%231C1508' stroke-width='2.4' stroke-linecap='round'><path d='M6 9l6 6 6-6'/><\/svg>\");\n  background-repeat:no-repeat;background-position:right 11px center;background-size:15px;\n}\n.chip{\n  display:inline-flex;align-items:center;gap:7px;flex:none;\n  border:var(--line-thin);border-radius:11px;background:var(--cream-2);\n  padding:9px 13px;font-size:11.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;\n  font-variant-numeric:tabular-nums;\n}\n.chip svg{width:13px;height:13px;fill:none;stroke:var(--ink);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}\n.chip.counter{background:var(--yellow-soft)}\n.endbtn{\n  flex:none;border:var(--line-thin);border-radius:11px;background:var(--red-soft);color:var(--red);\n  padding:9px 18px;font-size:14px;font-weight:700;\n}\n.endbtn:hover{background:#F6CFCB}\n\n/* ---------------- part rail (read-only: the test runs in order) ---------------- */\n.rail{flex:none;display:flex;gap:10px;flex-wrap:wrap;align-items:stretch}\n.part{\n  flex:1;min-width:190px;border:var(--line-thin);border-radius:var(--r-md);\n  background:rgba(255,253,246,.5);padding:9px 12px;display:flex;flex-direction:column;gap:5px;\n}\n.part.now{background:var(--cream);border:var(--line);box-shadow:var(--shadow)}\n.part.locked{opacity:.62}\n.part .pt{display:flex;align-items:center;gap:8px}\n.part .pn{font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase}\n.part .pk{font-size:10.5px;font-weight:600;color:var(--ink-2);margin-left:auto;font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:5px}\n.part .pk svg{width:11px;height:11px;fill:none;stroke:var(--ink-2);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}\n.part .pd{font-size:11px;font-family:var(--font-read);color:var(--ink-2);line-height:1.3}\n.segs{display:flex;gap:3px}\n.seg{flex:1;height:6px;border:1.5px solid var(--ink);border-radius:999px;background:transparent}\n.seg.done{background:var(--ink)}\n.seg.now{background:var(--yellow)}\n.tick{width:16px;height:16px;border-radius:999px;border:1.8px solid var(--ink);display:grid;place-items:center;flex:none}\n.tick.on{background:var(--ink)}\n.tick svg{width:9px;height:9px;fill:none;stroke:var(--cream);stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}\n\n/* ---------------- thread ---------------- */\n.thread{\n  flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;\n  display:flex;flex-direction:column;gap:15px;padding:4px 4px 18px;scroll-behavior:smooth;\n}\n.turn{display:flex;flex-direction:column;gap:14px;animation:rise .28s ease-out}\n@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}\n\n.divider{display:flex;align-items:center;gap:12px;margin:4px 0}\n.divider span{\n  font-size:10.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--ink);\n  background:var(--yellow-soft);border:var(--line-thin);border-radius:999px;padding:5px 14px;flex:none;\n}\n.divider.part span{background:var(--ink);color:var(--cream);font-size:11.5px;padding:7px 18px}\n.divider::before,.divider::after{content:'';flex:1;height:2px;background:rgba(28,21,8,.3)}\n\n.ask{position:relative;align-self:flex-start;max-width:min(640px,92%);margin-left:22px}\n.quotemark{\n  position:absolute;left:-22px;top:-14px;width:38px;height:38px;border-radius:999px;\n  background:var(--ink);color:var(--cream);display:grid;place-items:center;\n  font-size:21px;font-weight:800;line-height:1;padding-top:9px;font-family:Georgia,serif;\n}\n.bubble{\n  background:var(--cream);border:var(--line);border-radius:var(--r-lg);\n  box-shadow:var(--shadow);padding:16px 20px;\n}\n.bubble .tag{font-size:10.5px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--olive);margin-bottom:7px}\n.bubble .say{font-family:var(--font-read);font-size:17px;line-height:1.5;margin:0}\n.askrow{display:flex;align-items:flex-start;gap:12px}\n.hearbtn{\n  flex:none;width:34px;height:34px;border:var(--line-thin);border-radius:999px;background:var(--yellow);\n  display:grid;place-items:center;margin-top:1px;\n}\n.hearbtn:hover{background:var(--yellow-deep)}\n.hearbtn svg{width:13px;height:13px;fill:var(--ink)}\n\n.dots{display:flex;gap:6px;padding:4px 0 2px}\n.dots i{width:9px;height:9px;border-radius:999px;background:var(--olive);animation:bounce 1s infinite}\n.dots i:nth-child(2){animation-delay:.16s}\n.dots i:nth-child(3){animation-delay:.32s}\n@keyframes bounce{0%,60%,100%{opacity:.3;transform:translateY(0)}30%{opacity:1;transform:translateY(-4px)}}\n\n.said{align-self:flex-end;max-width:min(620px,92%)}\n.said .bubble{background:var(--yellow-soft)}\n.said .head{display:flex;align-items:baseline;gap:14px;margin-bottom:7px}\n.said .tag{margin:0}\n.said .stamp{margin-left:auto;font-size:11.5px;font-weight:600;color:var(--ink-2);font-variant-numeric:tabular-nums}\n/* ---------------- teacher feedback ---------------- */\n.coach.teacher{background:var(--cream)}\n.pill.band{background:var(--ink);color:var(--cream);border-color:var(--ink)}\n.gradehead{\n  align-self:stretch;background:var(--ink);color:var(--cream);border:var(--line);\n  border-radius:var(--r-lg);box-shadow:var(--shadow);padding:18px 20px;\n  display:flex;align-items:center;gap:18px;flex-wrap:wrap;\n}\n.gradehead .who{flex:1;min-width:200px}\n.gradehead .lbl{font-size:10.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#C9B994}\n.gradehead h2{margin:5px 0 0;font-size:20px;font-weight:800;letter-spacing:-.01em}\n.gradehead .sub{margin:4px 0 0;font-family:var(--font-read);font-size:13.5px;color:#E7DFC9;line-height:1.5}\n.gradehead .bands{display:flex;gap:8px;flex-wrap:wrap;align-items:center}\n.gradehead .pb{\n  border:1.8px solid rgba(255,253,246,.45);border-radius:9px;padding:5px 11px;\n  display:flex;align-items:center;gap:7px;\n}\n.gradehead .pb .n{font-size:10.5px;font-weight:700;color:#C9B994}\n.gradehead .pb .v{font-size:14px;font-weight:800;font-variant-numeric:tabular-nums}\n.gradehead .overall{text-align:right;flex:none;padding-left:18px;border-left:1.8px solid rgba(255,253,246,.3)}\n.gradehead .overall .n{font-size:10.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:#C9B994}\n.gradehead .overall .v{font-size:40px;font-weight:800;line-height:1;color:var(--yellow);font-variant-numeric:tabular-nums}\n\n.critgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:4px}\n@media (max-width:700px){.critgrid{grid-template-columns:1fr}}\n.critcard{\n  border:var(--line-thin);border-left-width:6px;border-radius:var(--r-sm);\n  background:var(--paper);padding:11px 13px;\n}\n.critcard.fluency{border-left-color:#3F6B3C}\n.critcard.pron{border-left-color:#3B5BA8}\n.critcard.lexical{border-left-color:#9A6B12}\n.critcard.grammar{border-left-color:#A2453C}\n.critrow{display:flex;align-items:baseline;gap:10px}\n.critname{font-size:12px;font-weight:800;letter-spacing:-.01em;flex:1;min-width:0}\n.critband{font-size:18px;font-weight:800;flex:none;font-variant-numeric:tabular-nums}\n.critcard.fluency .critband{color:#3F6B3C}\n.critcard.pron .critband{color:#3B5BA8}\n.critcard.lexical .critband{color:#9A6B12}\n.critcard.grammar .critband{color:#A2453C}\n.critnote{margin:5px 0 0;font-family:var(--font-read);font-size:12.5px;line-height:1.5;color:var(--ink-2)}\n\n.marks{display:flex;flex-direction:column;gap:8px;margin-top:9px}\n.mark{border:1.8px solid var(--ink);border-left-width:5px;border-radius:var(--r-sm);background:var(--paper);padding:9px 11px}\n.mark.fluency{border-left-color:#3F6B3C}\n.mark.pron{border-left-color:#3B5BA8}\n.mark.lexical{border-left-color:#9A6B12}\n.mark.grammar{border-left-color:#A2453C}\n.marktop{display:flex;align-items:center;gap:8px;margin-bottom:5px}\n.mtag{font-size:9px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;padding:2px 7px;border-radius:5px;border:1.4px solid}\n.mtag.fluency{background:var(--mint);color:#3F6B3C;border-color:#3F6B3C}\n.mtag.pron{background:#E4EAF8;color:#3B5BA8;border-color:#3B5BA8}\n.mtag.lexical{background:var(--yellow-soft);color:#9A6B12;border-color:#9A6B12}\n.mtag.grammar{background:var(--pink);color:#A2453C;border-color:#A2453C}\n.mquote{font-family:var(--font-read);font-size:13.5px;font-style:italic;line-height:1.45;color:var(--ink)}\n.mfix,.mnote{font-size:12px;line-height:1.45;color:var(--ink-2);margin-top:5px}\n.mfix b,.mnote b{\n  display:block;font-size:9px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;\n  color:var(--olive);margin-bottom:2px;\n}\n.mfix{font-weight:600;color:var(--ink)}\n.noerr{margin:9px 0 0;font-size:12px;font-family:var(--font-read);color:var(--olive)}\n\n/* Each answer in the feedback panel: the question, its recording, then what was said.\n   Playback lives here, never in the conversation above. */\n.recs{margin-top:12px;border:var(--line-thin);border-radius:var(--r-sm);background:var(--cream-2);padding:12px 13px}\n.recs .k{font-size:9.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--olive);margin-bottom:9px}\n.qblock{padding:11px 0;border-bottom:1px dashed rgba(28,21,8,.16)}\n.qblock:first-of-type{padding-top:0}\n.qblock:last-child{border-bottom:none;padding-bottom:0}\n.qbhead{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:8px}\n.qbq{flex:1;min-width:140px;font-size:13px;font-weight:600;line-height:1.35}\n.qbw{font-size:11.5px;font-weight:800;flex:none;font-variant-numeric:tabular-nums}\n.qbscript{\n  margin:8px 0 0;font-family:var(--font-read);font-size:13.5px;line-height:1.6;color:var(--ink-2);\n  padding-left:11px;border-left:2.5px solid rgba(28,21,8,.22);\n}\n.recrow{display:flex;align-items:center;gap:10px}\n.reclab{\n  font-size:10.5px;font-weight:800;flex:none;min-width:34px;text-align:center;\n  background:var(--yellow-soft);border:1.6px solid var(--ink);border-radius:5px;padding:1px 6px;\n}\n.miniplay{\n  width:28px;height:28px;flex:none;border:1.8px solid var(--ink);border-radius:999px;background:var(--yellow);\n  display:grid;place-items:center;\n}\n.miniplay:hover{background:var(--yellow-deep)}\n.miniplay svg{width:10px;height:10px;fill:var(--ink)}\n.bar{flex:1;min-width:40px;height:7px;border:1.6px solid var(--ink);border-radius:999px;background:var(--paper);overflow:hidden}\n.barfill{display:block;height:100%;width:0;background:var(--ink);transition:width .2s linear}\n.ptime{font-size:11px;font-weight:600;color:var(--ink-2);flex:none;min-width:76px;text-align:right;font-variant-numeric:tabular-nums}\n\n/* ---------------- cue card ---------------- */\n.cue{\n  align-self:center;width:min(560px,96%);background:var(--paper);\n  border:3px solid var(--ink);border-radius:var(--r-lg);box-shadow:0 5px 0 rgba(28,21,8,.22);padding:20px 22px;\n}\n.cue .tag{font-size:10.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--olive)}\n.cue h2{margin:9px 0 14px;font-family:var(--font-read);font-size:19px;font-weight:500;line-height:1.4}\n.cue .lead{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--olive);margin-bottom:7px}\n.cue ul{margin:0 0 14px;padding-left:20px;display:flex;flex-direction:column;gap:6px}\n.cue li{font-family:var(--font-read);font-size:16px;line-height:1.4}\n.cue .explain{font-family:var(--font-read);font-size:16px;line-height:1.45;margin:0;padding-top:12px;border-top:2px dashed rgba(28,21,8,.3)}\n.cue .rules{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}\n.cue .rules span{\n  font-size:10.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;\n  border:var(--line-thin);border-radius:999px;padding:5px 12px;background:var(--yellow-soft);\n}\n\n/* ---------------- coach feedback ---------------- */\n.coach{\n  align-self:stretch;background:var(--mint);border:var(--line);border-radius:var(--r-lg);\n  box-shadow:var(--shadow);padding:17px 19px;\n}\n.coachhead{display:flex;align-items:center;gap:12px;margin-bottom:10px;flex-wrap:wrap}\n.coachhead .tag{font-size:11px;font-weight:800;letter-spacing:.13em;text-transform:uppercase;color:var(--mint-ink)}\n.pill{\n  margin-left:auto;border:var(--line-thin);border-radius:9px;background:var(--yellow-soft);\n  padding:5px 11px;font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;\n}\n.coach .note{font-family:var(--font-read);font-size:15.5px;line-height:1.6;font-weight:500;margin:0 0 14px}\n.panel{background:var(--paper);border:var(--line-thin);border-radius:var(--r-md);padding:15px 16px}\n.panel h3{margin:0;font-size:12.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--olive)}\n.panel .sub{font-family:var(--font-read);font-size:13px;color:var(--ink-2);margin:4px 0 0}\n.panelhead{display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap}\n.conf{\n  margin-left:auto;flex:none;border:var(--line-thin);border-radius:9px;background:var(--cream-2);\n  padding:5px 11px;font-size:11.5px;font-weight:700;font-variant-numeric:tabular-nums;\n}\n.signalslab{font-size:10.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--olive);margin:14px 0 8px}\n.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}\n@media (max-width:760px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}\n.tile{border:var(--line-thin);border-radius:var(--r-sm);padding:11px 12px;min-width:0}\n.tile .k{font-size:9.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;line-height:1.3}\n.tile .v{font-size:21px;font-weight:800;line-height:1.2;margin-top:5px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}\n.tile .v.small{font-size:15px;font-weight:700}\n.tile .n{font-size:11px;font-weight:500;margin-top:3px;font-family:var(--font-read);line-height:1.35}\n.tile.rate{background:var(--yellow-soft)}\n.tile.rate .k{color:#8A6B12}\n.tile.pause{background:var(--mint)}\n.tile.pause .k{color:var(--mint-ink)}\n.tile.filler{background:var(--pink)}\n.tile.filler .k{color:var(--pink-ink)}\n.tile.clarity{background:var(--lilac)}\n.tile.clarity .k{color:var(--lilac-ink)}\n\n.perq{margin-top:12px;border:var(--line-thin);border-radius:var(--r-sm);background:var(--cream-2);padding:12px 13px}\n.perq .k{font-size:9.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--olive);margin-bottom:8px}\n.qrow{display:flex;align-items:center;gap:10px;padding:5px 0;font-size:12.5px;border-bottom:1px dashed rgba(28,21,8,.18)}\n.qrow:last-child{border-bottom:none}\n.qrow .num{\n  font-weight:800;font-size:10.5px;background:var(--yellow-soft);border:1.6px solid var(--ink);\n  border-radius:5px;padding:1px 6px;flex:none;font-variant-numeric:tabular-nums;\n}\n.qrow .txt{flex:1;min-width:0;font-family:var(--font-read);color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}\n.qrow .w{flex:none;font-weight:700;font-variant-numeric:tabular-nums}\n.qrow .flag{flex:none;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--pink-ink);background:var(--pink);border:1.6px solid var(--ink);border-radius:5px;padding:1px 6px}\n.practise{margin-top:10px;border:var(--line-thin);border-radius:var(--r-sm);background:var(--cream-2);padding:11px 13px}\n.practise .k{font-size:9.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--olive)}\n.practise p{margin:5px 0 0;font-family:var(--font-read);font-size:13px;line-height:1.45;color:var(--ink-2)}\n\n/* ---------------- gate + wrap-up ---------------- */\n.gate{\n  align-self:stretch;background:var(--cream);border:var(--line);border-radius:var(--r-lg);\n  box-shadow:var(--shadow);padding:18px 20px;display:flex;gap:16px;align-items:center;flex-wrap:wrap;\n}\n.gate .n{\n  width:46px;height:46px;flex:none;border-radius:999px;border:var(--line);background:var(--yellow);\n  display:grid;place-items:center;font-size:17px;font-weight:800;\n}\n.gate .t{flex:1;min-width:200px}\n.gate h2{margin:0;font-size:15px;font-weight:800;letter-spacing:.02em;text-transform:uppercase}\n.gate p{margin:4px 0 0;font-family:var(--font-read);font-size:14px;line-height:1.5;color:var(--ink-2)}\n\n.wrap{\n  align-self:stretch;background:var(--cream);border:var(--line);border-radius:var(--r-lg);\n  box-shadow:var(--shadow);padding:18px 20px;\n}\n.wrap h2{margin:0;font-size:16px;font-weight:800;letter-spacing:.02em;text-transform:uppercase}\n.wrap .sub{font-family:var(--font-read);font-size:14px;color:var(--ink-2);margin:5px 0 14px;line-height:1.5}\n.sums{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}\n@media (max-width:760px){.sums{grid-template-columns:repeat(2,minmax(0,1fr))}}\n.sum{border:var(--line-thin);border-radius:var(--r-sm);background:var(--cream-2);padding:11px 12px}\n.sum .k{font-size:9.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--olive)}\n.sum .v{font-size:22px;font-weight:800;margin-top:4px;font-va
