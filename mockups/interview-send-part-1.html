<title>IELTS mock interview send part 1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;1,9..40,400&display=swap" rel="stylesheet">

<style>
/* Layout: one continuous test. A fixed examiner bar, a read-only part rail, a single thread
   that runs Part 1 -> 2 -> 3 in order, and a composer that changes role as the test moves on.
   Pressing Finish asks who grades the test: Ed (the AI coach, instant) or the teacher
   (submitted, then returned later). Both end in the same graded view. */
:root{
  color-scheme:light;

  --gold:#C9A33E; --grid:rgba(28,21,8,.085);
  --ink:#1C1508; --ink-2:#4A3D1E; --olive:#7A6A2E;
  --cream:#F8F5EA; --cream-2:#FFFDF6; --paper:#FEFCF2;
  --yellow:#F7DC5E; --yellow-deep:#E9C935; --yellow-soft:#FBF1B5;
  --mint:#E3F0E0; --mint-ink:#3F6B3C;
  --pink:#FBDDDC; --pink-ink:#A2453C;
  --lilac:#E7E3F8; --lilac-ink:#5546A0;
  --red:#B4443A; --red-soft:#FADFDC;

  --line:2.5px solid var(--ink);
  --line-thin:2px solid var(--ink);
  --r-lg:20px; --r-md:14px; --r-sm:10px;
  --shadow:0 3px 0 rgba(28,21,8,.18);

  --font-ui:'Outfit',system-ui,-apple-system,sans-serif;
  --font-read:'DM Sans',Georgia,serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;font-family:var(--font-ui);color:var(--ink);
  background-color:var(--gold);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:46px 46px;
}
button{font-family:inherit;color:inherit;cursor:pointer}
textarea{font-family:inherit}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
::selection{background:var(--yellow)}

.shell{
  height:100%;max-width:1180px;margin:0 auto;
  display:flex;flex-direction:column;gap:12px;
  padding-inline:16px;padding-block:16px 0;
}

/* ---------------- top bar ---------------- */
.topbar{
  flex:none;background:var(--cream);border:var(--line);border-radius:var(--r-lg);
  box-shadow:var(--shadow);padding:12px 14px;
  display:flex;align-items:center;gap:12px;flex-wrap:wrap;
}
.iconbtn{
  width:40px;height:40px;flex:none;border:var(--line-thin);border-radius:12px;
  background:var(--cream-2);display:grid;place-items:center;
}
.iconbtn:hover{background:var(--yellow-soft)}
.iconbtn svg{width:17px;height:17px;fill:none;stroke:var(--ink);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.brand{display:flex;flex-direction:column;gap:3px;min-width:0}
.brand h1{margin:0;font-size:19px;font-weight:800;letter-spacing:.01em;text-transform:uppercase;line-height:1}
.brand .status{display:flex;align-items:center;gap:7px;font-size:10.5px;font-weight:700;letter-spacing:.11em;text-transform:uppercase;color:var(--olive)}
.live{width:8px;height:8px;border-radius:999px;background:#4E9A5A;flex:none}
.grow{flex:1;min-width:8px}

.voicewrap{display:flex;flex-direction:column;align-items:center;gap:5px}
.voicewrap .cap{font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--olive)}
.voicerow{display:flex;align-items:center;gap:9px;flex-wrap:wrap;justify-content:center}
.playbtn{
  width:42px;height:38px;flex:none;border:var(--line-thin);border-radius:11px;
  background:var(--yellow);display:grid;place-items:center;box-shadow:var(--shadow);
}
.playbtn:hover{background:var(--yellow-deep)}
.playbtn svg{width:14px;height:14px;fill:var(--ink)}
.voicesel{
  appearance:none;font-family:var(--font-ui);font-size:14px;font-weight:600;color:var(--ink);
  background:var(--cream-2);border:var(--line-thin);border-radius:12px;padding:9px 34px 9px 14px;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%231C1508' stroke-width='2.4' stroke-linecap='round'><path d='M6 9l6 6 6-6'/></svg>");
  background-repeat:no-repeat;background-position:right 11px center;background-size:15px;
}
.chip{
  display:inline-flex;align-items:center;gap:7px;flex:none;
  border:var(--line-thin);border-radius:11px;background:var(--cream-2);
  padding:9px 13px;font-size:11.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;
  font-variant-numeric:tabular-nums;
}
.chip svg{width:13px;height:13px;fill:none;stroke:var(--ink);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.chip.counter{background:var(--yellow-soft)}
.endbtn{
  flex:none;border:var(--line-thin);border-radius:11px;background:var(--red-soft);color:var(--red);
  padding:9px 18px;font-size:14px;font-weight:700;
}
.endbtn:hover{background:#F6CFCB}

/* ---------------- part rail (read-only: the test runs in order) ---------------- */
.rail{flex:none;display:flex;gap:10px;flex-wrap:wrap;align-items:stretch}
.part{
  flex:1;min-width:190px;border:var(--line-thin);border-radius:var(--r-md);
  background:rgba(255,253,246,.5);padding:9px 12px;display:flex;flex-direction:column;gap:5px;
}
.part.now{background:var(--cream);border:var(--line);box-shadow:var(--shadow)}
.part.locked{opacity:.62}
.part .pt{display:flex;align-items:center;gap:8px}
.part .pn{font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase}
.part .pk{font-size:10.5px;font-weight:600;color:var(--ink-2);margin-left:auto;font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:5px}
.part .pk svg{width:11px;height:11px;fill:none;stroke:var(--ink-2);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.part .pd{font-size:11px;font-family:var(--font-read);color:var(--ink-2);line-height:1.3}
.segs{display:flex;gap:3px}
.seg{flex:1;height:6px;border:1.5px solid var(--ink);border-radius:999px;background:transparent}
.seg.done{background:var(--ink)}
.seg.now{background:var(--yellow)}
.tick{width:16px;height:16px;border-radius:999px;border:1.8px solid var(--ink);display:grid;place-items:center;flex:none}
.tick.on{background:var(--ink)}
.tick svg{width:9px;height:9px;fill:none;stroke:var(--cream);stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}

/* ---------------- thread ---------------- */
.thread{
  flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;
  display:flex;flex-direction:column;gap:15px;padding:4px 4px 18px;scroll-behavior:smooth;
}
.turn{display:flex;flex-direction:column;gap:14px;animation:rise .28s ease-out}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

.divider{display:flex;align-items:center;gap:12px;margin:4px 0}
.divider span{
  font-size:10.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--ink);
  background:var(--yellow-soft);border:var(--line-thin);border-radius:999px;padding:5px 14px;flex:none;
}
.divider.part span{background:var(--ink);color:var(--cream);font-size:11.5px;padding:7px 18px}
.divider::before,.divider::after{content:'';flex:1;height:2px;background:rgba(28,21,8,.3)}

.ask{position:relative;align-self:flex-start;max-width:min(640px,92%);margin-left:22px}
.quotemark{
  position:absolute;left:-22px;top:-14px;width:38px;height:38px;border-radius:999px;
  background:var(--ink);color:var(--cream);display:grid;place-items:center;
  font-size:21px;font-weight:800;line-height:1;padding-top:9px;font-family:Georgia,serif;
}
.bubble{
  background:var(--cream);border:var(--line);border-radius:var(--r-lg);
  box-shadow:var(--shadow);padding:16px 20px;
}
.bubble .tag{font-size:10.5px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--olive);margin-bottom:7px}
.bubble .say{font-family:var(--font-read);font-size:17px;line-height:1.5;margin:0}
.askrow{display:flex;align-items:flex-start;gap:12px}
.hearbtn{
  flex:none;width:34px;height:34px;border:var(--line-thin);border-radius:999px;background:var(--yellow);
  display:grid;place-items:center;margin-top:1px;
}
.hearbtn:hover{background:var(--yellow-deep)}
.hearbtn svg{width:13px;height:13px;fill:var(--ink)}

.dots{display:flex;gap:6px;padding:4px 0 2px}
.dots i{width:9px;height:9px;border-radius:999px;background:var(--olive);animation:bounce 1s infinite}
.dots i:nth-child(2){animation-delay:.16s}
.dots i:nth-child(3){animation-delay:.32s}
@keyframes bounce{0%,60%,100%{opacity:.3;transform:translateY(0)}30%{opacity:1;transform:translateY(-4px)}}

.said{align-self:flex-end;max-width:min(620px,92%)}
.said .bubble{background:var(--yellow-soft)}
.said .head{display:flex;align-items:baseline;gap:14px;margin-bottom:7px}
.said .tag{margin:0}
.said .stamp{margin-left:auto;font-size:11.5px;font-weight:600;color:var(--ink-2);font-variant-numeric:tabular-nums}
/* ---------------- teacher feedback ---------------- */
.coach.teacher{background:var(--cream)}
.pill.band{background:var(--ink);color:var(--cream);border-color:var(--ink)}
.gradehead{
  align-self:stretch;background:var(--ink);color:var(--cream);border:var(--line);
  border-radius:var(--r-lg);box-shadow:var(--shadow);padding:18px 20px;
  display:flex;align-items:center;gap:18px;flex-wrap:wrap;
}
.gradehead .who{flex:1;min-width:200px}
.gradehead .lbl{font-size:10.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#C9B994}
.gradehead h2{margin:5px 0 0;font-size:20px;font-weight:800;letter-spacing:-.01em}
.gradehead .sub{margin:4px 0 0;font-family:var(--font-read);font-size:13.5px;color:#E7DFC9;line-height:1.5}
.gradehead .bands{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.gradehead .pb{
  border:1.8px solid rgba(255,253,246,.45);border-radius:9px;padding:5px 11px;
  display:flex;align-items:center;gap:7px;
}
.gradehead .pb .n{font-size:10.5px;font-weight:700;color:#C9B994}
.gradehead .pb .v{font-size:14px;font-weight:800;font-variant-numeric:tabular-nums}
.gradehead .overall{text-align:right;flex:none;padding-left:18px;border-left:1.8px solid rgba(255,253,246,.3)}
.gradehead .overall .n{font-size:10.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:#C9B994}
.gradehead .overall .v{font-size:40px;font-weight:800;line-height:1;color:var(--yellow);font-variant-numeric:tabular-nums}

.critgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:4px}
@media (max-width:700px){.critgrid{grid-template-columns:1fr}}
.critcard{
  border:var(--line-thin);border-left-width:6px;border-radius:var(--r-sm);
  background:var(--paper);padding:11px 13px;
}
.critcard.fluency{border-left-color:#3F6B3C}
.critcard.pron{border-left-color:#3B5BA8}
.critcard.lexical{border-left-color:#9A6B12}
.critcard.grammar{border-left-color:#A2453C}
.critrow{display:flex;align-items:baseline;gap:10px}
.critname{font-size:12px;font-weight:800;letter-spacing:-.01em;flex:1;min-width:0}
.critband{font-size:18px;font-weight:800;flex:none;font-variant-numeric:tabular-nums}
.critcard.fluency .critband{color:#3F6B3C}
.critcard.pron .critband{color:#3B5BA8}
.critcard.lexical .critband{color:#9A6B12}
.critcard.grammar .critband{color:#A2453C}
.critnote{margin:5px 0 0;font-family:var(--font-read);font-size:12.5px;line-height:1.5;color:var(--ink-2)}

.marks{display:flex;flex-direction:column;gap:8px;margin-top:9px}
.mark{border:1.8px solid var(--ink);border-left-width:5px;border-radius:var(--r-sm);background:var(--paper);padding:9px 11px}
.mark.fluency{border-left-color:#3F6B3C}
.mark.pron{border-left-color:#3B5BA8}
.mark.lexical{border-left-color:#9A6B12}
.mark.grammar{border-left-color:#A2453C}
.marktop{display:flex;align-items:center;gap:8px;margin-bottom:5px}
.mtag{font-size:9px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;padding:2px 7px;border-radius:5px;border:1.4px solid}
.mtag.fluency{background:var(--mint);color:#3F6B3C;border-color:#3F6B3C}
.mtag.pron{background:#E4EAF8;color:#3B5BA8;border-color:#3B5BA8}
.mtag.lexical{background:var(--yellow-soft);color:#9A6B12;border-color:#9A6B12}
.mtag.grammar{background:var(--pink);color:#A2453C;border-color:#A2453C}
.mquote{font-family:var(--font-read);font-size:13.5px;font-style:italic;line-height:1.45;color:var(--ink)}
.mfix,.mnote{font-size:12px;line-height:1.45;color:var(--ink-2);margin-top:5px}
.mfix b,.mnote b{
  display:block;font-size:9px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;
  color:var(--olive);margin-bottom:2px;
}
.mfix{font-weight:600;color:var(--ink)}
.noerr{margin:9px 0 0;font-size:12px;font-family:var(--font-read);color:var(--olive)}

/* Each answer in the feedback panel: the question, its recording, then what was said.
   Playback lives here, never in the conversation above. */
.recs{margin-top:12px;border:var(--line-thin);border-radius:var(--r-sm);background:var(--cream-2);padding:12px 13px}
.recs .k{font-size:9.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--olive);margin-bottom:9px}
.qblock{padding:11px 0;border-bottom:1px dashed rgba(28,21,8,.16)}
.qblock:first-of-type{padding-top:0}
.qblock:last-child{border-bottom:none;padding-bottom:0}
.qbhead{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:8px}
.qbq{flex:1;min-width:140px;font-size:13px;font-weight:600;line-height:1.35}
.qbw{font-size:11.5px;font-weight:800;flex:none;font-variant-numeric:tabular-nums}
.qbscript{
  margin:8px 0 0;font-family:var(--font-read);font-size:13.5px;line-height:1.6;color:var(--ink-2);
  padding-left:11px;border-left:2.5px solid rgba(28,21,8,.22);
}
.recrow{display:flex;align-items:center;gap:10px}
.reclab{
  font-size:10.5px;font-weight:800;flex:none;min-width:34px;text-align:center;
  background:var(--yellow-soft);border:1.6px solid var(--ink);border-radius:5px;padding:1px 6px;
}
.miniplay{
  width:28px;height:28px;flex:none;border:1.8px solid var(--ink);border-radius:999px;background:var(--yellow);
  display:grid;place-items:center;
}
.miniplay:hover{background:var(--yellow-deep)}
.miniplay svg{width:10px;height:10px;fill:var(--ink)}
.bar{flex:1;min-width:40px;height:7px;border:1.6px solid var(--ink);border-radius:999px;background:var(--paper);overflow:hidden}
.barfill{display:block;height:100%;width:0;background:var(--ink);transition:width .2s linear}
.ptime{font-size:11px;font-weight:600;color:var(--ink-2);flex:none;min-width:76px;text-align:right;font-variant-numeric:tabular-nums}

/* ---------------- cue card ---------------- */
.cue{
  align-self:center;width:min(560px,96%);background:var(--paper);
  border:3px solid var(--ink);border-radius:var(--r-lg);box-shadow:0 5px 0 rgba(28,21,8,.22);padding:20px 22px;
}
.cue .tag{font-size:10.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--olive)}
.cue h2{margin:9px 0 14px;font-family:var(--font-read);font-size:19px;font-weight:500;line-height:1.4}
.cue .lead{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--olive);margin-bottom:7px}
.cue ul{margin:0 0 14px;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.cue li{font-family:var(--font-read);font-size:16px;line-height:1.4}
.cue .explain{font-family:var(--font-read);font-size:16px;line-height:1.45;margin:0;padding-top:12px;border-top:2px dashed rgba(28,21,8,.3)}
.cue .rules{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}
.cue .rules span{
  font-size:10.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;
  border:var(--line-thin);border-radius:999px;padding:5px 12px;background:var(--yellow-soft);
}

/* ---------------- coach feedback ---------------- */
.coach{
  align-self:stretch;background:var(--mint);border:var(--line);border-radius:var(--r-lg);
  box-shadow:var(--shadow);padding:17px 19px;
}
.coachhead{display:flex;align-items:center;gap:12px;margin-bottom:10px;flex-wrap:wrap}
.coachhead .tag{font-size:11px;font-weight:800;letter-spacing:.13em;text-transform:uppercase;color:var(--mint-ink)}
.pill{
  margin-left:auto;border:var(--line-thin);border-radius:9px;background:var(--yellow-soft);
  padding:5px 11px;font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
}
.coach .note{font-family:var(--font-read);font-size:15.5px;line-height:1.6;font-weight:500;margin:0 0 14px}
.panel{background:var(--paper);border:var(--line-thin);border-radius:var(--r-md);padding:15px 16px}
.panel h3{margin:0;font-size:12.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--olive)}
.panel .sub{font-family:var(--font-read);font-size:13px;color:var(--ink-2);margin:4px 0 0}
.panelhead{display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap}
.conf{
  margin-left:auto;flex:none;border:var(--line-thin);border-radius:9px;background:var(--cream-2);
  padding:5px 11px;font-size:11.5px;font-weight:700;font-variant-numeric:tabular-nums;
}
.signalslab{font-size:10.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--olive);margin:14px 0 8px}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:760px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tile{border:var(--line-thin);border-radius:var(--r-sm);padding:11px 12px;min-width:0}
.tile .k{font-size:9.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;line-height:1.3}
.tile .v{font-size:21px;font-weight:800;line-height:1.2;margin-top:5px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.tile .v.small{font-size:15px;font-weight:700}
.tile .n{font-size:11px;font-weight:500;margin-top:3px;font-family:var(--font-read);line-height:1.35}
.tile.rate{background:var(--yellow-soft)}
.tile.rate .k{color:#8A6B12}
.tile.pause{background:var(--mint)}
.tile.pause .k{color:var(--mint-ink)}
.tile.filler{background:var(--pink)}
.tile.filler .k{color:var(--pink-ink)}
.tile.clarity{background:var(--lilac)}
.tile.clarity .k{color:var(--lilac-ink)}

.perq{margin-top:12px;border:var(--line-thin);border-radius:var(--r-sm);background:var(--cream-2);padding:12px 13px}
.perq .k{font-size:9.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--olive);margin-bottom:8px}
.qrow{display:flex;align-items:center;gap:10px;padding:5px 0;font-size:12.5px;border-bottom:1px dashed rgba(28,21,8,.18)}
.qrow:last-child{border-bottom:none}
.qrow .num{
  font-weight:800;font-size:10.5px;background:var(--yellow-soft);border:1.6px solid var(--ink);
  border-radius:5px;padding:1px 6px;flex:none;font-variant-numeric:tabular-nums;
}
.qrow .txt{flex:1;min-width:0;font-family:var(--font-read);color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qrow .w{flex:none;font-weight:700;font-variant-numeric:tabular-nums}
.qrow .flag{flex:none;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--pink-ink);background:var(--pink);border:1.6px solid var(--ink);border-radius:5px;padding:1px 6px}
.practise{margin-top:10px;border:var(--line-thin);border-radius:var(--r-sm);background:var(--cream-2);padding:11px 13px}
.practise .k{font-size:9.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--olive)}
.practise p{margin:5px 0 0;font-family:var(--font-read);font-size:13px;line-height:1.45;color:var(--ink-2)}

/* ---------------- gate + wrap-up ---------------- */
.gate{
  align-self:stretch;background:var(--cream);border:var(--line);border-radius:var(--r-lg);
  box-shadow:var(--shadow);padding:18px 20px;display:flex;gap:16px;align-items:center;flex-wrap:wrap;
}
.gate .n{
  width:46px;height:46px;flex:none;border-radius:999px;border:var(--line);background:var(--yellow);
  display:grid;place-items:center;font-size:17px;font-weight:800;
}
.gate .t{flex:1;min-width:200px}
.gate h2{margin:0;font-size:15px;font-weight:800;letter-spacing:.02em;text-transform:uppercase}

function part(){ return PARTS[state.p]; }
function qCount(p){ return p.kind === 'cue' ? 1 : p.questions.length; }
function words(t){ return t.trim().split(/\s+/).filter(Boolean); }
function clock(s){ return Math.floor(s/60) + ':' + String(Math.floor(s%60)).padStart(2,'0'); }
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function scrollDown(){ requestAnimationFrame(function(){ thread.scrollTop = thread.scrollHeight; }); }
function countFillers(text){
  var low = ' ' + text.toLowerCase().replace(/[.,!?;:]/g,' ') + ' ', n = 0;
  FILLERS.forEach(function(f){
    var m = low.match(new RegExp('\\s' + f.replace(/ /g,'\\s+') + '\\s','g'));
    if (m) n += m.length;
  });
  return n;
}

/* ============================ rail ============================ */
function renderRail(){
  document.getElementById('rail').innerHTML = PARTS.map(function(p,i){
    var total = qCount(p), done = state.log[i].length;
    var locked = i > state.p;
    var cls = (i === state.p && !state.finished ? 'now' : '') + (locked ? ' locked' : '');
    var segs = '';
    for (var k = 0; k < total; k++){
      segs += '<span class="seg ' + (k < done ? 'done' : (i === state.p && k === state.q && !state.finished ? 'now' : '')) + '"></span>';
    }
    return '<div class="part ' + cls + '">'
      + '<div class="pt"><span class="tick' + (done === total ? ' on' : '') + '">'
        + (done === total ? '<svg viewBox="0 0 24 24"><path d="M5 13l4 4L19 7"/></svg>' : '') + '</span>'
      + '<span class="pn">' + p.name + '</span>'
      + '<span class="pk">' + (locked
          ? '<svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg> Locked'
          : done + '/' + total) + '</span></div>'
      + '<div class="segs">' + segs + '</div>'
      + '<div class="pd">' + p.desc + '</div></div>';
  }).join('');

  var p = part(), txt;
  if (state.finished) txt = 'Test complete';
  else if (state.stage === 'ended') txt = 'Test over';
  else if (state.stage === 'moving' || state.stage === 'closing') txt = 'Examiner speaking';
  else if (p.kind === 'cue') txt = p.name + ' · long turn';
  else txt = p.name + ' · ' + Math.min(state.q + 1, p.questions.length) + '/' + p.questions.length;
  document.getElementById('posText').textContent = txt;
  document.getElementById('brandSub').textContent = state.finished
    ? (ONLY === null ? 'Full test' : p.name) + ' · ' + (teacherStatus === 'waiting' ? 'with your teacher' : 'complete')
    : (ONLY === null ? '' : 'Practising ') + p.name + ' · ' + p.desc + ' · ' + p.minutes;
}

function divider(label, big){
  var d = document.createElement('div');
  d.className = 'divider' + (big ? ' part' : '');
  d.innerHTML = '<span>' + esc(label) + '</span>';
  thread.appendChild(d);
}

function askQuestion(){
  var p = part(), q = p.questions[state.q], n = state.q + 1;
  if (state.q === 0 || p.questions[state.q - 1].set !== q.set) divider(p.name + ' · ' + q.set);

  var turn = document.createElement('div');
  turn.className = 'turn';
  turn.innerHTML = '<div class="ask"><div class="quotemark">&rdquo;</div><div class="bubble">'
    + '<div class="tag">Examiner · ' + p.name + ' · Question ' + n + ' of ' + p.questions.length + '</div>'
    + '<div class="dots" aria-label="The examiner is speaking"><i></i><i></i><i></i></div>'
    + '</div></div>';
  thread.appendChild(turn);
  scrollDown();

  setTimeout(function(){
    turn.querySelector('.bubble').innerHTML =
      '<div class="tag">Examiner · ' + p.name + ' · Question ' + n + ' of ' + p.questions.length + '</div>'
      + '<div class="askrow">'
      + '<button class="hearbtn" aria-label="Hear the question again"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></button>'
      + '<p class="say">' + esc(q.q) + '</p></div>';
    state.stage = 'answering';
    renderComposer();
    scrollDown();
  }, 950);
}

function showCue(){
  var p = part(), c = p.cue;
  var el = document.createElement('div');
  el.className = 'turn cue';
  el.innerHTML = '<div class="tag">Examiner · Candidate task card</div>'
    + '<h2>' + esc(c.title) + '</h2>'
    + '<div class="lead">You should say:</div>'
    + '<ul>' + c.bullets.map(function(b){ return '<li>' + esc(b) + '</li>'; }).join('') + '</ul>'
    + '<p class="explain">' + esc(c.explain) + '</p>'
    + '<div class="rules"><span>1 minute to prepare</span><span>Speak for 1–2 minutes</span><span>Notes allowed</span></div>';
  thread.appendChild(el);
  scrollDown();
  startPrep();
}

function addAnswer(text, secs, label){
  var el = document.createElement('div');
  el.className = 'turn said';
  el.innerHTML = '<div class="bubble"><div class="head">'
    + '<div class="tag">You · ' + esc(label) + '</div>'
    + '<span class="stamp">' + clock(secs) + '</span></div>'
    + '<p class="say">' + esc(text) + '</p></div>';
  thread.appendChild(el);
  scrollDown();
}

function round5(v){ return Math.round(v * 2) / 2; }
function partBand(pi, G){
  var b = G.parts[pi].bands;
  var vals = CRIT.map(function(c){ return b[c.key]; });
  return round5(vals.reduce(function(a,x){ return a + x; }, 0) / vals.length);
}
function overallBand(G){
  var vals = PARTS.map(function(p,i){ return partBand(i, G); });
  return round5(vals.reduce(function(a,x){ return a + x; }, 0) / vals.length);
}
function critName(cls){
  var c = CRIT.filter(function(x){ return x.cls === cls; })[0];
  return c ? c.name : cls;
}

/* The grader's marks for one answer, shown under that answer. */
function marksFor(pi, ai, G){
  var list = G.parts[pi].errors.filter(function(e){ return e.q === ai; });
  if (!list.length) return '<p class="noerr">No errors marked in this answer.</p>';
  return '<div class="marks">' + list.map(function(e){
    return '<div class="mark ' + e.cat + '">'
      + '<div class="marktop"><span class="mtag ' + e.cat + '">' + critName(e.cat) + '</span></div>'
      + '<div class="mquote">“' + esc(e.quote) + '”</div>'
      + '<div class="mfix"><b>Say it as</b>' + esc(e.fix) + '</div>'
      + '<div class="mnote"><b>' + esc(G.name) + '</b>' + esc(e.note) + '</div>'
      + '</div>';
  }).join('') + '</div>';
}

        var sample = p.kind === 'cue' ? p.sample : p.questions[ai].sample;
        var better = isEd && t.improved && t.improved[ai] && a.text === sample.trim()
          ? '<div class="improved"><div class="k">Ed’s version · say it like this</div><p>' + esc(t.improved[ai]) + '</p></div>'
          : '';
        return '<div class="qblock">'
          + '<div class="qbhead"><span class="reclab">' + label + '</span>'
            + '<span class="qbq">' + esc(qtext) + '</span>'
            + '<span class="qbw">' + a.words + 'w</span></div>'
          + '<div class="recrow">'
            + '<button class="miniplay" data-play="' + key + '" aria-label="Play your answer">'
              + '<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></button>'
            + '<span class="bar"><span class="barfill" data-bar="' + key + '"></span></span>'
            + '<span class="ptime" data-ptime="' + key + '">' + clock(a.secs) + '</span>'
          + '</div>'
          + '<p class="qbscript">' + esc(a.text) + '</p>'
          + marksFor(pi, ai, G)
          + better
          + '</div>';
      }).join('')
    + '</div>';

  thread.appendChild(el);
}

/* The examiner speaking between parts — still the test, not the coach. */
function examinerSays(text, then){
  var turn = document.createElement('div');
  turn.className = 'turn';
  turn.innerHTML = '<div class="ask"><div class="quotemark">&rdquo;</div><div class="bubble">'
    + '<div class="tag">Examiner</div>'
    + '<div class="dots" aria-label="The examiner is speaking"><i></i><i></i><i></i></div>'
    + '</div></div>';
  thread.appendChild(turn);
  scrollDown();

  setTimeout(function(){
    turn.querySelector('.bubble').innerHTML =
      '<div class="tag">Examiner</div>'
      + '<div class="askrow">'
      + '<button class="hearbtn" aria-label="Hear this again"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></button>'
      + '<p class="say">' + esc(text) + '</p></div>';
    scrollDown();
    if (then) setTimeout(then, 700);
  }, 1000);
}

/* The test ends with the examiner's closing line and nothing else. The student sees only the
   conversation they just had. Finish opens the "who grades it?" popup. */
function endTest(){
  state.stage = 'closing';
  renderRail();
  renderComposer();
  examinerSays(SCRIPT.closing, function(){
    state.stage = 'ended';
    renderRail();
    renderComposer();
    scrollDown();
  });
}

/* ============================ who grades it? ============================ */
var picker = document.getElementById('picker');
var lastFocus = null;

function answerCount(){
  return state.log.reduce(function(n, ans){ return n + ans.length; }, 0);
}

function openPicker(){
  var n = answerCount();
  document.getElementById('pickEyebrow').textContent = (ONLY === null ? 'Full test' : PARTS[0].name) + ' finished';
  document.getElementById('pickLede').textContent = 'Your ' + n + ' answer' + (n === 1 ? ' is' : 's are')
    + ' saved. Choose who grades ' + (ONLY === null ? 'this test' : 'this part') + '.';
  document.getElementById('pickEdFace').innerHTML = edSvg(46);
  lastFocus = document.activeElement;
  picker.hidden = false;
  document.getElementById('pickEd').focus();
}
function closePicker(){
  picker.hidden = true;
  if (lastFocus && lastFocus.focus) lastFocus.focus();
}

document.getElementById('pickEd').addEventListener('click', function(){ closePicker(); sendToEd(); });
document.getElementById('pickTeacher').addEventListener('click', function(){ closePicker(); sendToTeacher(); });
document.getElementById('pickCancel').addEventListener('click', closePicker);
picker.addEventListener('click', function(e){ if (e.target === picker) closePicker(); });
document.addEventListener('keydown', function(e){ if (e.key === 'Escape' && !picker.hidden) closePicker(); });

/* ---------------- path 1: Ed grades it now ---------------- */
function sendToEd(){
  state.graders.push('ed');
  state.stage = 'analysing';
  renderComposer();

  var el = document.createElement('div');
  el.className = 'turn coach ed';
  el.innerHTML = '<div class="edgrading"><span class="edtile" style="width:68px;height:68px">' + edSvg(52) + '</span>'
    + '<div><div class="coachhead" style="margin:0 0 4px"><span class="tag">Ed is grading</span>'
    + '<span class="pill">Listening to ' + answerCount() + ' answers…</span></div>'
    + '<div class="dots"><i></i><i></i><i></i></div></div></div>';
  thread.appendChild(el);
  scrollDown();

  setTimeout(function(){
    el.remove();
    showGrading(ED);
  }, 1800);
}

/* ---------------- path 2: the teacher grades it later ---------------- */
function sendToTeacher(){
  state.graders.push('teacher');
  teacherStatus = 'waiting';

  var el = document.createElement('div');
  el.className = 'turn sentcard';
  el.id = 'sentCard';
  el.innerHTML = '<span class="av">MH</span><div class="body">'
    + '<h2>Ms. Hạnh has received your submission</h2>'
    + '<p>' + (ONLY === null ? 'Your full test' : 'Your ' + PARTS[0].name) + ' — ' + answerCount()
    + (answerCount() === 1 ? ' recording' : ' recordings') + ' — is with your teacher. '
    + 'You’ll get a notification when the grading is ready, usually within 48 hours. You can close this page; nothing will be lost.</p>'
    + '<div class="steps" id="sentSteps">' + stepsHtml() + '</div></div>';
  thread.appendChild(el);

  state.finished = true;
  state.stage = 'waiting';
  renderRail();
  renderComposer();
  scrollDown();
}

function stepsHtml(){
  var returned = teacherStatus === 'returned' || teacherStatus === 'shown';
  return '<span class="step done"><i></i>Submitted · just now</span>'
    + '<span class="step ' + (returned ? 'done' : 'now') + '"><i></i>' + (returned ? 'Graded' : 'Being graded') + '</span>'
    + '<span class="step ' + (returned ? 'done' : '') + '"><i></i>Returned to you</span>';
}

/* Demo only: stands in for the teacher pressing "Send to student" on the grading screen. */
function teacherReturns(){
  teacherStatus = 'returned';
  var steps = document.getElementById('sentSteps');
  if (steps) steps.innerHTML = stepsHtml();
  var card = document.getElementById('sentCard');
  if (card){
    card.querySelector('h2').textContent = 'Ms. Hạnh has graded your submission';
    card.querySelector('p').textContent = 'Your bands, her comments and every correction are ready to view.';
  }
  renderComposer();
  document.getElementById('notice').hidden = false;
  document.getElementById('noticeBtn').focus();
}

function openTeacherGrading(){
  document.getElementById('notice').hidden = true;
  if (teacherStatus !== 'returned') return;
  teacherStatus = 'shown';
  var steps = document.getElementById('sentSteps');
  if (steps) steps.innerHTML = stepsHtml();
  state.stage = 'analysing';
  renderComposer();

  var el = document.createElement('div');
  el.className = 'turn coach';
  el.innerHTML = '<div class="coachhead"><span class="tag">Teacher feedback</span>'
    + '<span class="pill">Opening your teacher’s notes…</span></div>'
    + '<div class="dots"><i></i><i></i><i></i></div>';
  thread.appendChild(el);
  scrollDown();

  setTimeout(function(){
    el.remove();
    showGrading(TEACHER);
  }, 1100);
}
document.getElementById('noticeBtn').addEventListener('click', openTeacherGrading);

/* ---------------- the graded view, same for both ---------------- */
function showGrading(G){
  var mark = document.createElement('div');
  mark.id = 'grading-' + G.key;
  thread.appendChild(mark);
  divider((G.key === 'ed' ? 'Graded by Ed' : 'Teacher feedback · ' + G.name), true);
  addWrapUp(G);
  PARTS.forEach(function(p,i){ addPartFeedback(i, G); });
  wirePlayback();
  state.finished = true;
  state.stage = 'done';
  renderRail();
  renderComposer();
  mark.scrollIntoView({ behavior:'smooth', block:'start' });
}

/* ---------------- playback, inside the feedback panel only ----------------
   The conversation above stays text. Every recording is replayed from here. */
/* Question on top, its recording under it, then what the student actually said. */
function recordingsHtml(pi){
  var p = PARTS[pi], answers = state.log[pi];
  if (!answers.length) return '';
  return '<div class="recs"><div class="k">Your answers · ' + p.name + '</div>'
    + answers.map(function(a, ai){
        var key = pi + '-' + ai;
        var label = p.kind === 'cue' ? 'LT' : 'Q' + (ai + 1);
        var qtext = p.kind === 'cue' ? p.cue.title : p.questions[ai].q;
        return '<div class="qblock">'
          + '<div class="qbhead"><span class="reclab">' + label + '</span>'
            + '<span class="qbq">' + esc(qtext) + '</span>'
            + '<span class="qbw">' + a.words + 'w</span>'
            + (a.words < SHORT_ANSWER ? '<span class="flag">Too short</span>' : '')
          + '</div>'
          + '<div class="recrow">'
            + '<button class="miniplay" data-play="' + key + '" aria-label="Play your answer">'
              + '<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></button>'
            + '<span class="bar"><span class="barfill" data-bar="' + key + '"></span></span>'
            + '<span class="ptime" data-ptime="' + key + '">' + clock(a.secs) + '</span>'
          + '</div>'
          + '<p class="qbscript">' + esc(a.text) + '</p>'
          + '</div>';
      }).join('')
    + '</div>';
}

function wirePlayback(){
  thread.querySelectorAll('[data-play]').forEach(function(btn){
    if (btn.dataset.wired) return;
    btn.dataset.wired = '1';
    btn.addEventListener('click', function(){ playAnswer(btn.dataset.play); });
  });
}

function playAnswer(key){
  var bits = key.split('-'), a = state.log[+bits[0]][+bits[1]];
  if (!a) return;

  if (state.playing === key){ stopPlayback(); return; }
  stopPlayback();

  state.playing = key;
  state.playPos = 0;
  setPlayIcon(key, true);

  state.playTimer = setInterval(function(){
    state.playPos += 0.25;
    var fill = thread.querySelector('[data-bar="' + key + '"]');
    var t = thread.querySelector('[data-ptime="' + key + '"]');
    if (fill) fill.style.width = Math.min(100, (state.playPos / Math.max(1, a.secs)) * 100) + '%';
    if (t) t.textContent = clock(Math.min(a.secs, state.playPos)) + ' / ' + clock(a.secs);
    if (state.playPos >= a.secs) stopPlayback(true);
  }, 250);
}

function stopPlayback(ended){
  clearInterval(state.playTimer);
  state.playTimer = null;
  var key = state.playing;
  if (key){
    setPlayIcon(key, false);
    if (ended){
      var bits = key.split('-'), a = state.log[+bits[0]][+bits[1]];
      var fill = thread.querySelector('[data-bar="' + key + '"]');
      var t = thread.querySelector('[data-ptime="' + key + '"]');
      if (fill) fill.style.width = '0%';
      if (t && a) t.textContent = clock(a.secs);
    }
  }
  state.playing = null;
}

function setPlayIcon(key, playing){
  var btn = thread.querySelector('[data-play="' + key + '"]');
  if (!btn) return;
  btn.innerHTML = playing
    ? '<svg viewBox="0 0 24 24"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>'
    : '<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>';
}

function addWrapUp(G){
  var tw = 0, ts = 0, tf = 0, answered = 0, total = 0, parts = 0;
  PARTS.forEach(function(p,i){
    total += qCount(p);
    if (state.log[i].length === qCount(p)) parts++;
    state.log[i].forEach(function(a){ tw += a.words; ts += a.secs; tf += countFillers(a.text); answered++; });
  });
  var el = document.createElement('div');
  var isEd = G.key === 'ed';
  el.className = 'turn gradehead' + (isEd ? ' ed' : '');
  el.innerHTML =
    '<div class="who">' + (isEd ? '<span class="edtile">' + edSvg(52) + '</span>' : '') + '<div>'
      + '<div class="lbl">' + (isEd ? 'Graded by Ed' : 'Graded by your teacher') + '</div>'
      + '<h2>' + esc(G.name) + '</h2>'
      + '<p class="sub">' + esc(G.role) + ' · marked ' + esc(G.graded) + '<br>'
      + answered + ' answers · ' + clock(ts) + ' of speaking · ' + tw + ' words</p></div></div>'
    + (PARTS.length > 1 ? '<div class="bands">' + PARTS.map(function(p,i){
        return '<div class="pb"><span class="n">' + p.name + '</span>'
          + '<span class="v">' + partBand(i, G).toFixed(1) + '</span></div>';
      }).join('') + '</div>' : '')
    + '<div class="overall"><div class="n">' + (PARTS.length > 1 ? 'Overall band' : PARTS[0].name + ' band') + '</div>'
      + '<div class="v">' + overallBand(G).toFixed(1) + '</div></div>';
  thread.appendChild(el);
}

/* ============================ composer ============================ */
function renderComposer(){
  if (state.stage === 'analysing') return renderWaitBar();
  if (state.finished) return renderComplete();
  if (state.stage === 'ended') return renderEndedBar();
  if (state.stage === 'moving' || state.stage === 'closing' || state.stage === 'analysing') return renderWaitBar();
  if (state.stage === 'prep') return renderPrep();

  var p = part(), answering = state.stage === 'answering', isCue = p.kind === 'cue';
  var hint = state.recording ? clock(state.seconds) + (isCue ? ' / 2:00' : ' · tap to stop')
            : (state.seconds > 0 ? clock(state.seconds) + ' saved' : 'Tap to answer');

  composer.innerHTML =
    '<div class="micwrap">'
      + '<button class="mic' + (state.recording ? ' live' : '') + '" id="micBtn"' + (answering ? '' : ' disabled') + ' aria-label="Record your answer">'
        + '<svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>'
      + '<span class="miclab" id="micLab">' + (state.recording ? 'Recording' : (state.seconds > 0 ? 'Recorded' : 'Ready')) + '</span>'
      + '<span class="michint" id="micHint">' + hint + '</span>'
    + '</div>'
    + '<div class="writer">'
      + '<textarea class="answerbox" id="answer" ' + (answering ? '' : 'disabled ')
        + 'placeholder="' + (isCue ? 'Speak for one to two minutes. Your speech appears here as you talk.'
                                   : 'Your speech appears here as you talk. You can correct it before sending.') + '"></textarea>'
      + '<div class="writerbar">'
        + '<span class="count" id="count">0 words</span>'
        + '<button class="linkbtn" id="sampleBtn">Load sample answer</button>'
        + '<button class="act" id="sendBtn" disabled>'
        + (isCue ? 'Finish long turn' : (state.q + 1 < p.questions.length ? 'Next question' : 'Finish ' + p.name))
        + ' <svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>'
      + '</div>'
    + '</div>';

  var box = document.getElementById('answer');
  box.value = state.draft || '';
  updateCount();
  box.addEventListener('input', function(){ state.draft = box.value; updateCount(); });
  document.getElementById('micBtn').addEventListener('click', toggleRecord);
  document.getElementById('sampleBtn').addEventListener('click', loadSample);
  document.getElementById('sendBtn').addEventListener('click', send);
}

function renderPrep(){
  composer.innerHTML =
    '<div class="prepwrap">'
      + '<div class="prepdial' + (state.prepLeft <= 15 ? ' low' : '') + '" id="prepDial">' + clock(state.prepLeft) + '</div>'
      + '<span class="miclab">Preparing</span><span class="michint">1 minute</span></div>'
    + '<div class="writer">'
      + '<textarea class="answerbox" id="notes" placeholder="Make notes here, as you would on the paper the examiner gives you. Notes are not graded."></textarea>'
      + '<div class="writerbar"><span class="count">Notes are private</span>'
        + '<button class="act" id="startBtn">Start speaking now'
        + ' <svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button></div>'
    + '</div>';
  var n = document.getElementById('notes');
  n.value = state.notes;
  n.addEventListener('input', function(){ state.notes = n.value; });
  document.getElementById('startBtn').addEventListener('click', endPrep);
}

/* While the examiner is moving between parts, or closing the test. */
function renderWaitBar(){
  var msg = state.stage === 'analysing'
    ? (teacherStatus === 'shown' ? 'Loading your teacher’s feedback…' : 'Ed is grading your answers…')
    : state.stage === 'closing' ? 'The examiner is finishing the test…'
    : 'The examiner is moving on to the next part…';
  composer.innerHTML =
    '<div class="prepwrap">'
      + '<div class="prepdial"><svg viewBox="0 0 24 24"><path d="M12 6v6l4 2"/><circle cx="12" cy="12" r="9"/></svg></div>'
      + '<span class="miclab">Listening</span><span class="michint">Please wait</span></div>'
    + '<div class="writer">'
      + '<div class="saved"><span>' + msg + '</span></div>'
      + '<div class="writerbar"><span class="count">Your microphone is off while the examiner speaks</span></div>'
    + '</div>';
}

/* The test is over. Nothing graded yet — Finish asks who should grade it. */
function renderEndedBar(){
  var tw = 0, ts = 0, n = 0;
  state.log.forEach(function(ans){ ans.forEach(function(a){ tw += a.words; ts += a.secs; n++; }); });
  composer.innerHTML =
    '<div class="donewrap">'
      + '<div class="prepdial"><svg viewBox="0 0 24 24"><path d="M5 13l4 4L19 7"/></svg></div>'
      + '<span class="miclab">Test over</span><span class="michint">' + n + ' answers saved</span></div>'
    + '<div class="writer">'
      + '<div class="saved"><span>The interview is complete. All speaking files have been saved. '
      + 'Press Finish to send it to Ed for instant grading, or to your teacher.</span>'
        + '<button class="act" id="finishBtn">'
        + '<svg viewBox="0 0 24 24"><path d="M5 13l4 4L19 7"/></svg> Finish</button></div>'
      + '<div class="writerbar"><span class="count">' + tw + ' words · ' + clock(ts) + ' spoken</span>'
        + '<button class="act ghost" id="leaveBtn">'
        + '<svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7M3 4v5h5"/></svg> Take the test again</button></div>'
    + '</div>';
  document.getElementById('finishBtn').addEventListener('click', openPicker);
  document.getElementById('leaveBtn').addEventListener('click', restart);
}

/* After Finish. Three cases: waiting on the teacher, teacher's grading ready to open,
   or a grading on screen (Ed's, the teacher's, or both). */
function renderComplete(){
  var tw = 0;
  state.log.forEach(function(ans){ ans.forEach(function(a){ tw += a.words; }); });
  var hasEd = state.graders.indexOf('ed') > -1, hasTeacher = state.graders.indexOf('teacher') > -1;

  var lab, hint, msg, main, extra = '';
  if (teacherStatus === 'waiting'){
    lab = 'Submitted'; hint = 'With Ms. Hạnh';
    msg = 'Your teacher has your submission. We’ll notify you when the grading is ready.';
    main = '<button class="act ghost" id="topBtn"><svg viewBox="0 0 24 24"><path d="M12 19V5M6 11l6-6 6 6"/></svg> Back to the top</button>';
    extra = '<button class="demo" id="demoBtn">Demo: teacher sends the grading back</button>';
  } else if (teacherStatus === 'returned'){
    lab = 'Graded'; hint = 'Ready to view';
    msg = 'Ms. Hạnh has graded your ' + (ONLY === null ? 'test' : PARTS[0].name) + '.';
    main = '<button class="act" id="viewBtn">View teacher grading <svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>';
  } else {
    lab = 'Complete'; hint = 'Tap to practise again';
    msg = (teacherStatus === 'shown' ? 'Your teacher’s grading is below.' : 'Ed’s grading is below.')
      + ' Each answer shows what was marked on it.';
    main = '<button class="act" id="topBtn"><svg viewBox="0 0 24 24"><path d="M12 19V5M6 11l6-6 6 6"/></svg> Back to the top</button>';
    if (hasEd && !hasTeacher)
      extra = '<button class="act ghost" id="alsoTeacherBtn" style="margin-left:0">Also send to your teacher</button>';
  }

  composer.innerHTML =
    '<div class="donewrap">'
      + (teacherStatus === 'waiting'
          ? '<div class="prepdial"><svg viewBox="0 0 24 24"><path d="M12 6v6l4 2"/><circle cx="12" cy="12" r="9"/></svg></div>'
          : '<button class="donebtn" id="againBtn" aria-label="Practise again"><svg viewBox="0 0 24 24"><path d="M5 13l4 4L19 7"/></svg></button>')
      + '<span class="miclab">' + lab + '</span><span class="michint">' + hint + '</span></div>'
    + '<div class="writer">'
      + '<div class="saved"><span>' + msg + '</span>' + main + '</div>'
      + '<div class="writerbar"><span class="count">' + tw + ' words spoken</span>' + extra
        + '<button class="act ghost" id="restartBtn">'
        + '<svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7M3 4v5h5"/></svg> Practise from the beginning</button></div>'
    + '</div>';

  function on(id, fn){ var b = document.getElementById(id); if (b) b.addEventListener('click', fn); }
  on('againBtn', restart);
  on('restartBtn', restart);
  on('topBtn', function(){ thread.scrollTo({ top:0, behavior:'smooth' }); });
  on('demoBtn', teacherReturns);
  on('viewBtn', openTeacherGrading);
  on('alsoTeacherBtn', sendToTeacher);
}

function updateCount(){
  var box = document.getElementById('answer');
  if (!box) return;
  var n = words(box.value).length;
  document.getElementById('count').textContent = n + (n === 1 ? ' word' : ' words');
  var b = document.getElementById('sendBtn');
  if (b) b.disabled = n === 0;
}

/* ============================ actions ============================ */
function toggleRecord(){
  var isCue = part().kind === 'cue';
  if (state.recording){
    state.recording = false;
    clearInterval(state.timer); state.timer = null;
    var b = document.getElementById('micBtn');
    if (b){
      b.className = 'mic';
      document.getElementById('micLab').textContent = 'Recorded';
      document.getElementById('micHint').textContent = clock(state.seconds) + ' saved';
    }
  } else {
    state.recording = true;
    state.seconds = 0;
    document.getElementById('micBtn').className = 'mic live';
    document.getElementById('micLab').textContent = 'Recording';
    state.timer = setInterval(function(){
      state.seconds++;
      var h = document.getElementById('micHint');
      if (h) h.textContent = clock(state.seconds) + (isCue ? ' / 2:00' : ' · tap to stop');
      if (isCue && state.seconds >= 120) toggleRecord();
    }, 1000);
  }
}

function startPrep(){
  state.stage = 'prep';
  state.prepLeft = PREP_SECONDS;
  renderRail();
  renderComposer();
  state.prepTimer = setInterval(function(){
    state.prepLeft--;
    var d = document.getElementById('prepDial');
    if (d){
      d.textContent = clock(state.prepLeft);
      d.className = 'prepdial' + (state.prepLeft <= 15 ? ' low' : '');
    }
    if (state.prepLeft <= 0) endPrep();
  }, 1000);
}

function endPrep(){
  clearInterval(state.prepTimer); state.prepTimer = null;
  state.stage = 'answering';
  renderRail();
  renderComposer();
}

function loadSample(){
  var p = part(), box = document.getElementById('answer');
  box.value = p.kind === 'cue' ? p.sample : p.questions[state.q].sample;
  state.draft = box.value;
  if (state.seconds === 0){
    state.seconds = Math.round(words(box.value).length / (p.kind === 'cue' ? 1.3 : 2.1));
    document.getElementById('micLab').textContent = 'Recorded';
    document.getElementById('micHint').textContent = clock(state.seconds) + ' saved';
  }
  updateCount();
  box.focus();
}

function send(){
  var p = part(), box = document.getElementById('answer');
  var text = box.value.trim();
  if (!text) return;
  if (state.recording) toggleRecord();

  state.log[state.p].push({ text:text, words:words(text).length, secs:state.seconds });
  addAnswer(text, state.seconds, p.kind === 'cue' ? p.name + ' · Long turn' : p.name + ' · Question ' + (state.q + 1));
  state.draft = '';
  state.seconds = 0;

  if (p.kind === 'questions' && state.q + 1 < p.questions.length){
    state.q++;
    state.stage = 'asking';
    renderRail();
    renderComposer();
    setTimeout(askQuestion, 450);
  } else if (state.p + 1 < PARTS.length){
    nextPart();
  } else {
    endTest();
  }
}

/* The examiner introduces the next part and carries straight on — no pause, no coach. */
function nextPart(){
  state.stage = 'moving';
  renderRail();
  renderComposer();

  examinerSays(state.p === 0 ? SCRIPT.toPart2 : SCRIPT.toPart3, function(){
    state.p++;
    state.q = 0;
    state.seconds = 0;
    state.notes = '';
    state.stage = 'asking';
    renderRail();
    renderComposer();
    divider(PARTS[state.p].name + ' · ' + PARTS[state.p].desc, true);
    if (part().kind === 'cue') setTimeout(showCue, 350);
    else setTimeout(askQuestion, 350);
  });
}

function restart(){
  clearInterval(state.timer); clearInterval(state.prepTimer); clearInterval(state.playTimer);
  state = { p:0, q:0, stage:'asking', recording:false, seconds:0, timer:null, prepTimer:null,
            prepLeft:PREP_SECONDS, draft:'', notes:'', log:PARTS.map(function(){ return []; }), finished:false,
            playing:null, playTimer:null, playPos:0, graders:[] };
  teacherStatus = null;
  picker.hidden = true;
  document.getElementById('notice').hidden = true;
  thread.innerHTML = '';
  start();
}

/* Opens on the first part. Part 2 starts with the task card, not a question. */
function start(){
  renderRail();
  renderComposer();
  divider(PARTS[0].name + ' · ' + PARTS[0].desc, true);
  if (part().kind === 'cue') setTimeout(showCue, 350);
  else askQuestion();
}

document.getElementById('endBtn').addEventListener('click', restart);
document.getElementById('replayBtn').addEventListener('click', scrollDown);

start();
})();
</script>
